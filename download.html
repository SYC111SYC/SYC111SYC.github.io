<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件分享</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>文件分享</h1>
        <nav>
            <a href="index.html">首页</a>
            <a href="download.html" class="nav-active">文件分享</a>
        </nav>
    </header>

    <main id="fileList">加载中...</main>

    <script>
        // 配置：你的仓库地址
        const GITHUB_REPO = "SYC111SYC/SYC111SYC.github.io";
        const FILE_DIR = "files";

        // 格式化文件大小
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + " B";
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
            return (bytes / (1024 * 1024)).toFixed(1) + " MB";
        }

        // 提取文件类型
        function getFileType(filename) {
            const ext = filename.split('.').pop().toUpperCase();
            return ext || "文件";
        }

        // 调用GitHub API获取文件列表
        fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${FILE_DIR}`)
            .then(res => {
                if (!res.ok) throw new Error("获取文件列表失败");
                return res.json();
            })
            .then(data => {
                // 只保留文件，过滤文件夹
                const files = data.filter(item => item.type === "file");
                renderFiles(files);
            })
            .catch(err => {
                document.getElementById('fileList').innerHTML = 
                    '<p class="error">加载失败，请检查仓库是否公开或网络</p>';
                console.error(err);
            });

        function renderFiles(files) {
            const container = document.getElementById('fileList');
            if (files.length === 0) {
                container.innerHTML = '<p>暂无分享文件</p>';
                return;
            }

            let html = '';
            files.forEach(file => {
                const fileType = getFileType(file.name);
                const fileSize = formatSize(file.size);
                
                html += `
                <div class="post-card file-card">
                    <div class="file-info">
                        <div class="file-header">
                            <span class="file-type-tag">${fileType}</span>
                            <h3 class="file-name">${file.name}</h3>
                        </div>
                        <div class="file-meta">
                            <span>${fileSize}</span>
                        </div>
                    </div>
                    <a class="download-btn" href="${FILE_DIR}/${file.name}" download="${file.name}">下载</a>
                </div>
                `;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
