<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帖子详情</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>帖子详情</h1>
        <nav>
            <a href="index.html">← 返回首页</a>
        </nav>
    </header>

    <main id="postDetail">加载中...</main>

    <div id="commentSection" class="comment-area">
        <!-- Giscus 评论区将在这里加载 -->
    </div>

    <script src="js/main.js"></script>
    <script>
        // 获取URL中的帖子ID
        function getPostId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        const postId = getPostId();

        async function fetchPostsWithRetry() {
            let lastError;
            for (let attempt = 0; attempt < 3; attempt++) {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 20000);
                try {
                    const response = await fetch('posts.json', {
                        cache: 'no-cache',
                        signal: controller.signal
                    });
                    if (!response.ok) {
                        throw new Error(`posts.json 请求失败：HTTP ${response.status}`);
                    }
                    const text = await response.text();
                    const data = JSON.parse(text);
                    if (!data || !Array.isArray(data.posts)) {
                        throw new Error('posts.json 格式无效：缺少 posts 数组');
                    }
                    return data;
                } catch (err) {
                    lastError = err;
                    if (attempt < 2) {
                        await new Promise(resolve => setTimeout(resolve, 400 * (attempt + 1)));
                    }
                } finally {
                    clearTimeout(timeout);
                }
            }
            throw lastError;
        }

        function loadMarkedWithRetry() {
            if (window.marked && typeof window.marked.parse === 'function') {
                return Promise.resolve(true);
            }
            const sources = [
                'https://cdn.jsdelivr.net/npm/marked/marked.min.js',
                'https://unpkg.com/marked/marked.min.js'
            ];
            return sources.reduce(function(previous, source) {
                return previous.then(function(loaded) {
                    if (loaded) return true;
                    return new Promise(function(resolve) {
                        const script = document.createElement('script');
                        const timeout = setTimeout(function() {
                            script.remove();
                            resolve(false);
                        }, 5000);
                        script.src = source;
                        script.onload = function() {
                            clearTimeout(timeout);
                            resolve(Boolean(window.marked && typeof window.marked.parse === 'function'));
                        };
                        script.onerror = function() {
                            clearTimeout(timeout);
                            resolve(false);
                        };
                        document.head.appendChild(script);
                    });
                });
            }, Promise.resolve(false));
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(character) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[character];
            });
        }

        Promise.all([fetchPostsWithRetry(), loadMarkedWithRetry()])
            .then(([data, markdownReady]) => {
                const post = data.posts.find(p => p.id === postId);
                const container = document.getElementById('postDetail');
                
                if (!post) {
                    container.innerHTML = '<p class="error">帖子不存在</p>';
                    return;
                }

                // Markdown 渲染为 HTML
                let contentHtml;
                let markdownWarning = '';
                try {
                    if (!markdownReady || !window.marked || typeof window.marked.parse !== 'function') {
                        throw new Error('Markdown 渲染器不可用');
                    }
                    contentHtml = window.marked.parse(String(post.content || ''));
                } catch (err) {
                    console.error('Markdown 渲染失败，改用纯文本显示：', err);
                    contentHtml = `<pre style="white-space:pre-wrap;overflow-wrap:anywhere">${escapeHtml(String(post.content || ''))}</pre>`;
                    markdownWarning = '<p class="error" role="alert">Markdown渲染组件暂不可用，以下以纯文本显示稿件。</p>';
                }
                
                container.innerHTML = `
                    <article class="post-full">
                        <h1 class="post-title">${post.title}</h1>
                        <div class="post-meta">${post.date} · 作者：${post.author}</div>
                        ${markdownWarning}
                        <div class="post-content">${contentHtml}</div>
                    </article>
                `;

                // 动态修改页面标题，确保每篇帖子对应独立评论区
                document.title = post.title + " - 我的发帖站";

                // 加载 Giscus 评论
                loadGiscus();
            })
            .catch(err => {
                document.getElementById('postDetail').innerHTML = '<p class="error">稿件加载失败，请检查网络后刷新。</p>';
                console.error(err);
            });

        // Giscus 评论加载函数（已填好你的全部参数 + 按标题映射）
        function loadGiscus() {
            const script = document.createElement('script');
            script.src = "https://giscus.app/client.js";
            script.setAttribute('data-repo', "SYC111SYC/SYC111SYC.github.io");
            script.setAttribute('data-repo-id', "R_kgDOVDpBrA");
            script.setAttribute('data-category', "Announcements");
            script.setAttribute('data-category-id', "DIC_kwDOVDpBrM4DIUKB");
            script.setAttribute('data-mapping', "title");
            script.setAttribute('data-strict', "0");
            script.setAttribute('data-reactions-enabled', "1");
            script.setAttribute('data-emit-metadata', "0");
            script.setAttribute('data-input-position', "bottom");
            script.setAttribute('data-theme', "noborder_light");
            script.setAttribute('data-lang', "zh-CN");
            script.setAttribute('crossorigin', "anonymous");
            script.async = true;
            
            document.getElementById('commentSection').appendChild(script);
        }
    </script>
</body>
</html>
