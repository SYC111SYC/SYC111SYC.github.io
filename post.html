<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帖子详情</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>帖子详情</h1>
        <nav>
            <a href="index.html">← 返回首页</a>
        </nav>
    </header>

    <main id="postDetail">加载中...</main>

    <div id="commentSection" class="comment-area">
        <!-- Giscus 评论区将在这里加载 -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        // 获取URL中的帖子ID
        function getPostId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        const postId = getPostId();

        fetch('posts.json')
            .then(res => res.json())
            .then(data => {
                const post = data.posts.find(p => p.id === postId);
                const container = document.getElementById('postDetail');
                
                if (!post) {
                    container.innerHTML = '<p class="error">帖子不存在</p>';
                    return;
                }

                // Markdown 渲染为 HTML
                const contentHtml = marked.parse(post.content);
                
                container.innerHTML = `
                    <article class="post-full">
                        <h1 class="post-title">${post.title}</h1>
                        <div class="post-meta">${post.date} · 作者：${post.author}</div>
                        <div class="post-content">${contentHtml}</div>
                    </article>
                `;

                // 动态修改页面标题，确保每篇帖子对应独立评论区
                document.title = post.title + " - 我的发帖站";

                // 加载 Giscus 评论
                loadGiscus();
            })
            .catch(err => {
                document.getElementById('postDetail').innerHTML = '<p class="error">加载失败</p>';
                console.error(err);
            });

        // Giscus 评论加载函数（已填好你的全部参数 + 按标题映射）
        function loadGiscus() {
            const script = document.createElement('script');
            script.src = "https://giscus.app/client.js";
            script.setAttribute('data-repo', "SYC111SYC/SYC111SYC.github.io");
            script.setAttribute('data-repo-id', "R_kgDOVDpBrA");
            script.setAttribute('data-category', "Announcements");
            script.setAttribute('data-category-id', "DIC_kwDOVDpBrM4DIUKB");
            script.setAttribute('data-mapping', "title");
            script.setAttribute('data-strict', "0");
            script.setAttribute('data-reactions-enabled', "1");
            script.setAttribute('data-emit-metadata', "0");
            script.setAttribute('data-input-position', "bottom");
            script.setAttribute('data-theme', "noborder_light");
            script.setAttribute('data-lang', "zh-CN");
            script.setAttribute('crossorigin', "anonymous");
            script.async = true;
            
            document.getElementById('commentSection').appendChild(script);
        }
    </script>
</body>
</html>
