<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fa">
  <title>猫球对决 · Catball Arena</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10172b;
      --panel: rgba(26, 36, 61, .92);
      --line: rgba(177, 196, 255, .16);
      --muted: #9aa8c8;
      --mint: #7af3d1;
      --pink: #ff83a8;
      --gold: #ffd675;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: #f3f5ff;
      background:
        radial-gradient(ellipse at 50% -18%, rgba(86, 122, 207, .28), transparent 55%),
        radial-gradient(ellipse at 100% 80%, rgba(200, 89, 143, .12), transparent 35%),
        var(--bg);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    button { font: inherit; }
    .page { width: min(1120px, calc(100% - 28px)); margin: 0 auto; padding: 18px 0 24px; }
    .topbar, .heading, .hud, .hud-side, .actions, .footer { display: flex; align-items: center; }
    .topbar, .heading { justify-content: space-between; gap: 16px; }
    .topbar { margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 900; letter-spacing: .15em; }
    .brand-mark {
      display: grid; width: 36px; height: 36px; place-items: center; border: 1px solid rgba(122,243,209,.5);
      border-radius: 12px; color: var(--mint); background: rgba(122,243,209,.09); font-size: 19px;
      box-shadow: 0 0 24px rgba(122,243,209,.1);
    }
    .actions { gap: 8px; }
    .quiet, .mode-button, .primary, .touch-controls button {
      border: 1px solid var(--line); border-radius: 11px; color: #e8edff; background: rgba(255,255,255,.045);
      cursor: pointer; transition: transform .15s, border-color .15s, background .15s;
    }
    .quiet { min-height: 38px; padding: 0 12px; font-size: 12px; }
    .quiet:hover, .mode-button:hover { border-color: rgba(122,243,209,.45); background: rgba(122,243,209,.08); }
    .heading { align-items: end; margin-bottom: 17px; }
    .eyebrow { margin: 0 0 7px; color: var(--mint); font-size: 10px; font-weight: 900; letter-spacing: .2em; }
    h1 { margin: 0; font-size: clamp(29px, 4vw, 43px); letter-spacing: -.04em; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .points { flex: 0 0 auto; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.035); text-align: right; }
    .points small { display: block; margin-bottom: 3px; color: var(--muted); font-size: 10px; }
    .points strong { color: var(--gold); font-size: 19px; }
    .game-card { overflow: hidden; border: 1px solid rgba(170,190,255,.19); border-radius: 18px; background: var(--panel); box-shadow: 0 24px 80px rgba(0,0,0,.32); }
    .hud { justify-content: space-between; gap: 16px; min-height: 77px; padding: 12px 19px; border-bottom: 1px solid var(--line); }
    .hud-side { gap: 13px; min-width: 0; }
    .hud-side.right { justify-content: flex-end; text-align: right; }
    .cat-icon { width: 40px; height: 40px; object-fit: contain; }
    .player-name { max-width: 145px; overflow: hidden; color: #fff; font-size: 12px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .health { display: flex; width: 145px; height: 8px; overflow: hidden; margin-top: 7px; border-radius: 9px; background: #39435f; }
    .health span { width: 100%; border-radius: inherit; background: linear-gradient(90deg, #73ebc2, #b5f17e); transition: width .18s; }
    .right .health span { margin-left: auto; background: linear-gradient(90deg, #ffca7b, #ff799f); }
    .vs { color: #8997b8; font-size: 11px; font-weight: 900; letter-spacing: .1em; }
    .arena { position: relative; overflow: hidden; background: #182b36; }
    canvas { display: block; width: 100%; aspect-ratio: 16 / 9; touch-action: none; }
    .overlay {
      position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; padding: 18px;
      background: rgba(9, 14, 29, .72); backdrop-filter: blur(5px);
    }
    .overlay-card {
      width: min(510px, 100%); max-height: 100%; overflow: auto; padding: 25px;
      border: 1px solid rgba(178,197,255,.22); border-radius: 17px; background: rgba(23,31,54,.96);
      box-shadow: 0 20px 60px rgba(0,0,0,.35); text-align: center;
    }
    .overlay-icon {
      display: grid; width: 48px; height: 48px; margin: 0 auto 13px; place-items: center;
      border: 1px solid rgba(122,243,209,.34); border-radius: 15px; color: var(--mint);
      background: rgba(122,243,209,.08); font-size: 23px;
    }
    .overlay-card h2 { margin: 0 0 8px; font-size: 23px; }
    .overlay-card p { margin: 0 auto 17px; color: #a7b2ce; font-size: 12px; line-height: 1.75; }
    .mode-list { display: grid; gap: 9px; }
    .mode-button { min-height: 48px; padding: 9px 13px; text-align: left; }
    .mode-button strong { display: block; margin-bottom: 3px; font-size: 13px; }
    .mode-button span { color: var(--muted); font-size: 10px; }
    .primary { min-height: 43px; padding: 0 22px; border: 0; color: #11242d; background: linear-gradient(135deg,#82f5d4,#7fc7ff); font-size: 13px; font-weight: 900; }
    .primary:hover { transform: translateY(-2px); }
    .overlay-status { min-height: 18px; margin-top: 13px; color: var(--mint); font-size: 11px; }
    .bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 12px; }
    .info { min-height: 66px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.028); }
    .info strong { display: block; margin-bottom: 5px; font-size: 11px; }
    .info span { color: var(--muted); font-size: 10px; line-height: 1.6; }
    .touch-controls { display: none; grid-template-columns: repeat(5, 1fr); gap: 7px; padding: 10px; border-top: 1px solid var(--line); }
    .touch-controls button { min-height: 46px; padding: 4px; font-size: 11px; font-weight: 800; touch-action: none; user-select: none; }
    .touch-controls button:active, .touch-controls button.active { border-color: rgba(122,243,209,.6); color: var(--mint); background: rgba(122,243,209,.12); }
    .footer { justify-content: space-between; gap: 12px; margin-top: 14px; color: #74809f; font-size: 10px; }
    [hidden] { display: none !important; }
    @media (max-width: 700px) {
      .page { width: min(100% - 18px, 620px); padding-top: 12px; }
      .topbar { margin-bottom: 17px; }
      .heading { align-items: start; }
      .subtitle { max-width: 90%; font-size: 11px; }
      .points { padding: 8px 10px; }
      .points strong { font-size: 16px; }
      .hud { min-height: 64px; gap: 5px; padding: 8px 10px; }
      .hud-side { gap: 7px; }
      .cat-icon { width: 32px; height: 32px; }
      .player-name { max-width: 105px; font-size: 10px; }
      .health { width: min(25vw, 115px); height: 7px; }
      .touch-controls { display: grid; }
      .bottom { grid-template-columns: 1fr; gap: 7px; margin-top: 8px; }
      .info { min-height: auto; padding: 9px 11px; }
      .overlay-card { padding: 18px; }
      .footer { font-size: 9px; }
    }
    @media (max-width: 390px) {
      .brand { font-size: 10px; }
      .quiet { min-height: 34px; padding: 0 8px; font-size: 10px; }
      .hud { padding-right: 7px; padding-left: 7px; }
      .player-name { max-width: 82px; font-size: 9px; }
      .health { width: 22vw; }
      .touch-controls { gap: 4px; padding: 7px; }
      .touch-controls button { min-height: 42px; font-size: 9px; }
    }
    :root {
      color-scheme: light;
      --bg: #fff;
      --panel: #fff;
      --line: #ccc;
      --muted: #657184;
      --mint: #557a6c;
      --pink: #c65b74;
      --gold: #8a641c;
    }
    body { color: #303545; background: #fff; font-family: system-ui, "Microsoft YaHei", sans-serif; }
    .page { width: min(900px, calc(100% - 24px)); padding: 0 0 18px; }
    .topbar { margin-bottom: 12px; }
    .brand-mark { border-color: #b7c8bc; border-radius: 8px; color: #557a6c; background: #f3f7f4; box-shadow: none; }
    .quiet, .mode-button, .primary, .touch-controls button { border-color: #cbd1dc; border-radius: 6px; color: #303545; background: #f3f4f6; }
    .quiet { min-height: 34px; }
    .quiet:hover, .mode-button:hover { border-color: #8fb0ff; background: #eef3ff; }
    .heading { align-items: center; margin-bottom: 10px; }
    .eyebrow { color: #648574; }
    .points, .info { border-color: #ccc; border-radius: 8px; background: #fff; }
    .points strong { color: #765a19; }
    .game-card { border: 1px solid #ccc; border-radius: 8px; background: #fff; box-shadow: none; }
    .hud { min-height: 62px; padding: 8px 12px; border-bottom-color: #ddd; }
    .player-name { color: #303545; }
    .health { background: #e5e8ed; }
    .vs { color: #707a8b; }
    .overlay { background: rgba(245,247,250,.84); backdrop-filter: blur(2px); }
    .overlay-card { border-color: #cbd1dc; border-radius: 8px; background: #fff; box-shadow: 0 5px 20px #00000012; }
    .overlay-icon { border-color: #b7c8bc; border-radius: 8px; color: #557a6c; background: #f3f7f4; }
    .overlay-card p { color: #657184; }
    .mode-button span { color: #657184; }
    .primary { border: 0; color: #fff; background: #8fb0ff; }
    .primary:hover { background: #769cf3; }
    .overlay-status { color: #557a6c; }
    .info { min-height: 58px; }
    .info span { color: #657184; }
    .touch-controls { grid-template-columns: minmax(150px, 1fr) minmax(118px, .75fr); align-items: center; gap: 12px; padding: 10px; }
    .dpad { display: grid; width: 144px; grid-template: repeat(3, 42px) / repeat(3, 42px); justify-self: center; gap: 3px; }
    .dpad button { min-height: 42px; padding: 0; font-size: 17px; }
    .dpad .up { grid-area: 1 / 2; }
    .dpad .left { grid-area: 2 / 1; }
    .dpad .center { grid-area: 2 / 2; display: grid; place-items: center; color: #9aa2af; font-size: 14px; }
    .dpad .right { grid-area: 2 / 3; }
    .dpad .down { grid-area: 3 / 2; }
    .touch-controls button { min-height: 43px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .touch-controls button:active, .touch-controls button.active { border-color: #8fb0ff; color: #3357a4; background: #e8efff; }
    .footer { color: #657184; }
    @media (max-width: 700px) {
      .page { width: min(100% - 20px, 620px); padding-top: 8px; }
      .topbar { margin-bottom: 10px; }
      .touch-controls { grid-template-columns: minmax(140px, 1fr) minmax(105px, .75fr); }
    }
    @media (max-width: 390px) {
      .touch-controls { gap: 6px; padding: 7px; }
      .dpad { width: 132px; grid-template: repeat(3, 39px) / repeat(3, 39px); }
      .dpad button { min-height: 39px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✦</span><span>CATBALL&nbsp; / &nbsp;ARENA</span></div>
      <div class="actions">
        <button class="quiet" id="menuButton" type="button">模式菜单</button>
        <a class="quiet" href="index.html" style="display:inline-flex;align-items:center;text-decoration:none">返回首页</a>
      </div>
    </header>
    <section class="heading">
      <div>
        <p class="eyebrow">猫球擂台 · 拾取装备 · 灵活走位</p>
        <h1>猫球对决</h1>
        <p class="subtitle">抢先拾取道具，瞄准对手出击。获胜可得 12 积分，装扮和猫球名字与首页同步。</p>
      </div>
      <div class="points"><small>猫球积分</small><strong id="pointsValue">0</strong></div>
    </section>
    <section class="game-card" aria-label="猫球对决游戏">
      <div class="hud">
        <div class="hud-side">
          <img class="cat-icon" src="images/catball.png" alt="">
          <div><div class="player-name" id="p1Name">玩家 1</div><div class="health"><span id="p1Health"></span></div></div>
        </div>
        <div class="vs">VS</div>
        <div class="hud-side right">
          <div><div class="player-name" id="p2Name">玩家 2</div><div class="health"><span id="p2Health"></span></div></div>
          <img class="cat-icon" src="images/catball.png" alt="">
        </div>
      </div>
      <div class="arena">
        <canvas id="arenaCanvas" width="960" height="540" aria-label="猫球战斗场地"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-card">
            <div class="overlay-icon" id="overlayIcon">🐾</div>
            <h2 id="overlayTitle">准备好开战了吗？</h2>
            <p id="overlayCopy">收集场地道具并击败对手。生命值归零时战斗结束。</p>
            <div class="mode-list" id="modeList">
              <button class="mode-button" type="button" data-mode="ai"><strong>🤖 人机对战</strong><span>WASD 移动 · 鼠标瞄准 · 空格使用/攻击</span></button>
              <button class="mode-button" type="button" data-mode="local"><strong>⚔️ 本地 2 人</strong><span>P1：WASD + 空格　·　P2：方向键 + M</span></button>
              <button class="mode-button" type="button" data-mode="online"><strong>🌐 联机双人</strong><span>GoEasy 自动匹配在线玩家</span></button>
            </div>
            <div class="overlay-status" id="overlayStatus" role="status" aria-live="polite"></div>
            <button class="primary" id="overlayAction" type="button" hidden>再来一局</button>
          </div>
        </div>
      </div>
      <div class="touch-controls" aria-label="触屏操作">
        <div class="dpad" aria-label="移动">
          <button class="up" type="button" data-control="up" aria-label="上移">▲</button>
          <button class="left" type="button" data-control="left" aria-label="左移">◀</button>
          <span class="center" aria-hidden="true">●</span>
          <button class="right" type="button" data-control="right" aria-label="右移">▶</button>
          <button class="down" type="button" data-control="down" aria-label="下移">▼</button>
        </div>
        <button type="button" data-control="fire">使用 / 攻击</button>
      </div>
    </section>
    <section class="bottom">
      <div class="info"><strong id="itemStatus">道具：空手</strong><span id="gameStatus">移动探索，靠近道具即可拾取；空手时靠近敌人按出击键肉搏。</span></div>
      <div class="info"><strong>战场规则</strong><span>手雷延迟爆炸 · 子弹可被掩体挡住 · 猫粮会引开对手 · 药包持续回血</span></div>
    </section>
    <footer class="footer"><span>单局获胜奖励 +12 首页积分</span><span>触屏：方向按钮移动，点场地瞄准，使用按钮出击</span></footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/goeasy-lite@2.13.24/goeasy-lite.min.js"></script>
  <script>
    (() => {
      "use strict";
      const W = 960, H = 540, ECONOMY_KEY = "catball_economy_v1";
      const NAME_KEY = "catball_pet_name_v1", GOEASY_KEY = "BC-6c13f16b458f45548f069666edacbd91";
      const GOEASY_HOST = "hangzhou.goeasy.io", LOBBY = "catball-pvp-lobby-syc111syc-v1";
      const INBOX = "catball-pvp-inbox-";
      const canvas = document.getElementById("arenaCanvas");
      const ctx = canvas.getContext("2d");
      const $ = id => document.getElementById(id);
      const keys = new Set(), touchInput = { up: false, down: false, left: false, right: false, fire: false };
      const activeTouchPointers = new Map();
      let pointerTarget = null;
      const catImage = new Image();
      catImage.src = "images/catball.png";
      let cosmetic = "", catName = "猫球", points = 0, mode = "", state = null, lastFrame = 0;
      let goeasy = null, connected = false, peerId = "", opponentId = "", opponentProfile = null;
      let peers = new Map(), queueTimer = null, snapshotTimer = 0, lastInputSend = 0, inputSeq = 0;
      let overlayState = "menu", resultMessage = "", rewardedGameIds = new Set();
      const terrain = [
        { x: 276, y: 167, w: 60, h: 44 }, { x: 614, y: 328, w: 65, h: 48 },
        { x: 457, y: 95, w: 47, h: 34 }, { x: 442, y: 405, w: 55, h: 38 }
      ];
      const itemInfo = {
        grenade: { label: "手雷", color: "#ffc767", svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><path d="M12 8h8v4h4v11a8 8 0 0 1-16 0V12h4z" fill="#ffc767" stroke="#573d20" stroke-width="2"/><path d="M14 8V5h5l3 3" fill="none" stroke="#573d20" stroke-width="2.5" stroke-linecap="round"/><path d="m23 4 2-2m1 5 3-1" stroke="#ff745e" stroke-width="2" stroke-linecap="round"/></svg>' },
        pistol: { label: "手枪", color: "#83d7ff", svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><path d="M4 10h23v7h-8l-1 4h-5l-1-4H4z" fill="#83d7ff" stroke="#24485b" stroke-width="2" stroke-linejoin="round"/><path d="M18 17v4h-5l-1-4m11-7V7h4v3" fill="#b9edff" stroke="#24485b" stroke-width="1.5" stroke-linejoin="round"/></svg>' },
        shotgun: { label: "霰弹枪", color: "#ff9dbe", svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><path d="M3 11h20v5H12v5H8l-1-5H3z" fill="#ff9dbe" stroke="#573342" stroke-width="2" stroke-linejoin="round"/><path d="M23 12h6v3h-6m-11 1v6h-4" fill="none" stroke="#573342" stroke-width="2" stroke-linecap="round"/></svg>' },
        rifle: { label: "步枪", color: "#8df0c0", svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><path d="M2 12h19v4H12v5H8l-1-5H2z" fill="#8df0c0" stroke="#294d40" stroke-width="2" stroke-linejoin="round"/><path d="M21 13h8v2h-8m-8 0v-3h4m-9 10 2-3" fill="none" stroke="#294d40" stroke-width="2" stroke-linecap="round"/></svg>' },
        cover: { label: "掩体", color: "#c5a5ff", svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><path d="M5 8h22v18H5z" fill="#c5a5ff" stroke="#493a62" stroke-width="2"/><path d="M5 14h22M13 8v6m8 0v6m-8 0v6" stroke="#493a62" stroke-width="2"/></svg>' },
        food: { label: "猫粮", color: "#ffbf80", svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><path d="M8 11 5 8m19 3 3-3M7 17a9 9 0 1 1 18 0v7H7z" fill="#ffbf80" stroke="#67472f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 18h.1m8 0h.1M13 22q3 3 6 0" fill="none" stroke="#67472f" stroke-width="2" stroke-linecap="round"/></svg>' },
        medkit: { label: "药包", color: "#ff879c", svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect x="5" y="9" width="22" height="18" rx="3" fill="#ff879c" stroke="#623640" stroke-width="2"/><path d="M12 9V6h8v3m-4 4v10m-5-5h10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>' }
      };
      const itemIcons = {};
      Object.entries(itemInfo).forEach(([type, info]) => {
        const image = new Image();
        image.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(info.svg)}`;
        itemIcons[type] = image;
      });

      function readProfile() {
        try {
          catName = (localStorage.getItem(NAME_KEY) || "").trim().slice(0, 16) || "猫球";
          const data = JSON.parse(localStorage.getItem(ECONOMY_KEY) || "{}");
          const inventory = data.inventory || {};
          points = Number.isSafeInteger(data.points) && data.points >= 0 ? data.points : 0;
          const equipped = inventory.equipped;
          cosmetic = ["sign", "scooter", "ingot"].includes(equipped) &&
            Number.isFinite(inventory[`${equipped}Until`]) && inventory[`${equipped}Until`] > Date.now() ? equipped : "";
        } catch (error) {
          console.error("无法读取猫球积分或装扮：", error);
          catName = "猫球";
          cosmetic = "";
          points = 0;
        }
        $("pointsValue").textContent = points;
      }

      function awardWinner(player) {
        if (!player || player.kind === "ai" || (mode === "online" && player.id !== "p1" && player.id !== "p2")) return "";
        const rewardId = state && state.id;
        if (rewardId && rewardedGameIds.has(rewardId)) return "本局奖励已领取。";
        try {
          const data = JSON.parse(localStorage.getItem(ECONOMY_KEY) || "{}");
          const current = Number.isSafeInteger(data.points) && data.points >= 0 ? data.points : 0;
          if (!Number.isSafeInteger(current + 12)) return "积分超出可保存范围，奖励未能保存。";
          data.points = current + 12;
          if (!data.inventory || typeof data.inventory !== "object" || Array.isArray(data.inventory)) data.inventory = {};
          localStorage.setItem(ECONOMY_KEY, JSON.stringify(data));
          if (rewardId) rewardedGameIds.add(rewardId);
          readProfile();
          return "获胜奖励 +12 积分已存入首页账户。";
        } catch (error) {
          console.error("无法保存猫球对决奖励：", error);
          return "获胜了，但积分保存失败，请检查浏览器存储空间。";
        }
      }
      function makePlayer(id, name, x, color, kind, look) {

      function itemAmmo(type) { return ({ grenade: 1, pistol: 3, shotgun: 3, rifle: 5, cover: 1, food: 1, medkit: 1 })[type] || 1; }

              Math.cos(player.aim) * (target.x - player.x) / Math.max(1, distance(player, target)) +
              Math.sin(player.aim) * (target.y - player.y) / Math.max(1, distance(player, target)) > .15) {
            target.hp = Math.max(0, target.hp - 11);

          if (safePosition(x, y, 12)) state.covers.push(cover);

      function addParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {

      function hitCover(x, y) {

      }
      function explode(projectile) {

          if (d < 118 && !hitCover((projectile.x + player.x) / 2, (projectile.y + player.y) / 2)) {

      function navigationPath(player, target, arriveRadius) {

        for (let index = 0; index < total; index++) {
          if (!walkable[index]) continue;

        const goals = new Set();
        for (let index = 0; index < total; index++) {

      function updatePlayer(player, dt) {

        state.items = state.items.filter(item => state.elapsed - item.born < 20);
        state.covers.forEach(cover => cover.life -= dt);
        state.covers = state.covers.filter(cover => cover.life > 0);
        state.lures.forEach(lure => { lure.life -= dt; lure.phase += dt; });
        state.lures = state.lures.filter(lure => lure.life > 0);
        for (const shot of [...state.projectiles]) {
          if (shot.kind === "grenade") {
            shot.age += dt;
            if (shot.fuse >= 0) {
              shot.fuse -= dt;
              if (shot.fuse <= 0) explode(shot);
              continue;
            }
            shot.x += shot.vx * dt; shot.y += shot.vy * dt;
            shot.vx *= Math.pow(.982, dt * 60); shot.vy *= Math.pow(.982, dt * 60);
            const hitPlayer = state.players.find(player => player.id !== shot.owner && distance(player, shot) < 25);
            if (hitPlayer || hitCover(shot.x, shot.y) || shot.x < 52 || shot.x > W - 52 || shot.y < 52 || shot.y > H - 52 || shot.age > .9) {
              shot.fuse = 1.5;
            }
          } else {
            shot.life -= dt;
            shot.x += shot.vx * dt; shot.y += shot.vy * dt;
            const hitPlayer = state.players.find(player => player.id !== shot.owner && distance(player, shot) < 23);
            if (hitPlayer) {
              hitPlayer.hp = Math.max(0, hitPlayer.hp - shot.damage);
              hitPlayer.invulnerable = .1;
              addParticles(shot.x, shot.y, hitPlayer.color, 7);
              state.projectiles = state.projectiles.filter(item => item !== shot);
              if (hitPlayer.hp <= 0) showResult(state.players.find(player => player.id === shot.owner));
            } else if (hitCover(shot.x, shot.y) || shot.x < 46 || shot.x > W - 46 || shot.y < 46 || shot.y > H - 46 || shot.life <= 0) {
              addParticles(shot.x, shot.y, "#dce8f4", 3);
              state.projectiles = state.projectiles.filter(item => item !== shot);
            }
          }
        }
        state.particles.forEach(p => { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy *= .96; });
        state.particles = state.particles.filter(p => p.life > 0);
        state.shake = Math.max(0, state.shake - dt);
      }

      function updateGame(dt) {
        if (!state || !state.running || (mode === "online" && !state.host)) return;
        state.elapsed += dt;
        state.players.forEach(player => updatePlayer(player, dt));
        updateObjects(dt);
        updateNames();
        const dead = state.players.find(player => player.hp <= 0);
        if (dead && state.running) showResult(state.players.find(player => player !== dead));
        if (mode === "online" && state.running) {
          snapshotTimer += dt;
          if (snapshotTimer >= .05) {
            snapshotTimer = 0;
            broadcast({ type: "state", state: serializableState() });
          }
        }
      }

      function serializableState() {
        const copy = JSON.parse(JSON.stringify(state));
        delete copy.host;
        copy.particles = [];
        copy.players.forEach(player => { delete player.remoteInput; });
        return copy;
      }

      function drawCosmetic(player) {
        if (player.cosmetic === "sign") {
          ctx.fillStyle = "#ffb9d1";
          ctx.fillRect(player.x - 29, player.y - 51, 58, 15);
          ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.strokeRect(player.x - 29, player.y - 51, 58, 15);
          ctx.fillStyle = "#57284a"; ctx.font = "bold 9px sans-serif"; ctx.textAlign = "center"; ctx.fillText("最帅猫球", player.x, player.y - 40);
        } else if (player.cosmetic === "ingot") {
          ctx.fillStyle = "#ffd45f"; ctx.strokeStyle = "#a76b13"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(player.x + 19, player.y + 11); ctx.lineTo(player.x + 28, player.y + 15);
          ctx.lineTo(player.x + 25, player.y + 25); ctx.lineTo(player.x + 13, player.y + 25);
          ctx.lineTo(player.x + 10, player.y + 15); ctx.closePath(); ctx.fill(); ctx.stroke();
        } else if (player.cosmetic === "scooter") {
          ctx.strokeStyle = "#6abce9"; ctx.lineWidth = 3; ctx.beginPath();
          ctx.moveTo(player.x - 20, player.y + 24); ctx.lineTo(player.x + 20, player.y + 24);
          ctx.lineTo(player.x + 10, player.y + 14); ctx.moveTo(player.x + 20, player.y + 24); ctx.lineTo(player.x + 15, player.y + 13);
          ctx.stroke(); ctx.fillStyle = "#795ca5";
          [-16, 17].forEach(dx => { ctx.beginPath(); ctx.arc(player.x + dx, player.y + 25, 4, 0, Math.PI * 2); ctx.fill(); });
        }
      }

      function drawPlayer(player) {
        const bob = Math.sin(player.walked / 12) * (player.input.x || player.input.y ? 2 : 1);
        ctx.save();
        ctx.translate(player.x, player.y + bob);
        ctx.globalAlpha = player.invulnerable > 0 ? .55 + Math.sin(state.elapsed * 38) * .3 : 1;
        ctx.fillStyle = player.color + "30";
        ctx.beginPath(); ctx.ellipse(0, 21, 28, 12, 0, 0, Math.PI * 2); ctx.fill();
        if (catImage.complete && catImage.naturalWidth) ctx.drawImage(catImage, -28, -29, 56, 56);
        else {
          ctx.fillStyle = player.color; ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#fff"; ctx.font = "bold 24px sans-serif"; ctx.textAlign = "center"; ctx.fillText("●", 0, 8);
        }
        ctx.globalAlpha = 1;
        drawCosmetic(player);
        ctx.strokeStyle = player.color; ctx.lineWidth = 3; ctx.globalAlpha = .8;
        ctx.beginPath(); ctx.moveTo(Math.cos(player.aim) * 22, Math.sin(player.aim) * 22);
        ctx.lineTo(Math.cos(player.aim) * 35, Math.sin(player.aim) * 35); ctx.stroke();
        ctx.restore();
        ctx.fillStyle = "rgba(12,18,31,.85)";
        ctx.beginPath(); ctx.roundRect(player.x - 31, player.y - 43, 62, 16, 7); ctx.fill();
        ctx.fillStyle = "#f4f6ff"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center"; ctx.fillText(player.name.slice(0, 12), player.x, player.y - 32);
        if (player.held) {
          const item = itemInfo[player.held], icon = itemIcons[player.held];
          if (icon && icon.complete && icon.naturalWidth) ctx.drawImage(icon, player.x - 16, player.y + 30, 18, 18);
          ctx.fillStyle = item ? item.color : "#fff";
          ctx.font = "bold 12px sans-serif"; ctx.fillText(String(player.ammo), player.x + 9, player.y + 44);
        }
      }

      function draw() {
        ctx.save();
        if (state && state.shake > 0) ctx.translate(rand(-5, 5) * state.shake * 4, rand(-4, 4) * state.shake * 4);
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, "#21364a"); sky.addColorStop(.7, "#29434a"); sky.addColorStop(1, "#365446");
        ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "rgba(218,237,204,.16)";
        for (let x = 25; x < W; x += 74) for (let y = 33; y < H; y += 68) {
          ctx.beginPath(); ctx.arc(x + Math.sin(y + x) * 14, y, 1.5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.strokeStyle = "rgba(217,243,213,.14)"; ctx.lineWidth = 2; ctx.strokeRect(46, 46, W - 92, H - 92);
        ctx.fillStyle = "rgba(13,25,34,.5)";
        ctx.fillRect(0, 0, W, 39); ctx.fillRect(0, H - 39, W, 39); ctx.fillRect(0, 0, 39, H); ctx.fillRect(W - 39, 0, 39, H);
        terrain.forEach((rect, index) => {
          ctx.fillStyle = index % 2 ? "#526158" : "#596359"; ctx.beginPath(); ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 12); ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.beginPath(); ctx.ellipse(rect.x + rect.w * .35, rect.y + 6, rect.w * .34, 5, 0, 0, Math.PI * 2); ctx.fill();
        });
        if (state) {
          state.covers.forEach(cover => {
            ctx.globalAlpha = Math.min(1, cover.life / .35);
            ctx.fillStyle = "#8875a9"; ctx.beginPath(); ctx.roundRect(cover.x, cover.y, cover.w, cover.h, 6); ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,.22)"; ctx.fillRect(cover.x + 5, cover.y + 4, Math.max(0, cover.w - 10), 3);
            ctx.globalAlpha = 1;
          });
          state.items.forEach(item => {
            const info = itemInfo[item.type], float = Math.sin(state.elapsed * 3 + item.phase) * 5;
            ctx.save(); ctx.translate(item.x, item.y + float);
            ctx.fillStyle = info.color + "33"; ctx.beginPath(); ctx.arc(0, 0, 24 + Math.sin(state.elapsed * 4 + item.phase) * 2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#162333"; ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
            const icon = itemIcons[item.type];
            if (icon && icon.complete && icon.naturalWidth) ctx.drawImage(icon, -12, -12, 24, 24);
            ctx.restore();
          });
          state.lures.forEach(lure => {
            ctx.globalAlpha = .7 + Math.sin(lure.phase * 9) * .2;
            const icon = itemIcons.food;
            if (icon && icon.complete && icon.naturalWidth) ctx.drawImage(icon, lure.x - 13, lure.y - 13, 26, 26);
            ctx.globalAlpha = 1;
          });
          state.projectiles.forEach(shot => {
            if (shot.kind === "grenade") {
              ctx.fillStyle = shot.fuse >= 0 ? (Math.sin(state.elapsed * 25) > 0 ? "#fff0a0" : "#ff765f") : "#ffbd5b";
              ctx.beginPath(); ctx.arc(shot.x, shot.y, 8, 0, Math.PI * 2); ctx.fill();
            } else {
              ctx.fillStyle = shot.owner === "p1" ? "#b6ffe5" : "#ffd0de";
              ctx.beginPath(); ctx.ellipse(shot.x, shot.y, 7, 3, Math.atan2(shot.vy, shot.vx), 0, Math.PI * 2); ctx.fill();
            }
          });
          state.particles.forEach(p => {
            ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
          });
          ctx.globalAlpha = 1;
          state.players.forEach(drawPlayer);
        } else {
          ctx.fillStyle = "rgba(255,255,255,.06)"; ctx.font = "700 20px sans-serif"; ctx.textAlign = "center";
          ctx.fillText("选择一种模式，开始猫球对决", W / 2, H / 2);
        }
        ctx.restore();
      }

      function updateHudInfo() {
        if (!state) { $("itemStatus").textContent = "道具：空手"; return; }
        const localPlayer = mode === "online" && !state.host ? state.players[1] : state.players[0];
        const info = itemInfo[localPlayer.held];
        $("itemStatus").textContent = info ? `道具：${info.label}　剩余 ${localPlayer.ammo}` : "道具：空手（靠近后按出击键肉搏）";
        $("p1Health").style.width = `${Math.max(0, state.players[0].hp)}%`;
        $("p2Health").style.width = `${Math.max(0, state.players[1].hp)}%`;
      }

      function frame(now) {
        const dt = Math.min(.04, (now - (lastFrame || now)) / 1000);
        lastFrame = now;
        if (state && state.running && pointerTarget) {
          const localPlayer = mode === "online" && !state.host ? state.players[1] : state.players[0];
          localPlayer.aim = Math.atan2(pointerTarget.y - localPlayer.y, pointerTarget.x - localPlayer.x);
        }
        updateGame(dt);
        if (mode === "online" && state && !state.host && state.running) sendInput();
        draw();
        updateHudInfo();
        requestAnimationFrame(frame);
      }

      function pointerAim(event) {
        if (!state || !state.running) return;
        const rect = canvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) * W / rect.width;
        const y = (event.clientY - rect.top) * H / rect.height;
        pointerTarget = { x, y };
        const player = mode === "online" && !state.host ? state.players[1] : state.players[0];
        player.aim = Math.atan2(y - player.y, x - player.x);
      }
      canvas.addEventListener("pointerdown", event => { pointerAim(event); canvas.setPointerCapture(event.pointerId); });
      canvas.addEventListener("pointermove", pointerAim);

      function firePulse(playerId) {
        if (!state || !state.running) return;
        if (mode === "online" && !state.host) {
          sendInput(true);
          return;
        }
        const player = state.players.find(item => item.id === playerId);
        if (player) player.input.pulse = true;
      }
      document.addEventListener("keydown", event => {
        const keysUsed = ["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
        if (keysUsed.includes(event.code)) event.preventDefault();
        if (!keys.has(event.code)) {
          if (event.code === "Space" && (mode !== "online" || state)) firePulse("p1");
          if (event.code === "KeyM" && mode === "local") firePulse("p2");
        }
        keys.add(event.code);
      });
      document.addEventListener("keyup", event => keys.delete(event.code));
      function releaseTouchPointer(pointerId) {
        const control = activeTouchPointers.get(pointerId);
        if (!control) return;
        activeTouchPointers.delete(pointerId);
        const stillPressed = [...activeTouchPointers.values()].includes(control);
        if (!stillPressed) {
          touchInput[control] = false;
          const button = document.querySelector(`[data-control="${control}"]`);
          if (button) button.classList.remove("active");
        }
      }
      document.querySelectorAll("[data-control]").forEach(button => {
        const control = button.dataset.control;
        const down = event => {
          event.preventDefault();
          activeTouchPointers.set(event.pointerId, control);
          if (control === "fire") { touchInput.fire = true; firePulse("p1"); }
          else touchInput[control] = true;
          button.classList.add("active");
          if (button.setPointerCapture) button.setPointerCapture(event.pointerId);
        };
        button.addEventListener("pointerdown", down);
        button.addEventListener("lostpointercapture", event => releaseTouchPointer(event.pointerId));
      });
      window.addEventListener("pointerup", event => releaseTouchPointer(event.pointerId));
      window.addEventListener("pointercancel", event => releaseTouchPointer(event.pointerId));
      function clearInputs() {
        keys.clear();
        activeTouchPointers.clear();
        Object.keys(touchInput).forEach(key => touchInput[key] = false);
        document.querySelectorAll("[data-control].active").forEach(button => button.classList.remove("active"));
        if (mode === "online" && state && !state.host) sendInput();
      }
      window.addEventListener("blur", clearInputs);
      document.addEventListener("visibilitychange", () => { if (document.hidden) clearInputs(); });

      function goEasyOperation(start) {
        return new Promise((resolve, reject) => start({
          onSuccess: resolve,
          onFailed: error => reject(new Error(error && (error.content || error.message) || String(error)))
        }));
      }
      function randomId() {
        return `catball-pvp-${window.crypto && crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`}`;
      }
      async function startOnline() {
        mode = "online";
        peers.clear();
        showWaiting("正在连接 GoEasy…");
        if (!window.GoEasy || typeof window.GoEasy.getInstance !== "function") {
          showMenu("联机服务加载失败", "请检查网络后刷新页面，或选择人机/本地双人模式。");
          $("overlayStatus").textContent = "GoEasy SDK 未能加载。";
          return;
        }
        try {
          goeasy = window.GoEasy.getInstance({ host: GOEASY_HOST, appkey: GOEASY_KEY, modules: ["pubsub"] });
          peerId = randomId();
          await goEasyOperation(callbacks => goeasy.connect({
            id: peerId,
            data: { nickname: catName, catName, cosmetic },
            ...callbacks
          }));
          connected = true;
          await goEasyOperation(callbacks => goeasy.pubsub.subscribe({
            channel: LOBBY, presence: { enable: true }, onMessage: onLobbyMessage, ...callbacks
          }));
          await goEasyOperation(callbacks => goeasy.pubsub.subscribe({
            channel: `${INBOX}${peerId}`, onMessage: onDirectMessage, ...callbacks
          }));
          await goEasyOperation(callbacks => goeasy.pubsub.subscribePresence({
            channel: LOBBY, onPresence: handlePresence, ...callbacks
          }));
          await goEasyOperation(callbacks => goeasy.pubsub.hereNow({
            channel: LOBBY, limit: 100, onSuccess: response => {
              const members = response && response.content && response.content.members;
              if (!Array.isArray(members)) { callbacks.onFailed(new Error("GoEasy 在线成员数据格式异常")); return; }
              members.forEach(addPeer);
              callbacks.onSuccess();
            }, onFailed: callbacks.onFailed
          }));
          publishLobby({ type: "ready", from: peerId, profile: { name: catName, cosmetic } });
          queueTimer = setInterval(() => {
            if (!opponentId && connected) {
              publishLobby({ type: "ready", from: peerId, profile: { name: catName, cosmetic } });
              tryMatch();
            }
          }, 2500);
          tryMatch();
          $("overlayStatus").textContent = peers.size ? `找到 ${peers.size} 位在线玩家，正在匹配…` : "已连接，正在等待对手加入…";
        } catch (error) {
          console.error("GoEasy 联机失败：", error);
          closeOnline();
          showMenu("暂时无法联机", "请确认网络连接和 GoEasy 服务状态。");
          $("overlayStatus").textContent = error.message || "连接失败，请稍后重试。";
        }
      }
      function addPeer(member) {
        if (!member || typeof member.id !== "string" || member.id === peerId || !member.id.startsWith("catball-pvp-")) return;
        const profile = member.data || {};
        peers.set(member.id, {
          name: String(profile.nickname || profile.catName || "联机玩家").slice(0, 16),
          cosmetic: ["sign", "scooter", "ingot"].includes(profile.cosmetic) ? profile.cosmetic : ""
        });
      }
      function handlePresence(event) {
        if (!event || !event.member) return;
        if (event.action === "join") {
          addPeer(event.member);
          publishLobby({ type: "ready", from: peerId, profile: { name: catName, cosmetic } });
          tryMatch();
        } else if (event.action === "leave") {
          peers.delete(event.member.id);
          if (event.member.id === opponentId && state && state.running) {
            closeOnline(false);
            state = null;
            mode = "";
            showMenu("对手已离线", "联机对手离开了游戏。请返回菜单重新匹配。");
          }
        }
      }
      function publishLobby(data) {
        if (!connected || !goeasy) return;
        goeasy.pubsub.publish({
          channel: LOBBY, message: JSON.stringify(data),
          onSuccess: () => {}, onFailed: error => console.error("GoEasy 匹配消息发送失败：", error)
        });
      }
      function onLobbyMessage(message) {
        try {
          const data = typeof message.content === "string" ? JSON.parse(message.content) : message.content;
          if (!data || data.type !== "ready" || typeof data.from !== "string" || data.from === peerId) return;
          peers.set(data.from, {
            name: String((data.profile && data.profile.name) || "联机玩家").slice(0, 16),
            cosmetic: ["sign", "scooter", "ingot"].includes(data.profile && data.profile.cosmetic) ? data.profile.cosmetic : ""
          });
          tryMatch();
        } catch (error) {
          console.warn("忽略无法解析的匹配消息：", error);
        }
      }
      function tryMatch() {
        if (!connected || opponentId || overlayState !== "waiting") return;
        const candidate = [...peers.keys()].filter(id => id < peerId).sort()[0];
        if (!candidate) return;
        const profile = peers.get(candidate);
        opponentId = candidate;
        opponentProfile = profile;
        publishDirect(candidate, {
          type: "offer", from: peerId, profile: { name: catName, cosmetic }
        });
        $("overlayStatus").textContent = `正在与 ${profile.name} 握手…`;
      }
      function publishDirect(to, data) {
        if (!connected || !goeasy || !to) return;
        goeasy.pubsub.publish({
          channel: `${INBOX}${to}`,
          message: JSON.stringify({ from: peerId, to, data }),
          onSuccess: () => {}, onFailed: error => console.error("GoEasy 对战消息发送失败：", error)
        });
      }
      function onDirectMessage(message) {
        let envelope;
        try { envelope = typeof message.content === "string" ? JSON.parse(message.content) : message.content; }
        catch (error) { console.warn("忽略无法解析的联机消息：", error); return; }
        if (!envelope || envelope.to !== peerId || typeof envelope.from !== "string" || !envelope.data) return;
        const { from, data } = envelope;
        if (data.type === "offer" && overlayState === "waiting" && !opponentId) {
          opponentId = from;
          const profile = data.profile || {};
          opponentProfile = { name: String(profile.name || "联机玩家").slice(0, 16), cosmetic: ["sign", "scooter", "ingot"].includes(profile.cosmetic) ? profile.cosmetic : "" };
          publishDirect(from, { type: "accept", profile: { name: catName, cosmetic } });
          $("overlayStatus").textContent = `已连接 ${opponentProfile.name}，等待开战…`;
        } else if (data.type === "accept" && from === opponentId && !state) {
          const profile = data.profile || {};
          opponentProfile = { name: String(profile.name || "联机玩家").slice(0, 16), cosmetic: ["sign", "scooter", "ingot"].includes(profile.cosmetic) ? profile.cosmetic : "" };
          makeGame("online", {
            host: true, opponentName: opponentProfile.name, opponentCosmetic: opponentProfile.cosmetic
          });
          publishDirect(from, {
            type: "start", hostName: catName, hostCosmetic: cosmetic,
            guestName: opponentProfile.name, guestCosmetic: opponentProfile.cosmetic, gameId: state.id
          });
        } else if (data.type === "start" && from === opponentId && !state) {
          const profile = { name: String(data.hostName || "联机玩家").slice(0, 16), cosmetic: ["sign", "scooter", "ingot"].includes(data.hostCosmetic) ? data.hostCosmetic : "" };
          opponentProfile = profile;
          makeGame("online", { host: false, opponentName: profile.name, opponentCosmetic: profile.cosmetic, gameId: data.gameId });
        } else if (data.type === "input" && from === opponentId && state && state.host && state.running &&
                   data.input && typeof data.input === "object") {
          const remote = state.players[1];
          remote.remoteInput = {
            x: clamp(Number(data.input.x) || 0, -1, 1), y: clamp(Number(data.input.y) || 0, -1, 1),
            aim: Number.isFinite(data.input.aim) ? data.input.aim : remote.aim,
            fire: Boolean(data.input.fire), pulse: Boolean(data.input.pulse)
          };
        } else if (data.type === "state" && from === opponentId && state && !state.host && data.state && data.state.id === state.id) {
          state = { ...data.state, host: false };
          updateNames();
        } else if (data.type === "finish" && from === opponentId && state && !state.host) {
          const winner = state.players.find(player => player.id === data.winner) || null;
          if (winner) winner.name = String(data.winnerName || winner.name).slice(0, 16);
          showResult(winner, winner ? `${winner.name} 获胜！` : "平局。");
        } else if (data.type === "quit" && from === opponentId) {
          closeOnline(false);
          state = null;
          mode = "";
          showMenu("对手已离开", "本场联机对战已结束。");
        }
      }
      function sendInput(pulse = false) {
        if (!connected || !opponentId || !state || state.host || !state.running) return;
        const now = performance.now();
        if (!pulse && now - lastInputSend < 45) return;
        lastInputSend = now;
        const player = state.players[1];
        const x = (keys.has("KeyD") || touchInput.right ? 1 : 0) - (keys.has("KeyA") || touchInput.left ? 1 : 0);
        const y = (keys.has("KeyS") || touchInput.down ? 1 : 0) - (keys.has("KeyW") || touchInput.up ? 1 : 0);
        publishDirect(opponentId, {
          type: "input", seq: ++inputSeq,
          input: { x, y, aim: player.aim, fire: keys.has("Space") || touchInput.fire, pulse }
        });
      }
      function broadcast(data) {
        if (opponentId) publishDirect(opponentId, data);
      }
      function closeOnline(notifyOpponent = true) {
        clearInterval(queueTimer);
        queueTimer = null;
        if (notifyOpponent && opponentId && connected) publishDirect(opponentId, { type: "quit" });
        if (goeasy) {
          try { goeasy.disconnect({}); }
          catch (error) { console.error("关闭 GoEasy 连接失败：", error); }
        }
        goeasy = null; connected = false; peerId = ""; opponentId = "";
        opponentProfile = null; peers.clear();
      }
      function returnToMenu() {
        if (mode === "online") closeOnline();
        state = null; mode = ""; keys.clear();
        showMenu();
      }

      document.querySelectorAll("[data-mode]").forEach(button => button.addEventListener("click", () => {
        if (button.dataset.mode === "ai") { makeGame("ai"); spawnItem(); spawnItem(); }
        else if (button.dataset.mode === "local") { makeGame("local"); spawnItem(); spawnItem(); }
        else startOnline();
      }));
      $("overlayAction").addEventListener("click", () => {
        if (overlayState === "waiting") returnToMenu();
        else if (overlayState === "result") returnToMenu();
      });
      $("menuButton").addEventListener("click", returnToMenu);
      window.addEventListener("storage", event => {
        if (event.key === ECONOMY_KEY || event.key === NAME_KEY) readProfile();
      });
      window.addEventListener("beforeunload", () => {
        if (opponentId && connected) publishDirect(opponentId, { type: "quit" });
        if (goeasy) goeasy.disconnect({});
      });
      readProfile();
      showMenu();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
