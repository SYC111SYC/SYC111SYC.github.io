<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫球小站</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            position: relative;
            min-height: 100vh;
        }

        .pet-wrap {
            position: absolute;
            left: 0;
            top: 0;
            width: 94px;
            height: 94px;
            z-index: 9999;
            user-select: none;
            pointer-events: auto;
            opacity: 0;
            transform: translate3d(32px, 140px, 0);
            will-change: transform;
            transition: opacity 0.2s ease;
        }

        .pet {
            position: absolute;
            left: 12px;
            top: 12px;
            width: 72px;
            height: 72px;
            cursor: pointer;
            background: url('images/catball.png') center/contain no-repeat;
            image-rendering: auto;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.18));
            transition: transform 0.15s ease, filter 0.15s ease;
            will-change: transform;
        }

        .pet:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.22));
        }

        .pet.running {
            transform: scale(1.12);
            filter: drop-shadow(0 8px 16px rgba(255, 120, 120, 0.35));
        }

        .pet-speech {
            position: absolute;
            left: 72px;
            top: 8px;
            max-width: 180px;
            padding: 7px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            color: #333;
            font-size: 13px;
            line-height: 1.3;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }

        .pet-speech::before {
            content: "";
            position: absolute;
            left: -8px;
            top: 12px;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.96);
            border-left: 1px solid rgba(0, 0, 0, 0.08);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            transform: rotate(45deg);
        }

        .pet-speech.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ---------- 猫粮状态栏 ---------- */
        .pet-food-bar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 14px;
            margin: 8px 18px;
            padding: 8px 14px;
            background: linear-gradient(135deg, #fff8ec, #ffe9cc);
            border: 1px solid rgba(210, 160, 90, 0.35);
            border-radius: 12px;
            font-size: 14px;
            color: #6d3a00;
            box-shadow: 0 2px 8px rgba(180, 120, 40, 0.08);
        }

        .pet-food-info {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .pet-food-info strong {
            font-size: 1.15em;
            color: #d47700;
            transition: color 0.25s ease, transform 0.25s ease;
            display: inline-block;
            min-width: 1em;
            text-align: center;
        }

        .pet-food-info strong.flash {
            color: #ff8800;
            transform: scale(1.35);
        }

        .pet-food-status {
            color: #a06b28;
            font-size: 13px;
        }

        .pet-food-status.fed {
            color: #2f8a2f;
            font-weight: 600;
        }

        .pet-food-btn {
            margin-left: auto;
            padding: 6px 16px;
            border: none;
            border-radius: 8px;
            background: #ffbf66;
            color: #3a2200;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .pet-food-btn:hover:not(:disabled) {
            background: #ffb144;
        }

        .pet-food-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .pet-food-btn:disabled {
            background: #e8dccb;
            color: #a08b70;
            cursor: not-allowed;
        }

        /* 猫粮槽位 */
        .food-slot {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: 2px dashed rgba(210, 160, 90, 0.55);
            background: rgba(255, 255, 255, 0.55);
            flex: 0 0 auto;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .food-slot.empty {
            border-color: rgba(190, 190, 190, 0.5);
            background: rgba(250, 250, 250, 0.4);
        }

        .food-slot.empty::after {
            content: "空";
            font-size: 12px;
            color: #b8a888;
            letter-spacing: 1px;
        }

        .food-slot.empty .draggable-food {
            display: none;
        }

        .food-slot.locked .draggable-food {
            cursor: not-allowed;
            filter: grayscale(0.4);
            opacity: 0.65;
        }

        .draggable-food {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffe0b0, #ffbf66 55%, #e8963f);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            line-height: 1;
            cursor: grab;
            user-select: none;
            touch-action: none;
            box-shadow: 0 2px 6px rgba(180, 120, 40, 0.35);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .draggable-food:hover {
            transform: scale(1.1);
        }

        .draggable-food.dragging {
            cursor: grabbing;
            transform: scale(1.15);
            box-shadow: 0 6px 14px rgba(180, 120, 40, 0.5);
        }

        .draggable-food.floating {
            position: absolute;
            z-index: 10000;
            margin: 0;
            transition: none;
            box-shadow: 0 8px 18px rgba(180, 120, 40, 0.5);
        }

        .draggable-food.caught {
            cursor: default;
            z-index: 9998;
            box-shadow: 0 0 0 3px rgba(255, 150, 100, 0.45), 0 2px 6px rgba(180, 120, 40, 0.35);
        }

        .draggable-food.gone {
            transform: scale(0.1);
            opacity: 0;
            transition: transform 0.45s ease, opacity 0.45s ease;
        }

        @media (max-width: 500px) {
            .pet-food-btn {
                margin-left: 0;
                width: 100%;
            }
        }

        /* ---------- 每日运势 ---------- */
        .daily-fortune-card {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px 18px;
            margin: 8px 18px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #fffdf7, #eef4ff);
            border: 1px solid rgba(150, 160, 200, 0.28);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(90, 110, 180, 0.08);
        }

        .fortune-level {
            flex: 0 0 auto;
            min-width: 86px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: 2px;
            text-align: center;
            white-space: nowrap;
            border: 2px solid transparent;
        }

        .fortune-level.lv-daji      { color: #d4380d; background: #fff3e8; border-color: #ffb08a; }
        .fortune-level.lv-zhongji   { color: #d46b08; background: #fff8e6; border-color: #ffd591; }
        .fortune-level.lv-xiaoji    { color: #ad8b00; background: #fffbe6; border-color: #ffe58f; }
        .fortune-level.lv-ping      { color: #4a5568; background: #f7f9fc; border-color: #cbd5e0; }
        .fortune-level.lv-xiaoxiong { color: #3c7a89; background: #eff9fb; border-color: #a8d8e2; }
        .fortune-level.lv-xiong     { color: #4a5568; background: #f0f2f5; border-color: #b8c0cc; }
        .fortune-level.lv-daxiong   { color: #2d3748; background: #e8eaee; border-color: #9aa3b0; }
        .fortune-level.lv-mystery   { color: #8e44ad; background: #f8f2ff; border-color: #d3b3ef; letter-spacing: 0; }
        .fortune-level.lv-pending   { color: #9aa3b0; background: #f5f7fa; border-color: #d5dbe4; }

        .fortune-main {
            flex: 1 1 200px;
            min-width: 0;
        }

        .fortune-head {
            font-size: 13px;
            color: #8a94a6;
            margin-bottom: 6px;
        }

        .fortune-date {
            margin-left: 8px;
            color: #b0b8c6;
            font-variant-numeric: tabular-nums;
        }

        .fortune-streak {
            margin-left: 10px;
            color: #e07a2f;
            font-weight: 600;
        }

        /* 运势条目：纵向排列，宜一行、忌一行 */
        .fortune-lines {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 14px;
        }

        .fortune-hint {
            color: #a0a8b8;
            font-size: 13px;
        }

        .fortune-row {
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.5;
        }

        .fortune-row .lbl {
            display: inline-block;
            width: 20px;
            height: 20px;
            line-height: 20px;
            text-align: center;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 700;
            flex: 0 0 auto;
        }

        .fortune-good { color: #2f8a2f; }
        .fortune-good .lbl { background: #e3f5e3; }
        .fortune-bad { color: #c0392b; }
        .fortune-bad .lbl { background: #fdeaea; }

        .fortune-name {
            font-weight: 700;
        }

        .fortune-sign-btn {
            margin-left: auto;
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            background: #8fb0ff;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .fortune-sign-btn:hover { background: #6f97ff; }
        .fortune-sign-btn:active { transform: scale(0.96); }

        @media (max-width: 500px) {
            .daily-fortune-card { gap: 10px; }
            .fortune-level { min-width: 72px; font-size: 20px; padding: 8px 10px; }
            .fortune-sign-btn { margin-left: 0; width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <h1>猫球小站</h1>
        <nav>
            <a href="index.html">首页</a>
            <a href="download.html">文件分享</a>
            <a href="rand.html">随机数抽取</a>
            <a href="calendar.html">日历与倒数日</a>
            <a href="clock.html">世界时间</a>
        </nav>
    </header>

    <!-- 猫粮状态栏（含可拖动猫粮槽位） -->
    <div class="pet-food-bar">
        <span class="pet-food-info">🍖 猫粮：<strong id="foodCount">0</strong></span>
        <span class="pet-food-status" id="feedStatus">今天还没喂</span>
        <div class="food-slot" id="foodSlot">
            <div class="draggable-food" id="draggableFood" title="拖动我去喂猫">🍖</div>
        </div>
        <button class="pet-food-btn" id="feedBtn" type="button">喂猫 🐱</button>
    </div>

    <!-- 每日运势 -->
    <div class="daily-fortune-card" id="dailyFortune">
        <div class="fortune-level" id="fortuneLevel">…</div>
        <div class="fortune-main">
            <div class="fortune-head">
                🔮 今日运势<span class="fortune-date" id="fortuneDate"></span><span class="fortune-streak" id="fortuneStreak"></span>
            </div>
            <div class="fortune-lines" id="fortuneLines"></div>
        </div>
        <button class="fortune-sign-btn" id="fortuneSignBtn" type="button">签到抽运势</button>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="搜索帖子标题或内容...">
        <p id="searchTip"></p>
    </div>

    <div class="post-card foldable-game">
        <div class="fold-header" id="foldToggle">
            <span>🎮 游戏中心</span>
            <span class="fold-arrow">▼</span>
        </div>
        <div class="fold-content" id="foldContent">
            <div class="game-item">
                <h4>🦖 小恐龙</h4>
                <p class="game-tip">按 <kbd>空格</kbd> 跳跃，<kbd>↓</kbd> 下蹲</p>
                <div class="game-viewport">
                    <iframe
                        src="https://chromedino.com/embed/"
                        frameborder="0"
                        scrolling="no"
                        class="game-iframe"
                        title="Chrome小恐龙游戏">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <main id="postList">加载中...</main>

    <div id="petWrap" class="pet-wrap" aria-label="桌宠" title="点击让我乱跑 10 秒">
        <div id="pet" class="pet"></div>
        <div id="petSpeech" class="pet-speech" aria-live="polite"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        /* =========================================================
           文章加载 / 渲染 / 搜索 / 折叠（原有）
           ========================================================= */
        let allPosts = [];

        fetch('posts.json')
            .then(res => res.json())
            .then(data => {
                allPosts = data.posts;
                renderPosts(allPosts);
            })
            .catch(err => {
                document.getElementById('postList').innerHTML = '<p class="error">加载失败，请检查 posts.json 语法是否正确</p>';
                console.error(err);
            });

        function renderPosts(posts) {
            const container = document.getElementById('postList');
            if (posts.length === 0) {
                container.innerHTML = '<p>没有找到相关帖子</p>';
                return;
            }
            let html = '';
            posts.forEach(post => {
                html += `
                <article class="post-card">
                    <h2><a href="post.html?id=${post.id}">${post.title}</a></h2>
                    <div class="post-meta">${post.date} · 作者：${post.author}</div>
                    <p class="post-summary">${post.summary}</p>
                </article>
                `;
            });
            container.innerHTML = html;
        }

        const searchInput = document.getElementById('searchInput');
        const searchTip = document.getElementById('searchTip');
        searchInput.addEventListener('input', function() {
            const keyword = this.value.trim().toLowerCase();
            if (!keyword) {
                searchTip.textContent = '';
                renderPosts(allPosts);
                return;
            }
            const filtered = allPosts.filter(post =>
                post.title.toLowerCase().includes(keyword) ||
                post.summary.toLowerCase().includes(keyword) ||
                post.content.toLowerCase().includes(keyword)
            );
            renderPosts(filtered);
            searchTip.textContent = `找到 ${filtered.length} 篇相关帖子`;
        });

        const foldToggle = document.getElementById('foldToggle');
        const foldContent = document.getElementById('foldContent');
        const foldArrow = foldToggle.querySelector('.fold-arrow');
        foldToggle.addEventListener('click', function() {
            const isOpen = foldContent.classList.toggle('open');
            foldArrow.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        /* =========================================================
           桌宠系统
           ========================================================= */
        const petWrap = document.getElementById('petWrap');
        const pet = document.getElementById('pet');
        const petSpeech = document.getElementById('petSpeech');
        let speechTimer = null;

        const idlePhrases = ['喵~', '喵呜~', '欢迎！', '我是猫球。', '哈哈，快来陪我玩！'];
        const returnPhrases = ['等等我！', '不要抛弃我！', '我回来了，慢点！'];

        const petState = {
            x: 32,
            y: 140,
            vx: 1,
            vy: 0.6,
            running: false,
            runUntil: 0,
            idleTimer: 0,
            nextIdleSpeechAt: 0,
            nextMeowAt: 0,
            nextReturnSpeechAt: 0,
            lastTime: 0,
            chasingFood: false,
            eating: false,
            nextEatSpeechAt: 0
        };

        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function say(text, duration = 1400) {
            petSpeech.textContent = text;
            petSpeech.classList.add('visible');
            clearTimeout(speechTimer);
            speechTimer = setTimeout(() => {
                petSpeech.classList.remove('visible');
            }, duration);
        }

        function setRandomIdleDirection() {
            const angle = Math.random() * Math.PI * 2;
            const speed = randomRange(0.5, 1.1);
            petState.vx = Math.cos(angle) * speed;
            petState.vy = Math.sin(angle) * speed;
            petState.idleTimer = randomRange(60, 170);
        }

        function setPetPosition() {
            const maxX = Math.max(8, document.body.scrollWidth - petWrap.offsetWidth - 8);
            const maxY = Math.max(8, document.body.scrollHeight - petWrap.offsetHeight - 8);
            petState.x = clamp(petState.x, 8, maxX);
            petState.y = clamp(petState.y, 8, maxY);
            petWrap.style.transform = `translate3d(${petState.x}px, ${petState.y}px, 0)`;
        }

        function isPetOutsideViewport() {
            const left = petState.x;
            const top = petState.y;
            const right = left + petWrap.offsetWidth;
            const bottom = top + petWrap.offsetHeight;

            return right < window.scrollX - 20 ||
                left > window.scrollX + window.innerWidth + 20 ||
                bottom < window.scrollY - 20 ||
                top > window.scrollY + window.innerHeight + 20;
        }

        function animate(timestamp) {
            if (!petState.lastTime) petState.lastTime = timestamp;
            const delta = (timestamp - petState.lastTime) / 16.67;
            petState.lastTime = timestamp;

            if (petState.chasingFood && foodDrag.active && !foodDrag.caught) {
                const fc = getFoodCenter();
                const pcx = petState.x + petWrap.offsetWidth / 2;
                const pcy = petState.y + petWrap.offsetHeight / 2;
                const dx = fc.x - pcx;
                const dy = fc.y - pcy;
                const dist = Math.hypot(dx, dy);

                if (dist < CATCH_DISTANCE) {
                    catchFood();
                } else {
                    const speed = 13;
                    petState.vx = (dx / dist) * speed;
                    petState.vy = (dy / dist) * speed;

                    if (timestamp > petState.nextMeowAt) {
                        say('喵喵~', 700);
                        petState.nextMeowAt = timestamp + 700;
                    }
                }
            } else if (petState.eating) {
                petState.vx = 0;
                petState.vy = 0;

                if (timestamp > petState.nextEatSpeechAt) {
                    say(EAT_PHRASES[Math.floor(Math.random() * EAT_PHRASES.length)], 520);
                    petState.nextEatSpeechAt = timestamp + 300 + Math.random() * 300;
                }
            } else if (petState.running) {
                if (timestamp > petState.runUntil) {
                    petState.running = false;
                    pet.classList.remove('running');
                    setRandomIdleDirection();
                } else {
                    if (timestamp > petState.nextMeowAt) {
                        say('喵喵~', 700);
                        petState.nextMeowAt = timestamp + 550;
                    }

                    petState.vx += randomRange(-2.4, 2.4) * delta;
                    petState.vy += randomRange(-2.4, 2.4) * delta;
                    const length = Math.hypot(petState.vx, petState.vy) || 1;
                    const maxSpeed = 11.5;
                    if (length > maxSpeed) {
                        petState.vx = (petState.vx / length) * maxSpeed;
                        petState.vy = (petState.vy / length) * maxSpeed;
                    }
                }
            } else if (isPetOutsideViewport()) {
                if (timestamp > petState.nextReturnSpeechAt) {
                    say(returnPhrases[Math.floor(Math.random() * returnPhrases.length)], 1500);
                    petState.nextReturnSpeechAt = timestamp + 2200;
                }

                const centerX = window.scrollX + window.innerWidth * 0.5;
                const centerY = window.scrollY + window.innerHeight * 0.5;
                const targetX = clamp(centerX - petWrap.offsetWidth / 2, 8, Math.max(8, document.body.scrollWidth - petWrap.offsetWidth - 8));
                const targetY = clamp(centerY - petWrap.offsetHeight / 2, 8, Math.max(8, document.body.scrollHeight - petWrap.offsetHeight - 8));
                const dx = targetX - petState.x;
                const dy = targetY - petState.y;
                const distance = Math.hypot(dx, dy) || 1;
                const speed = 13;
                petState.vx = (dx / distance) * speed;
                petState.vy = (dy / distance) * speed;

                if (distance < 18) {
                    petState.vx = 0;
                    petState.vy = 0;
                    setRandomIdleDirection();
                }
            } else {
                petState.idleTimer -= delta;
                if (petState.idleTimer <= 0) {
                    setRandomIdleDirection();
                }

                petState.vx *= 0.96;
                petState.vy *= 0.96;
                if (Math.hypot(petState.vx, petState.vy) < 0.35) {
                    setRandomIdleDirection();
                }

                if (timestamp > petState.nextIdleSpeechAt) {
                    const text = idlePhrases[Math.floor(Math.random() * idlePhrases.length)];
                    say(text, 1400);
                    petState.nextIdleSpeechAt = timestamp + randomRange(2800, 5200);
                }
            }

            petState.x += petState.vx * delta;
            petState.y += petState.vy * delta;
            setPetPosition();
            requestAnimationFrame(animate);
        }

        pet.addEventListener('click', function() {
            petState.running = true;
            petState.runUntil = performance.now() + 10000;
            pet.classList.add('running');
            petState.nextMeowAt = performance.now() + 200;
            const angle = Math.random() * Math.PI * 2;
            const speed = randomRange(8, 12);
            petState.vx = Math.cos(angle) * speed;
            petState.vy = Math.sin(angle) * speed;
            say('喵喵喵！', 900);
        });

        setRandomIdleDirection();
        setPetPosition();
        petState.nextIdleSpeechAt = performance.now() + 1500;
        petWrap.style.opacity = '1';
        requestAnimationFrame(animate);

        window.addEventListener('resize', setPetPosition);
        window.addEventListener('scroll', function() {
            if (!petState.running && !petState.chasingFood && !petState.eating && isPetOutsideViewport()) {
                petState.nextReturnSpeechAt = performance.now();
            }
        }, { passive: true });

        /* =========================================================
           猫粮系统（含拖拽喂猫）
           ========================================================= */
        const FOOD_KEY        = 'catball_food_v1';
        const FEED_DATE_KEY   = 'catball_feed_date_v1';

        const foodCountEl     = document.getElementById('foodCount');
        const feedStatusEl    = document.getElementById('feedStatus');
        const feedBtn         = document.getElementById('feedBtn');
        const foodSlotEl      = document.getElementById('foodSlot');
        const draggableFood   = document.getElementById('draggableFood');

        const FOOD_SIZE       = 34;
        const CATCH_DISTANCE  = 42;
        const EAT_PHRASES     = ['啊呜', '咔嚓咔嚓', '吧唧吧唧', '喵呜~', '好吃！', '嚼嚼嚼...', '啊呜啊呜'];

        function safeGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function safeSet(key, value) {
            try { localStorage.setItem(key, value); } catch (e) { /* 忽略 */ }
        }

        function todayStr() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function yesterdayStr() {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function getFoodCount() {
            const raw = parseInt(safeGet(FOOD_KEY) || '0', 10);
            return Number.isFinite(raw) && raw > 0 ? raw : 0;
        }

        function setFoodCount(n) {
            const safe = Math.max(0, Math.floor(Number(n) || 0));
            safeSet(FOOD_KEY, String(safe));
            updateFoodUI();
        }

        function addFood(n = 1) {
            setFoodCount(getFoodCount() + n);
            flashFoodCount();
        }

        function hasFedToday() {
            return safeGet(FEED_DATE_KEY) === todayStr();
        }

        function flashFoodCount() {
            foodCountEl.classList.add('flash');
            clearTimeout(flashFoodCount._t);
            flashFoodCount._t = setTimeout(() => {
                foodCountEl.classList.remove('flash');
            }, 350);
        }

        const foodDrag = {
            active: false,
            dragging: false,
            caught: false,
            pointerId: null,
            offsetX: 0,
            offsetY: 0,
            x: 0,
            y: 0
        };

        function getFoodCenter() {
            return {
                x: foodDrag.x + FOOD_SIZE / 2,
                y: foodDrag.y + FOOD_SIZE / 2
            };
        }

        function floatFood() {
            const rect = draggableFood.getBoundingClientRect();
            foodDrag.x = rect.left + window.scrollX;
            foodDrag.y = rect.top + window.scrollY;

            document.body.appendChild(draggableFood);
            draggableFood.classList.add('floating');
            draggableFood.style.left = foodDrag.x + 'px';
            draggableFood.style.top = foodDrag.y + 'px';
            draggableFood.style.transform = '';

            foodDrag.active = true;
            updateFoodUI();
        }

        function resetFoodToSlot() {
            draggableFood.classList.remove('floating', 'caught', 'dragging', 'gone');
            draggableFood.style.transition = 'none';
            draggableFood.style.left = '';
            draggableFood.style.top = '';
            draggableFood.style.transform = '';
            draggableFood.style.opacity = '';
            foodSlotEl.appendChild(draggableFood);
            void draggableFood.offsetWidth;
            draggableFood.style.transition = '';

            foodDrag.active = false;
            foodDrag.dragging = false;
            foodDrag.caught = false;
            foodDrag.pointerId = null;
            updateFoodUI();
        }

        function moveFoodTo(clientX, clientY) {
            foodDrag.x = clientX + window.scrollX - foodDrag.offsetX;
            foodDrag.y = clientY + window.scrollY - foodDrag.offsetY;

            const maxX = Math.max(0, document.documentElement.scrollWidth - FOOD_SIZE);
            const maxY = Math.max(0, document.documentElement.scrollHeight - FOOD_SIZE);
            foodDrag.x = clamp(foodDrag.x, 0, maxX);
            foodDrag.y = clamp(foodDrag.y, 0, maxY);

            draggableFood.style.left = foodDrag.x + 'px';
            draggableFood.style.top = foodDrag.y + 'px';
        }

        draggableFood.addEventListener('pointerdown', function(e) {
            if (foodDrag.caught) return;
            if (petState.eating) return;
            if (hasFedToday()) {
                say('今天已经吃过啦，明天再来~', 1800);
                return;
            }
            if (getFoodCount() < 1) {
                say('还没有猫粮…去看看帖子攒猫粮喵~', 2200);
                return;
            }

            e.preventDefault();

            const rect = draggableFood.getBoundingClientRect();
            foodDrag.offsetX = e.clientX - rect.left;
            foodDrag.offsetY = e.clientY - rect.top;
            foodDrag.pointerId = e.pointerId;
            foodDrag.dragging = true;

            draggableFood.classList.add('dragging');
            try { draggableFood.setPointerCapture(e.pointerId); } catch (err) {}

            if (!foodDrag.active) {
                floatFood();
            }

            petState.running = false;
            pet.classList.remove('running');
            petState.chasingFood = true;
            petState.nextMeowAt = performance.now() + 200;
            say('小鱼干！等我！', 1000);
        });

        draggableFood.addEventListener('pointermove', function(e) {
            if (!foodDrag.dragging) return;
            if (e.pointerId !== foodDrag.pointerId) return;
            moveFoodTo(e.clientX, e.clientY);
        });

        function endFoodDrag(e) {
            if (!foodDrag.dragging) return;
            if (e && foodDrag.pointerId !== null && e.pointerId !== foodDrag.pointerId) return;

            foodDrag.dragging = false;
            draggableFood.classList.remove('dragging');

            try {
                if (foodDrag.pointerId !== null) draggableFood.releasePointerCapture(foodDrag.pointerId);
            } catch (err) {}
            foodDrag.pointerId = null;

            if (!foodDrag.caught && foodDrag.active) {
                const slotRect = foodSlotEl.getBoundingClientRect();
                const slotCx = slotRect.left + slotRect.width / 2;
                const slotCy = slotRect.top + slotRect.height / 2;
                const foodRect = draggableFood.getBoundingClientRect();
                const foodCx = foodRect.left + foodRect.width / 2;
                const foodCy = foodRect.top + foodRect.height / 2;
                const distToSlot = Math.hypot(foodCx - slotCx, foodCy - slotCy);

                if (distToSlot < 40) {
                    resetFoodToSlot();
                    petState.chasingFood = false;
                    setRandomIdleDirection();
                }
            }
        }

        draggableFood.addEventListener('pointerup', endFoodDrag);
        draggableFood.addEventListener('pointercancel', endFoodDrag);

        function catchFood() {
            if (!petState.chasingFood) return;

            foodDrag.caught = true;
            foodDrag.dragging = false;
            petState.chasingFood = false;
            petState.vx = 0;
            petState.vy = 0;

            try {
                if (foodDrag.pointerId !== null) draggableFood.releasePointerCapture(foodDrag.pointerId);
            } catch (err) {}
            foodDrag.pointerId = null;

            draggableFood.classList.remove('dragging');
            draggableFood.classList.add('caught');
            draggableFood.style.left = foodDrag.x + 'px';
            draggableFood.style.top = foodDrag.y + 'px';

            startEating();
        }

        function startEating() {
            petState.eating = true;
            petState.vx = 0;
            petState.vy = 0;
            petState.nextEatSpeechAt = performance.now() + 600;

            say('啊呜~', 650);

            setTimeout(() => {
                draggableFood.classList.add('gone');
            }, 1200);

            setTimeout(finishEating, 1800);
        }

        function finishEating() {
            petState.eating = false;

            draggableFood.classList.remove('gone', 'caught', 'floating', 'dragging');
            draggableFood.style.transition = 'none';
            draggableFood.style.left = '';
            draggableFood.style.top = '';
            draggableFood.style.transform = '';
            draggableFood.style.opacity = '';
            foodSlotEl.appendChild(draggableFood);
            void draggableFood.offsetWidth;
            draggableFood.style.transition = '';

            foodDrag.active = false;
            foodDrag.caught = false;
            foodDrag.dragging = false;
            foodDrag.pointerId = null;

            const count = getFoodCount();
            setFoodCount(Math.max(0, count - 1));
            safeSet(FEED_DATE_KEY, todayStr());
            updateFoodUI();

            petState.running = true;
            petState.runUntil = performance.now() + 3000;
            pet.classList.add('running');
            petState.nextMeowAt = performance.now() + 250;
            const angle = Math.random() * Math.PI * 2;
            const speed = randomRange(9, 12);
            petState.vx = Math.cos(angle) * speed;
            petState.vy = Math.sin(angle) * speed;

            say('好吃！最喜欢你啦喵~', 1800);
            setTimeout(() => say('喵呜~ 🍖', 1200), 1900);
        }

        feedBtn.addEventListener('click', function() {
            if (hasFedToday()) {
                say('我今天已经吃过啦，明天再来~', 1800);
                return;
            }
            if (getFoodCount() < 1) {
                say('还没有猫粮…去看看帖子攒猫粮喵~', 2200);
                return;
            }
            if (foodDrag.active || petState.eating) return;

            floatFood();

            const targetX = petState.x + 140 + Math.random() * 80;
            const targetY = petState.y - 60 + Math.random() * 120;
            const maxX = Math.max(0, document.documentElement.scrollWidth - FOOD_SIZE);
            const maxY = Math.max(0, document.documentElement.scrollHeight - FOOD_SIZE);
            foodDrag.x = clamp(targetX, 0, maxX);
            foodDrag.y = clamp(targetY, 0, maxY);
            draggableFood.style.left = foodDrag.x + 'px';
            draggableFood.style.top = foodDrag.y + 'px';

            petState.running = false;
            pet.classList.remove('running');
            petState.chasingFood = true;
            petState.nextMeowAt = performance.now() + 200;
            say('小鱼干！等我！', 1000);
        });

        function updateFoodUI() {
            const count = getFoodCount();
            const fed = hasFedToday();

            foodCountEl.textContent = count;

            if (foodDrag.active || count < 1) {
                foodSlotEl.classList.add('empty');
            } else {
                foodSlotEl.classList.remove('empty');
            }
            if (!foodDrag.active && fed && count > 0) {
                foodSlotEl.classList.add('locked');
            } else {
                foodSlotEl.classList.remove('locked');
            }

            if (fed) {
                feedStatusEl.textContent = '今日已喂 ✅（明天再来）';
                feedStatusEl.classList.add('fed');
                feedBtn.disabled = true;
                feedBtn.textContent = '今天喂过啦';
            } else if (count < 1) {
                feedStatusEl.textContent = '还没有猫粮（浏览帖子可 +1）';
                feedStatusEl.classList.remove('fed');
                feedBtn.disabled = true;
                feedBtn.textContent = '猫粮不足';
            } else {
                feedStatusEl.textContent = '拖动猫粮喂我，或点喂猫~';
                feedStatusEl.classList.remove('fed');
                feedBtn.disabled = false;
                feedBtn.textContent = '喂猫 🐱';
            }
        }

        document.getElementById('postList').addEventListener('click', function(e) {
            const link = e.target.closest('a[href*="post.html"]');
            if (!link) return;
            addFood(1);
        });

        window.addEventListener('storage', function(e) {
            if (e.key === FOOD_KEY || e.key === FEED_DATE_KEY) {
                if (foodDrag.active && !foodDrag.caught) {
                    resetFoodToSlot();
                    petState.chasingFood = false;
                }
                updateFoodUI();
            }
            if (e.key === FORTUNE_KEY || e.key === FORTUNE_STREAK_KEY) {
                renderFortune();
            }
        });

        let lastToday = todayStr();
        setInterval(function() {
            const cur = todayStr();
            if (cur !== lastToday) {
                lastToday = cur;
                if (foodDrag.active && !foodDrag.caught) {
                    resetFoodToSlot();
                    petState.chasingFood = false;
                }
                updateFoodUI();
            }
        }, 60 * 1000);

        updateFoodUI();

        /* =========================================================
           每日运势（需签到，数据存在浏览器本地）
           —— 严格只展示 1 宜 + 1 忌
           ========================================================= */
        const FORTUNE_KEY        = 'catball_fortune_v1';
        const FORTUNE_STREAK_KEY = 'catball_fortune_streak_v1';
        const FORTUNE_UID_KEY    = 'catball_fortune_uid_v1';
        const FORTUNE_VERSION    = 2;   // 数据版本；旧版数据会自动重建为 1 宜 1 忌

        const FORTUNE_LEVELS = [
            { name: '大吉',   weight: 8,  cls: 'lv-daji' },
            { name: '中吉',   weight: 15, cls: 'lv-zhongji' },
            { name: '小吉',   weight: 20, cls: 'lv-xiaoji' },
            { name: '平',     weight: 22, cls: 'lv-ping' },
            { name: '小凶',   weight: 15, cls: 'lv-xiaoxiong' },
            { name: '凶',     weight: 10, cls: 'lv-xiong' },
            { name: '大凶',   weight: 8,  cls: 'lv-daxiong' },
            { name: '？？？', weight: 2,  cls: 'lv-mystery' }
        ];

        /* 项目池：只保留项目名 */
        const FORTUNE_ITEMS = [
            '画猫球', '玩小恐龙', '运动', '陪猫玩', '熬夜', '换头像',
            '慢跑', '浇花', '刷短视频', '玩纸牌', '口算', '背课文',
            '刷习题', '上oj刷题', '养仙人球', '打游戏'
        ];

        const fortuneLevelEl  = document.getElementById('fortuneLevel');
        const fortuneDateEl   = document.getElementById('fortuneDate');
        const fortuneStreakEl = document.getElementById('fortuneStreak');
        const fortuneLinesEl  = document.getElementById('fortuneLines');
        const fortuneSignBtn  = document.getElementById('fortuneSignBtn');

        function getFortuneUid() {
            let uid = safeGet(FORTUNE_UID_KEY);
            if (!uid) {
                uid = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
                safeSet(FORTUNE_UID_KEY, uid);
            }
            return uid;
        }

        function fortuneSeed(str) {
            let h = 2166136261 >>> 0;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 16777619) >>> 0;
            }
            return h >>> 0;
        }

        function makeRand(seed) {
            let a = seed >>> 0;
            return function () {
                a = (a + 0x6D2B79F5) >>> 0;
                let t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function pickFortuneLevel(rand) {
            const total = FORTUNE_LEVELS.reduce((s, l) => s + l.weight, 0);
            let r = rand() * total;
            for (const lv of FORTUNE_LEVELS) {
                if (r < lv.weight) return lv;
                r -= lv.weight;
            }
            return FORTUNE_LEVELS[FORTUNE_LEVELS.length - 1];
        }

        // 随机取 2 个不重复项目（一个进宜、一个进忌）
        function pickTwoItems(rand) {
            const pool = FORTUNE_ITEMS.slice();
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(rand() * (i + 1));
                const tmp = pool[i];
                pool[i] = pool[j];
                pool[j] = tmp;
            }
            return [pool[0], pool[1]];
        }

        // 严格 1 宜 + 1 忌（大吉/大凶/？？？ 除外）
        function generateFortune(dateStr) {
            const uid = getFortuneUid();
            const rand = makeRand(fortuneSeed('catball::' + uid + '::' + dateStr));
            const lv = pickFortuneLevel(rand);

            let goods = [];
            let bads = [];

            if (lv.name === '大吉') {
                goods = ['诸事皆宜'];
            } else if (lv.name === '大凶') {
                bads = ['诸事不宜'];
            } else if (lv.name !== '？？？') {
                const picked = pickTwoItems(rand);
                goods = [picked[0]];   // 只有 1 条宜
                bads = [picked[1]];    // 只有 1 条忌
            }

            return { v: FORTUNE_VERSION, date: dateStr, level: lv.name, cls: lv.cls, goods: goods, bads: bads };
        }

        function getTodayFortune() {
            const raw = safeGet(FORTUNE_KEY);
            if (!raw) return null;
            try {
                const f = JSON.parse(raw);
                if (!f || f.date !== todayStr() || !f.level || !f.cls) return null;
                if (!Array.isArray(f.goods) || !Array.isArray(f.bads)) return null;

                // 旧版本数据：保留“已签到”状态，重建为 1 宜 1 忌
                if (f.v !== FORTUNE_VERSION) {
                    const fresh = generateFortune(f.date);
                    setTodayFortune(fresh);
                    return fresh;
                }
                return f;
            } catch (e) {
                return null;
            }
        }

        function setTodayFortune(f) {
            safeSet(FORTUNE_KEY, JSON.stringify(f));
        }

        function getStreak() {
            const raw = safeGet(FORTUNE_STREAK_KEY);
            if (!raw) return { last: '', count: 0 };
            try {
                const s = JSON.parse(raw);
                if (s && typeof s.last === 'string' && Number.isFinite(s.count) && s.count >= 0) return s;
            } catch (e) { /* 忽略 */ }
            return { last: '', count: 0 };
        }

        function setStreak(s) {
            safeSet(FORTUNE_STREAK_KEY, JSON.stringify(s));
        }

        function currentStreakDisplay() {
            const s = getStreak();
            const today = todayStr();
            if (s.last === today) return s.count;
            if (s.last === yesterdayStr()) return s.count;
            return 0;
        }

        // 兼容旧数据：元素可能是字符串，也可能是 {name, desc}
        function fortuneItemName(en) {
            if (typeof en === 'string') return en;
            if (en && typeof en.name === 'string') return en.name;
            return '';
        }

        // 生成一行：标签 + 项目名（只取 1 条）
        function buildFortuneRow(type, label, entry) {
            const name = fortuneItemName(entry);
            if (!name) return null;

            const row = document.createElement('div');
            row.className = 'fortune-row fortune-' + type;

            const lbl = document.createElement('span');
            lbl.className = 'lbl';
            lbl.textContent = label;
            row.appendChild(lbl);

            const nameEl = document.createElement('span');
            nameEl.className = 'fortune-name';
            nameEl.textContent = name;
            row.appendChild(nameEl);

            return row;
        }

        function renderFortune() {
            const today = todayStr();
            const f = getTodayFortune();
            const streakDisplay = currentStreakDisplay();

            fortuneDateEl.textContent = today;

            if (!f) {
                fortuneLevelEl.textContent = '？';
                fortuneLevelEl.className = 'fortune-level lv-pending';

                fortuneLinesEl.innerHTML = '';
                const hint = document.createElement('span');
                hint.className = 'fortune-hint';
                hint.textContent = '点击右侧按钮签到，抽取今日运势~';
                fortuneLinesEl.appendChild(hint);

                fortuneSignBtn.style.display = '';
                fortuneStreakEl.textContent = streakDisplay > 0 ? `🔥 已连续签到 ${streakDisplay} 天` : '';
                return;
            }

            fortuneLevelEl.textContent = f.level;
            fortuneLevelEl.className = 'fortune-level ' + f.cls;
            fortuneSignBtn.style.display = 'none';
            fortuneStreakEl.textContent = streakDisplay > 0 ? `🔥 连续签到 ${streakDisplay} 天` : '';

            fortuneLinesEl.innerHTML = '';

            if (f.level === '？？？') return;   // 什么也不写

            // 严格只取第 1 条宜 / 第 1 条忌
            if (f.goods && f.goods.length) {
                const row = buildFortuneRow('good', '宜', f.goods[0]);
                if (row) fortuneLinesEl.appendChild(row);
            }
            if (f.bads && f.bads.length) {
                const row = buildFortuneRow('bad', '忌', f.bads[0]);
                if (row) fortuneLinesEl.appendChild(row);
            }
        }

        function signFortune() {
            const today = todayStr();
            const yesterday = yesterdayStr();
            const s = getStreak();

            let newCount;
            if (s.last === today) {
                newCount = s.count;
            } else if (s.last === yesterday) {
                newCount = s.count + 1;
            } else {
                newCount = 1;
            }

            setStreak({ last: today, count: newCount });
            setTodayFortune(generateFortune(today));

            renderFortune();
            say('签到成功！喵~ 🔮', 1500);
        }

        fortuneSignBtn.addEventListener('click', signFortune);

        let lastFortuneDate = todayStr();
        setInterval(function () {
            const cur = todayStr();
            if (cur !== lastFortuneDate) {
                lastFortuneDate = cur;
                renderFortune();
            }
        }, 60 * 1000);

        renderFortune();
    </script>
</body>
</html>
