<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫球小站</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ---------- 安全锁定层 ---------- */
        .lock-screen {
            position: fixed;
            inset: 0;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa, #e4e8ef);
            backdrop-filter: blur(8px);
            padding: 20px;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .lock-card {
            width: 100%;
            max-width: 380px;
            padding: 32px 28px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .lock-title {
            font-size: 20px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .lock-desc {
            font-size: 14px;
            color: #718096;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .lock-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .lock-input:focus {
            border-color: #8fb0ff;
            box-shadow: 0 0 0 3px rgba(143, 176, 255, 0.2);
        }

        .lock-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #8fb0ff;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .lock-btn:hover {
            background: #6f97ff;
        }

        .lock-btn:active {
            transform: scale(0.98);
        }

        .lock-tip {
            margin-top: 14px;
            font-size: 13px;
            min-height: 18px;
            color: #e53e3e;
        }

        .pet-wrap {
            position: absolute;
            left: 0;
            top: 0;
            width: 94px;
            height: 94px;
            z-index: 9999;
            user-select: none;
            pointer-events: auto;
            opacity: 0;
            transform: translate3d(32px, 140px, 0);
            will-change: transform;
            transition: opacity 0.2s ease;
        }

        .pet {
            position: absolute;
            left: 12px;
            top: 12px;
            width: 72px;
            height: 72px;
            cursor: pointer;
            background: url('images/catball.png') center/contain no-repeat;
            image-rendering: auto;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.18));
            transition: transform 0.15s ease, filter 0.15s ease;
            will-change: transform;
        }

        .pet-name-label {
            position: absolute;
            z-index: 3;
            top: -34px;
            left: 50%;
            max-width: 150px;
            overflow: hidden;
            padding: 2px 8px;
            border: 1px solid rgba(88, 73, 125, 0.18);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.94);
            color: #58497d;
            font-size: 12px;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .pet-away-sign {
            position: absolute;
            top: 18px;
            left: 0;
            width: 94px;
            padding: 8px 4px;
            border: 2px solid #9a6b36;
            border-radius: 6px;
            background: #ffe4a8;
            color: #704716;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.4;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.16);
            pointer-events: none;
        }

        .pet-wrap.visiting > .pet,
        .pet-wrap.visiting > .pet-name-label,
        .pet-wrap.visiting > .pet-cosmetic,
        .pet-wrap.visiting > .pet-speech {
            display: none;
        }

        .pet-name-settings {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 7px;
            margin: 8px 0;
            color: #58497d;
            font-size: 13px;
        }

        .pet-name-settings input {
            width: 140px;
            min-height: 32px;
            padding: 4px 8px;
            border: 1px solid #d6dde8;
            border-radius: 7px;
        }

        .pet-name-settings button {
            min-height: 32px;
            padding: 4px 10px;
            border: 0;
            border-radius: 7px;
            background: #8fb0ff;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .pet-cosmetic {
            position: absolute;
            z-index: 1;
            display: none;
            pointer-events: none;
        }

        .pet-cosmetic.active {
            display: block;
        }

        .pet-sign {
            top: -4px;
            left: 50%;
            padding: 2px 8px;
            border: 2px solid #fff;
            border-radius: 8px;
            background: linear-gradient(110deg, #ff5577, #ffbf3f, #55d878, #4ab8ff, #b45cff, #ff5577);
            background-size: 250% 100%;
            color: #fff;
            font-size: 10px;
            font-weight: 900;
            line-height: 1.4;
            white-space: nowrap;
            transform: translateX(-50%);
            animation: sign-rainbow 2.4s linear infinite;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        }

        @keyframes sign-rainbow {
            to { background-position: 250% 0; }
        }

        .pet-ingot {
            top: -10px;
            left: 50%;
            width: 38px;
            height: 30px;
            transform: translateX(-50%);
        }

        .pet-scooter {
            left: 8px;
            bottom: -3px;
            width: 76px;
            height: 30px;
        }

        .pet:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.22));
        }

        .pet.running {
            transform: scale(1.12);
            filter: drop-shadow(0 8px 16px rgba(255, 120, 120, 0.35));
        }

        .pet-speech {
            position: absolute;
            left: 72px;
            top: 8px;
            max-width: 180px;
            padding: 7px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            color: #333;
            font-size: 13px;
            line-height: 1.3;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }

        .pet-speech::before {
            content: "";
            position: absolute;
            left: -8px;
            top: 12px;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.96);
            border-left: 1px solid rgba(0, 0, 0, 0.08);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            transform: rotate(45deg);
        }

        .pet-speech.left {
            left: auto;
            right: 72px;
        }

        .pet-speech.left::before {
            left: auto;
            right: -8px;
            border-left: none;
            border-right: 1px solid rgba(0, 0, 0, 0.08);
            transform: rotate(-45deg);
        }

        .pet-speech.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ---------- 标题 + 小黑板 ---------- */
        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            vertical-align: middle;
            flex-wrap: wrap;
            width: 100%;
        }

        .header-brand h1 {
            margin: 0;
        }

        .header-brand.vip-brand h1 {
            color: #c58a16;
            text-shadow: 0 1px 0 #fff0b3;
        }

        .vip-badge {
            display: none;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 10px;
            background: linear-gradient(135deg, #ffe58f, #d99a18);
            color: #6a4100;
            font-size: 11px;
            vertical-align: middle;
        }

        .header-brand.vip-brand .vip-badge {
            display: inline-block;
        }

        .economy-actions {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .economy-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 10px;
            border: 1px solid #d6dde8;
            border-radius: 8px;
            background: #fff;
            color: #45516a;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .economy-toggle:hover {
            border-color: #8fb0ff;
            color: #3d6bdc;
        }

        .economy-toggle svg {
            width: 20px;
            height: 20px;
            flex: 0 0 auto;
        }

        .economy-panel {
            flex: 1 0 100%;
            padding: 14px;
            border: 1px solid #dfe5ef;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 4px 14px rgba(35, 55, 90, 0.1);
        }

        .economy-panel[hidden] {
            display: none;
        }

        .economy-panel-head,
        .economy-panel-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .economy-panel-head {
            margin-bottom: 12px;
        }

        .economy-panel-head h2 {
            margin: 0;
            font-size: 17px;
        }

        .economy-close {
            border: 0;
            background: transparent;
            color: #68748a;
            font-size: 22px;
            cursor: pointer;
        }

        .economy-balance {
            margin-bottom: 10px;
            color: #8a5b00;
            font-weight: 700;
        }

        .economy-products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(205px, 1fr));
            gap: 8px;
        }

        .economy-product {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border: 1px solid #e6eaf1;
            border-radius: 10px;
            background: #fbfcfe;
            color: #344054;
            text-align: left;
            cursor: pointer;
        }

        .economy-product:hover:not(:disabled) {
            border-color: #9db8f5;
            background: #f5f8ff;
        }

        .economy-product:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .economy-product svg {
            width: 36px;
            height: 36px;
            flex: 0 0 auto;
        }

        .economy-product-copy {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .economy-product-copy strong {
            font-size: 13px;
        }

        .economy-product-copy small {
            color: #758096;
            font-size: 11px;
        }

        .economy-section {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #edf0f5;
        }

        .economy-section h3 {
            margin: 0 0 8px;
            font-size: 14px;
        }

        .economy-controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .economy-controls input,
        .economy-controls select {
            min-height: 36px;
            padding: 6px 9px;
            border: 1px solid #d6dde8;
            border-radius: 7px;
            background: #fff;
            color: #344054;
        }

        .economy-action-btn,
        .wardrobe-choice {
            padding: 7px 12px;
            border: 0;
            border-radius: 7px;
            background: #8fb0ff;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .economy-action-btn:disabled,
        .wardrobe-choice:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .economy-message {
            min-height: 20px;
            margin: 8px 0 0;
            color: #68748a;
            font-size: 12px;
        }

        .economy-message.error {
            color: #c53030;
        }

        .wardrobe-choices {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .wardrobe-choice.active {
            background: #3f8f58;
        }

        .blackboard {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch;
            width: 190px;
            min-height: 92px;
            padding: 6px 9px;
            background:
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.06) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.05) 0%, transparent 40%),
                linear-gradient(135deg, #2c4a3a, #1e3628);
            border: 4px solid #8a6a3f;
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.22), inset 0 0 26px rgba(0, 0, 0, 0.3);
            color: #e8f2eb;
            font-family: 'Comic Sans MS', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.15s ease;
        }

        .blackboard.shake {
            animation: bb-shake 0.3s ease;
        }

        @keyframes bb-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px) rotate(-0.5deg); }
            75% { transform: translateX(3px) rotate(0.5deg); }
        }

        .bb-idle {
            text-align: center;
            line-height: 1.4;
        }

        .bb-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .bb-hint {
            font-size: 10px;
            color: #b8d4c4;
        }

        .bb-question {
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 4px rgba(220, 255, 230, 0.3);
            white-space: nowrap;
        }

        .bb-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            width: 100%;
        }

        .bb-option {
            padding: 3px 4px;
            border: 1px solid rgba(230, 245, 235, 0.7);
            background: rgba(255, 255, 255, 0.08);
            color: #e8f2eb;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s ease, transform 0.1s ease;
            line-height: 1.2;
        }

        .bb-option:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .bb-option:active {
            transform: scale(0.96);
        }

        .bb-option.correct {
            background: rgba(120, 220, 130, 0.35);
            border-color: #7ed684;
            color: #eaffee;
        }

        .bb-option.wrong {
            background: rgba(230, 100, 100, 0.35);
            border-color: #e67878;
            color: #fff1f1;
        }

        .bb-progress {
            margin-top: 5px;
            font-size: 9px;
            color: #b8d4c4;
            letter-spacing: 0.3px;
            text-align: center;
            line-height: 1.3;
        }

        @media (max-width: 700px) {
            .header-brand {
                display: flex;
                width: 100%;
            }
            .blackboard {
                width: 100%;
            }
            .economy-actions {
                width: 100%;
            }
            .economy-toggle {
                flex: 1;
                justify-content: center;
            }
        }

        /* ---------- 猫粮状态栏 ---------- */
        .pet-food-bar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 14px;
            margin: 8px 18px;
            padding: 8px 14px;
            background: linear-gradient(135deg, #fff8ec, #ffe9cc);
            border: 1px solid rgba(210, 160, 90, 0.35);
            border-radius: 12px;
            font-size: 14px;
            color: #6d3a00;
            box-shadow: 0 2px 8px rgba(180, 120, 40, 0.08);
        }

        .pet-food-info {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .pet-food-info strong {
            font-size: 1.15em;
            color: #d47700;
            transition: color 0.25s ease, transform 0.25s ease;
            display: inline-block;
            min-width: 1em;
            text-align: center;
        }

        .pet-food-info strong.flash {
            color: #ff8800;
            transform: scale(1.35);
        }

        .pet-food-status {
            color: #a06b28;
            font-size: 13px;
        }

        .pet-food-status.fed {
            color: #2f8a2f;
            font-weight: 600;
        }

        .pet-food-btn {
            margin-left: auto;
            padding: 6px 16px;
            border: none;
            border-radius: 8px;
            background: #ffbf66;
            color: #3a2200;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .pet-food-btn:hover:not(:disabled) {
            background: #ffb144;
        }

        .pet-food-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .pet-food-btn:disabled {
            background: #e8dccb;
            color: #a08b70;
            cursor: not-allowed;
        }

        /* 猫粮槽位 */
        .food-slot {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: 2px dashed rgba(210, 160, 90, 0.55);
            background: rgba(255, 255, 255, 0.55);
            flex: 0 0 auto;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .food-slot.empty {
            border-color: rgba(190, 190, 190, 0.5);
            background: rgba(250, 250, 250, 0.4);
        }

        .food-slot.empty::after {
            content: "空";
            font-size: 12px;
            color: #b8a888;
            letter-spacing: 1px;
        }

        .food-slot.empty .draggable-food {
            display: none;
        }

        .food-slot.locked .draggable-food {
            cursor: not-allowed;
            filter: grayscale(0.4);
            opacity: 0.65;
        }

        .draggable-food {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffe0b0, #ffbf66 55%, #e8963f);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            line-height: 1;
            cursor: grab;
            user-select: none;
            touch-action: none;
            box-shadow: 0 2px 6px rgba(180, 120, 40, 0.35);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .draggable-food:hover {
            transform: scale(1.1);
        }

        .draggable-food.dragging {
            cursor: grabbing;
            transform: scale(1.15);
            box-shadow: 0 6px 14px rgba(180, 120, 40, 0.5);
        }

        .draggable-food.floating {
            position: absolute;
            z-index: 10000;
            margin: 0;
            transition: none;
            box-shadow: 0 8px 18px rgba(180, 120, 40, 0.5);
        }

        .draggable-food.caught {
            cursor: default;
            z-index: 9998;
            box-shadow: 0 0 0 3px rgba(255, 150, 100, 0.45), 0 2px 6px rgba(180, 120, 40, 0.35);
        }

        .draggable-food.gone {
            transform: scale(0.1);
            opacity: 0;
            transition: transform 0.45s ease, opacity 0.45s ease;
        }

        @media (max-width: 500px) {
            .pet-food-btn {
                margin-left: 0;
                width: 100%;
            }
        }

        /* ---------- 每日运势 ---------- */
        .daily-fortune-card {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px 18px;
            margin: 8px 18px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #fffdf7, #eef4ff);
            border: 1px solid rgba(150, 160, 200, 0.28);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(90, 110, 180, 0.08);
        }

        .fortune-level {
            flex: 0 0 auto;
            min-width: 86px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: 2px;
            text-align: center;
            white-space: nowrap;
            border: 2px solid transparent;
        }

        .fortune-level.lv-daji      { color: #d4380d; background: #fff3e8; border-color: #ffb08a; }
        .fortune-level.lv-zhongji   { color: #d46b08; background: #fff8e6; border-color: #ffd591; }
        .fortune-level.lv-xiaoji    { color: #ad8b00; background: #fffbe6; border-color: #ffe58f; }
        .fortune-level.lv-ping      { color: #4a5568; background: #f7f9fc; border-color: #cbd5e0; }
        .fortune-level.lv-xiaoxiong { color: #3c7a89; background: #eff9fb; border-color: #a8d8e2; }
        .fortune-level.lv-xiong     { color: #4a5568; background: #f0f2f5; border-color: #b8c0cc; }
        .fortune-level.lv-daxiong   { color: #2d3748; background: #e8eaee; border-color: #9aa3b0; }
        .fortune-level.lv-mystery   { color: #8e44ad; background: #f8f2ff; border-color: #d3b3ef; letter-spacing: 0; }
        .fortune-level.lv-pending   { color: #9aa3b0; background: #f5f7fa; border-color: #d5dbe4; }

        .fortune-main {
            flex: 1 1 200px;
            min-width: 0;
        }

        .fortune-head {
            font-size: 13px;
            color: #8a94a6;
            margin-bottom: 6px;
        }

        .fortune-date {
            margin-left: 8px;
            color: #b0b8c6;
            font-variant-numeric: tabular-nums;
        }

        .fortune-streak {
            margin-left: 10px;
            color: #e07a2f;
            font-weight: 600;
        }

        .fortune-sign-btn {
            margin-left: auto;
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            background: #8fb0ff;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .wand-slot {

        }

        .wand-slot.empty .draggable-wand {
            display: none;
        }

        .draggable-wand {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;

        .draggable-wand.floating {

    <script>
        /* =========================================================
           安全锁系统
           ========================================================= */
        const CORRECT_KEY_HASH = '209810201699e6e8c5d142008571494ea0b12e05c8dff301b406001aa48046f3';
        const UNLOCK_TOKEN_KEY = 'catball_unlock_token_v1';
        const LOCK_START_MIN = 10 * 60;   // 10:00
        const LOCK_END_MIN = 17 * 60 + 15; // 17:15

        const lockScreen = document.getElementById('lockScreen');
        const lockKeyInput = document.getElementById('lockKeyInput');
        const lockUnlockBtn = document.getElementById('lockUnlockBtn');
        const lockTip = document.getElementById('lockTip');

        // 安全读写本地存储
        function lockSafeGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function lockSafeSet(key, value) {
            try { localStorage.setItem(key, value); } catch (e) {}
        }

        // 获取当日日期字符串
        function lockTodayStr() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        // 计算字符串的 SHA-256 哈希
        async function sha256(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // 判断当前是否为锁定时间（工作日 10:00-17:15）
        function isLockTime() {
            const now = new Date();
            const day = now.getDay(); // 0=周日, 1-5=周一到周五, 6=周六
            if (day < 1 || day > 5) return false; // 周末不锁定
            
            const minutes = now.getHours() * 60 + now.getMinutes();
            return minutes >= LOCK_START_MIN && minutes <= LOCK_END_MIN;
        }

        // 检查是否已解锁（当天有效）
        async function isUnlocked() {
            const raw = lockSafeGet(UNLOCK_TOKEN_KEY);
            if (!raw) return false;
            try {
                const data = JSON.parse(raw);
                if (data.date !== lockTodayStr()) return false;
                return data.hash === CORRECT_KEY_HASH;
            } catch (e) {
                return false;
            }
        }

        // 显示/隐藏锁定层
        function showLock(show) {
            lockScreen.style.display = show ? 'flex' : 'none';
        }

        // 执行解锁
        async function tryUnlock() {
            const input = lockKeyInput.value.trim();
            if (!input) {
                lockTip.textContent = '请输入密钥';
                return;
            }
            
            const inputHash = await sha256(input);
            if (inputHash === CORRECT_KEY_HASH) {
                const data = { date: lockTodayStr(), hash: inputHash };
                lockSafeSet(UNLOCK_TOKEN_KEY, JSON.stringify(data));
                lockTip.textContent = '';
                showLock(false);
            } else {
                lockTip.textContent = '密钥错误，请重试';
                lockKeyInput.value = '';
                lockKeyInput.focus();
            }
        }

        // 定时检查时间，自动处理锁定/解锁
        async function checkLockStatus() {
            if (!isLockTime()) {
                showLock(false);
                return;
            }
            
            const unlocked = await isUnlocked();
            if (!unlocked) {
                showLock(true);
            } else {
                showLock(false);
            }
        }

        // 事件绑定
        lockUnlockBtn.addEventListener('click', tryUnlock);
        lockKeyInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                tryUnlock();
            }
        });

        // 初始化 + 每分钟检查
        checkLockStatus();
        setInterval(checkLockStatus, 60 * 1000);

        /* =========================================================
           文章加载 / 渲染 / 搜索 / 排序 / 折叠
           ========================================================= */
        let allPosts = [];

        fetch('posts.json')
            .then(res => res.json())
            .then(data => {
                allPosts = data.posts;
                applyFilterAndSort();
            })
            .catch(err => {
                document.getElementById('postList').innerHTML = '<p class="error">加载失败，请检查 posts.json 语法是否正确</p>';
                console.error(err);
            });

        function renderPosts(posts) {
            const container = document.getElementById('postList');
            if (posts.length === 0) {
                container.innerHTML = '<p>没有找到相关帖子</p>';
                return;
            }
            let html = '';
            posts.forEach(post => {
                html += `
                <article class="post-card">
                    <h2><a href="post.html?id=${post.id}">${post.title}</a></h2>
                    <div class="post-meta">${post.date} · 作者：${post.author}</div>
                    <p class="post-summary">${post.summary}</p>
                </article>
                `;
            });
            container.innerHTML = html;
        }

        const searchInput = document.getElementById('searchInput');
        const searchTip = document.getElementById('searchTip');
        const sortBar = document.getElementById('sortBar');
        const SORT_KEY = 'catball_post_sort_v1';

        let currentSort = 'new';        // new | title | id
        let currentKeyword = '';

        // 读取上次选择
        try {
            const savedSort = localStorage.getItem(SORT_KEY);
            if (savedSort && ['new', 'title', 'id'].indexOf(savedSort) >= 0) {
                currentSort = savedSort;
            }
        } catch (e) { /* 忽略 */ }

        function sortPosts(posts, mode) {
            const list = posts.slice();

            list.sort((a, b) => {
                const priorityA = Number(a.top);
                const priorityB = Number(b.top);
                const pinnedOrder =
                    (Number.isFinite(priorityB) ? priorityB : 0) -
                    (Number.isFinite(priorityA) ? priorityA : 0);
                if (pinnedOrder !== 0) return pinnedOrder;

                if (mode === 'title') {
                    return String(a.title || '').localeCompare(
                        String(b.title || ''), 'zh-Hans-CN',
                        { numeric: true, sensitivity: 'base' }
                    );
                }
                if (mode === 'id') {
                    const na = Number(a.id);
                    const nb = Number(b.id);
                    if (Number.isFinite(na) && Number.isFinite(nb)) return na - nb;
                    return String(a.id).localeCompare(
                        String(b.id), 'zh-Hans-CN', { numeric: true }
                    );
                }

                // 默认：新的在前（日期倒序，同日期按编号倒序）
                const d = String(b.date || '').localeCompare(String(a.date || ''));
                if (d !== 0) return d;
                const na = Number(a.id);
                const nb = Number(b.id);
                if (Number.isFinite(na) && Number.isFinite(nb)) return nb - na;
                return 0;
            });
            return list;
        }

        function applyFilterAndSort() {

                list = list.filter(post =>

                    String(post.summary || '').toLowerCase().includes(kw) ||
                    String(post.content || '').toLowerCase().includes(kw)
                );
            }

            const sorted = sortPosts(list, currentSort);
            renderPosts(sorted);

            searchTip.textContent = currentKeyword
                ? `找到 ${sorted.length} 篇相关帖子`
                : '';
        }

        const idlePhrases = ['喵~', '喵呜~', '欢迎！', '我是猫球。', '哈哈，快来陪我玩！'];
        const returnPhrases = ['等等我！', '不要抛弃我！', '我回来了，慢点！'];

        const petState = {
            x: 32,

        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);

        function say(text, duration = 1400) {
            // 自动判断气泡方向
            const petRight = petState.x + petWrap.offsetWidth;
            const viewportRight = window.scrollX + window.innerWidth;
            const spaceRight = viewportRight - petRight;

            petSpeech.textContent = text;

        function setRandomIdleDirection() {
            const angle = Math.random() * Math.PI * 2;

        function setPetPosition() {

        function isPetOutsideViewport() {

        function animate(timestamp) {
            if (!petState.lastTime) petState.lastTime = timestamp;
            const delta = (timestamp - petState.lastTime) / 16.67;
            petState.lastTime = timestamp;

            if (petState.goingToBoard) {
                const dx = petState.boardTargetX - petState.x;
                const dy = petState.boardTargetY - petState.y;
                const dist = Math.hypot(dx, dy) || 1;

                if (dist < 12) {
                    petState.x = petState.boardTargetX;
                    petState.y = petState.boardTargetY;
                    petState.vx = 0;
                    petState.vy = 0;
                    petState.goingToBoard = false;
                    petState.atBoard = true;
                    startBoardQuiz();
                } else {
                    const speed = 13;
                    petState.vx = (dx / dist) * speed;
                    petState.vy = (dy / dist) * speed;

                    if (timestamp > petState.nextMeowAt) {
                        say('喵~', 500);
                        petState.nextMeowAt = timestamp + 900;
                    }
                }
            } else if (petState.atBoard) {
                petState.vx = 0;
                petState.vy = 0;
            } else if (petState.chasingWand && wandDrag.active) {
                const wc = getWandCenter();
                const pcx = petState.x + petWrap.offsetWidth / 2;
                const pcy = petState.y + petWrap.offsetHeight / 2;
                const dx = wc.x - pcx;
                const dy = wc.y - pcy;
                const dist = Math.hypot(dx, dy) || 1;

                if (dist > WAND_CATCH_DISTANCE) {
                    petState.vx = (dx / dist) * WAND_SPEED;
                    petState.vy = (dy / dist) * WAND_SPEED;
                } else {
                    petState.vx = 0;
                    petState.vy = 0;
                }

                if (timestamp > petState.nextWandSpeechAt) {
                    if (dist <= WAND_CATCH_DISTANCE) {
                        say(WAND_CATCH_PHRASES[Math.floor(Math.random() * WAND_CATCH_PHRASES.length)], 900);
                        petState.nextWandSpeechAt = timestamp + 2200;
                    } else {
                        say(WAND_PHRASES[Math.floor(Math.random() * WAND_PHRASES.length)], 800);
                        petState.nextWandSpeechAt = timestamp + 1800;
                    }
                }
            } else if (petState.chasingFood && foodDrag.active && !foodDrag.caught) {
                const fc = getFoodCenter();
                const pcx = petState.x + petWrap.offsetWidth / 2;
                const pcy = petState.y + petWrap.offsetHeight / 2;
                const dx = fc.x - pcx;
                const dy = fc.y - pcy;
                const dist = Math.hypot(dx, dy);

                if (dist < CATCH_DISTANCE) {
                    catchFood();
                } else {
                    const speed = 13;
                    petState.vx = (dx / dist) * speed;
                    petState.vy = (dy / dist) * speed;

                    if (timestamp > petState.nextMeowAt) {
                        say('喵喵~', 700);
                        petState.nextMeowAt = timestamp + 700;
                    }
                }
            } else if (petState.eating) {
                petState.vx = 0;
                petState.vy = 0;

                if (timestamp > petState.nextEatSpeechAt) {
                    say(EAT_PHRASES[Math.floor(Math.random() * EAT_PHRASES.length)], 520);
                    petState.nextEatSpeechAt = timestamp + 300 + Math.random() * 300;
                }
            } else if (petState.running) {
                if (timestamp > petState.runUntil) {
                    petState.running = false;
                    pet.classList.remove('running');
                    setRandomIdleDirection();
                } else {
                    if (timestamp > petState.nextMeowAt) {
                        say('喵喵~', 700);
                        petState.nextMeowAt = timestamp + 550;
                    }

                    petState.vx += randomRange(-2.4, 2.4) * delta;
                    petState.vy += randomRange(-2.4, 2.4) * delta;
                    const length = Math.hypot(petState.vx, petState.vy) || 1;
                    const maxSpeed = 11.5;
                    if (length > maxSpeed) {
                        petState.vx = (petState.vx / length) * maxSpeed;
                        petState.vy = (petState.vy / length) * maxSpeed;
                    }
                }
            } else if (isPetOutsideViewport()) {
                if (timestamp > petState.nextReturnSpeechAt) {
                    say(returnPhrases[Math.floor(Math.random() * returnPhrases.length)], 1500);
                    petState.nextReturnSpeechAt = timestamp + 2200;
                }

                const centerX = window.scrollX + window.innerWidth * 0.5;
                const centerY = window.scrollY + window.innerHeight * 0.5;
                const targetX = clamp(centerX - petWrap.offsetWidth / 2, 8, Math.max(8, document.body.scrollWidth - petWrap.offsetWidth - 8));
                const targetY = clamp(centerY - petWrap.offsetHeight / 2, 8, Math.max(8, document.body.scrollHeight - petWrap.offsetHeight - 8));
                const dx = targetX - petState.x;
                const dy = targetY - petState.y;
                const distance = Math.hypot(dx, dy) || 1;
                const speed = 13;
                petState.vx = (dx / distance) * speed;
                petState.vy = (dy / distance) * speed;

                if (distance < 18) {
                    petState.vx = 0;
                    petState.vy = 0;
                    setRandomIdleDirection();
                }
            } else {
                petState.idleTimer -= delta;
                if (petState.idleTimer <= 0) {
                    setRandomIdleDirection();
                }

                petState.vx *= 0.96;
                petState.vy *= 0.96;
                if (Math.hypot(petState.vx, petState.vy) < 0.35) {
                    setRandomIdleDirection();
                }

                if (timestamp > petState.nextIdleSpeechAt) {
                    const text = idlePhrases[Math.floor(Math.random() * idlePhrases.length)];
                    say(text, 1400);
                    petState.nextIdleSpeechAt = timestamp + randomRange(2800, 5200);
                }
            }

            const speedMultiplier = isScooterActive() ? 1.35 : 1;
            petState.x += petState.vx * delta * speedMultiplier;
            petState.y += petState.vy * delta * speedMultiplier;
            setPetPosition();
            requestAnimationFrame(animate);
        }

        /* =========================================================

        const FOOD_KEY        = 'catball_food_v1';
        const FEED_DATE_KEY   = 'catball_feed_date_v1';
        const READ_POSTS_KEY  = 'catball_read_posts_v1';
        const ECONOMY_KEY     = 'catball_economy_v1';
        const SALE_KEY        = 'catball_food_sale_v1';

        const FOOD_SIZE       = 34;

        function safeGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function safeSet(key, value) {
            try {
                localStorage.setItem(key, value);
                return true;
            } catch (e) {
                console.error(`无法保存本地数据（${key}）：`, e);
                return false;
            }
        }

        function readEconomy() {
            try {
                const data = JSON.parse(safeGet(ECONOMY_KEY) || '{}');
                const inventory = data.inventory || {};
                const points = Number(data.points);
                return {
                    points: Number.isSafeInteger(points) && points >= 0 ? points : 0,
                    inventory: {
                        signUntil: Number.isFinite(inventory.signUntil) ? inventory.signUntil : 0,
                        scooterUntil: Number.isFinite(inventory.scooterUntil) ? inventory.scooterUntil : 0,
                        ingotUntil: Number.isFinite(inventory.ingotUntil) ? inventory.ingotUntil : 0,
                        vipUntil: Number.isFinite(inventory.vipUntil) ? inventory.vipUntil : 0,
                        equipped: ['sign', 'scooter', 'ingot'].includes(inventory.equipped) ? inventory.equipped : ''
                    }
                };
            } catch (e) {
                console.error('无法读取积分和商店库存：', e);
                return {
                    points: 0,
                    inventory: { signUntil: 0, scooterUntil: 0, ingotUntil: 0, vipUntil: 0, equipped: '' }
                };
            }
        }

        const economyData = readEconomy();
        let pointsBalance = economyData.points;
        let storeInventory = economyData.inventory;

        function persistEconomy(nextPoints, nextInventory) {
            if (!Number.isSafeInteger(nextPoints) || nextPoints < 0) return false;
            const nextData = { points: nextPoints, inventory: nextInventory };
            if (!safeSet(ECONOMY_KEY, JSON.stringify(nextData))) return false;
            economyData.points = nextPoints;
            economyData.inventory = nextInventory;
            pointsBalance = nextPoints;
            storeInventory = nextInventory;
            updateFoodUI();
            if (typeof renderEconomy === 'function') renderEconomy();
            return true;
        }

        function isVipActive() {
            return storeInventory.vipUntil > Date.now();
        }

        function isScooterActive() {
            return storeInventory.scooterUntil > Date.now() && storeInventory.equipped === 'scooter';
        }

        function isIngotActive() {
            return storeInventory.ingotUntil > Date.now() && storeInventory.equipped === 'ingot';
        }

        function todayStr() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function yesterdayStr() {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function getFoodCount() {
            const raw = parseInt(safeGet(FOOD_KEY) || '0', 10);
            return Number.isFinite(raw) && raw > 0 ? raw : 0;
        }

        function setFoodCount(n) {
            const safe = Math.max(0, Math.floor(Number(n) || 0));
            safeSet(FOOD_KEY, String(safe));
            updateFoodUI();
        }

        function addFood(n = 1) {
            setFoodCount(getFoodCount() + n);
            flashFoodCount();

        function hasFedToday() {
            return safeGet(FEED_DATE_KEY) === todayStr();

            foodCountEl.classList.add('flash');
            clearTimeout(flashFoodCount._t);
            flashFoodCount._t = setTimeout(() => {
                foodCountEl.classList.remove('flash');
            }, 350);
        }

        function getReadPostsToday() {
            const raw = safeGet(READ_POSTS_KEY);
            if (!raw) return { date: todayStr(), ids: [] };
            try {
                const data = JSON.parse(raw);
                if (data && data.date === todayStr() && Array.isArray(data.ids)) {
                    return data;
                }
            } catch (e) { /* 忽略 */ }
            return { date: todayStr(), ids: [] };
        }

        function markPostReadOnce(id) {
            const data = getReadPostsToday();
            if (data.ids.indexOf(id) >= 0) return false;
            data.ids.push(id);
            data.date = todayStr();
            safeSet(READ_POSTS_KEY, JSON.stringify(data));
            return true;
        }

        const foodDrag = {
            active: false,
            dragging: false,
            caught: false,
            pointerId: null,
            offsetX: 0,
            offsetY: 0,
            startX: 0,
            startY: 0,
            moved: false,
            x: 0,
            y: 0
        };

        function getFoodCenter() {
            return {
                x: foodDrag.x + FOOD_SIZE / 2,
                y: foodDrag.y + FOOD_SIZE / 2
            };
        }

        function floatFood() {
            const rect = draggableFood.getBoundingClientRect();
            foodDrag.x = rect.left + window.scrollX;
            foodDrag.y = rect.top + window.scrollY;

            document.body.appendChild(draggableFood);
            draggableFood.classList.add('floating');
            draggableFood.style.left = foodDrag.x + 'px';
            draggableFood.style.top = foodDrag.y + 'px';
            draggableFood.style.transform = '';

            foodDrag.active = true;
            updateFoodUI();
        }

        function resetFoodToSlot() {
            draggableFood.classList.remove('floating', 'caught', 'dragging', 'gone');
            draggableFood.style.transition = 'none';
            draggableFood.style.left = '';
            draggableFood.style.top = '';
            draggableFood.style.transform = '';
            draggableFood.style.opacity = '';
            foodSlotEl.appendChild(draggableFood);
            void draggableFood.offsetWidth;
            draggableFood.style.transition = '';

            foodDrag.active = false;
            foodDrag.dragging = false;
            foodDrag.caught = false;
            foodDrag.pointerId = null;
            foodDrag.moved = false;
            updateFoodUI();
        }

        function moveFoodTo(clientX, clientY) {
            foodDrag.x = clientX + window.scrollX - foodDrag.offsetX;
            foodDrag.y = clientY + window.scrollY - foodDrag.offsetY;

            const maxX = Math.max(0, document.documentElement.scrollWidth - FOOD_SIZE);
            const maxY = Math.max(0, document.documentElement.scrollHeight - FOOD_SIZE);
            foodDrag.x = clamp(foodDrag.x, 0, maxX);
            foodDrag.y = clamp(foodDrag.y, 0, maxY);

            draggableFood.style.left = foodDrag.x + 'px';
            draggableFood.style.top = foodDrag.y + 'px';
        }

        draggableFood.addEventListener('pointerdown', function(e) {
            if (foodDrag.caught) return;
            if (petState.eating) return;
            if (hasFedToday() && !isVipActive()) {
                say('今天已经吃过啦，明天再来~', 1800);
                return;
            }
            if (!isVipActive() && getFoodCount() < MIN_FOOD) {
                say(`猫粮不够，还差 ${MIN_FOOD - getFoodCount()} 个喵~`, 2200);
                return;
            }

            if (petState.atBoard || petState.goingToBoard) {
                leaveBoard();
            }
            if (wandDrag.active) {
                resetWandToSlot();
            }

            e.preventDefault();

            const rect = draggableFood.getBoundingClientRect();
            foodDrag.offsetX = e.clientX - rect.left;
            foodDrag.offsetY = e.clientY - rect.top;
            foodDrag.startX = e.clientX;
            foodDrag.startY = e.clientY;
            foodDrag.pointerId = e.pointerId;
            foodDrag.dragging = true;
            foodDrag.moved = false;

            draggableFood.classList.add('dragging');

            if (!foodDrag.active) {
                floatFood();
            }
        });

        document.addEventListener('pointermove', function(e) {
            if (!foodDrag.dragging) return;
            if (e.pointerId !== foodDrag.pointerId) return;

            moveFoodTo(e.clientX, e.clientY);

            if (!foodDrag.moved) {
                const moved = Math.hypot(e.clientX - foodDrag.startX, e.clientY - foodDrag.startY);
                if (moved >= DRAG_START_THRESHOLD) {
                    foodDrag.moved = true;
                    petState.running = false;
                    pet.classList.remove('running');
                    petState.chasingFood = true;
                    petState.nextMeowAt = performance.now() + 200;
                    say('小鱼干！等我！', 1000);
                }
            }
        });

        function onGlobalPointerEnd(e) {
            if (!foodDrag.dragging) return;
            if (e.pointerId !== foodDrag.pointerId) return;
            endFoodDrag(e);
        }
        document.addEventListener('pointerup', onGlobalPointerEnd);
        document.addEventListener('pointercancel', onGlobalPointerEnd);

        function endFoodDrag(e) {
            foodDrag.dragging = false;
            draggableFood.classList.remove('dragging');
            foodDrag.pointerId = null;

            if (!foodDrag.caught && foodDrag.active) {
                const slotRect = foodSlotEl.getBoundingClientRect();
                const slotCx = slotRect.left + slotRect.width / 2;
                const slotCy = slotRect.top + slotRect.height / 2;
                const foodRect = draggableFood.getBoundingClientRect();
                const foodCx = foodRect.left + foodRect.width / 2;
                const foodCy = foodRect.top + foodRect.height / 2;
                const distToSlot = Math.hypot(foodCx - slotCx, foodCy - slotCy);

                if (distToSlot < 40) {
                    resetFoodToSlot();
                    petState.chasingFood = false;
                    setRandomIdleDirection();
                    return;
                }
            }
        }

            petState.vx = 0;

        function renderEconomy() {

            document.getElementById('pointsCountBar').textContent = pointsBalance;

            const now = Date.now();
            const nextInventory = { ...storeInventory };
            if (nextInventory.signUntil <= now) nextInventory.signUntil = 0;
            if (nextInventory.scooterUntil <= now) nextInventory.scooterUntil = 0;
            if (nextInventory.ingotUntil <= now) nextInventory.ingotUntil = 0;
            if (nextInventory.vipUntil <= now) nextInventory.vipUntil = 0;
            if (!nextInventory[`${nextInventory.equipped}Until`]) nextInventory.equipped = '';
            if (JSON.stringify(nextInventory) !== JSON.stringify(storeInventory)) {
                if (!saveInventory(nextInventory)) {
                    setEconomyMessage('限时物品状态保存失败，请检查浏览器存储空间。', true);

            wardrobeToggle.setAttribute('aria-expanded', String(mode === 'wardrobe'));

        function changePoints(delta) {
            if (!Number.isSafeInteger(delta) || !Number.isSafeInteger(pointsBalance + delta) ||
                pointsBalance + delta < 0) return false;
            return persistEconomy(pointsBalance + delta, storeInventory);
        }

        function buyProduct(product, cost) {
            if (cost > pointsBalance) {
                setEconomyMessage('积分不足，完成任务获取积分吧。', true);
                return;
            }

            if (product === 'lotteryBasic' || product === 'lotteryAdvanced') {
                const advanced = product === 'lotteryAdvanced';
                const multiplier = isIngotActive() ? 1.3 : 1;
                const boostedWeight = multiplier > 1 ? 15 - 25 * (multiplier - 1) : 15;
                const weights = [2 * multiplier, 8 * multiplier, 15 * multiplier, 60, boostedWeight];
                let roll = Math.random() * weights.reduce((sum, weight) => sum + weight, 0);
                let prize = -1;
                for (let i = 0; i < weights.length; i++) {
                    if (roll < weights[i]) {
                        prize = i;
                        break;
                    }
                    roll -= weights[i];
                }
                const rewards = advanced ? [120, 35, 25, 10, 0] : [80, 20, 10, 5, 0];
                const labels = ['特等奖', '一等奖', '二等奖', '三等奖', '未中奖'];
                const reward = rewards[prize];
                if (!persistEconomy(pointsBalance - cost + reward, storeInventory)) {
                    setEconomyMessage('积分保存失败，抽奖未完成。', true);
                    return;
                }
                setEconomyMessage(`${labels[prize]}！${reward ? `获得 ${reward} 积分。` : '下次好运！'}${multiplier > 1 ? '元宝加成生效。' : ''}`);
                return;
            }

            if (product === 'food') {
                const previousFood = getFoodCount();
                if (!safeSet(FOOD_KEY, String(previousFood + 1))) {
                    setEconomyMessage('猫粮保存失败，购买未完成。', true);
                    return;
                }
                if (!changePoints(-cost)) {
                    safeSet(FOOD_KEY, String(previousFood));
                    setEconomyMessage('积分保存失败，购买未完成。', true);
                    return;
                }
                updateFoodUI();
                setEconomyMessage('购买成功：猫粮 +1。');
                return;
            }

            const nextInventory = { ...storeInventory };
            const now = Date.now();
            if (product === 'sign') {
                nextInventory.signUntil = Math.max(now, nextInventory.signUntil) + 15 * 86400000;
                nextInventory.equipped = 'sign';
            } else if (product === 'scooter') {
                nextInventory.scooterUntil = Math.max(now, nextInventory.scooterUntil) + 15 * 86400000;
                nextInventory.equipped = 'scooter';
            } else if (product === 'ingot') {
                nextInventory.ingotUntil = Math.max(now, nextInventory.ingotUntil) + 15 * 86400000;
                nextInventory.equipped = 'ingot';
            } else if (product === 'vip') {
                nextInventory.vipUntil = Math.max(now, nextInventory.vipUntil) + 7 * 86400000;
            } else {
                setEconomyMessage('无法识别该商品。', true);
                return;
            }

            if (!persistEconomy(pointsBalance - cost, nextInventory)) {
                setEconomyMessage('购买数据保存失败，请检查浏览器存储空间。', true);
                return;
            }
            setEconomyMessage(product === 'vip'
                ? `VIP已开通，剩余 ${remainingDays(nextInventory.vipUntil)} 天。`
                : '购买成功，饰品已自动装备。');
        }

            const sale = getSaleData();
            const amount = Number(sellFoodAmount.value);
            const maxSell = Math.min(getFoodCount(), 3 - sale.count);
            if (!Number.isInteger(amount) || amount < 1 || amount > maxSell) {
                setEconomyMessage(`请输入 1 到 ${maxSell} 之间的出售数量。`, true);
                return;
            }

            const oldFood = getFoodCount();
            const nextSale = { date: todayStr(), count: sale.count + amount };
            if (!safeSet(FOOD_KEY, String(oldFood - amount))) {
                setEconomyMessage('猫粮数据保存失败，出售未完成。', true);
                return;
            }
            if (!safeSet(SALE_KEY, JSON.stringify(nextSale))) {
                safeSet(FOOD_KEY, String(oldFood));
                setEconomyMessage('出售记录保存失败，出售未完成。', true);
                return;
            }
            if (!changePoints(amount * 2)) {
                safeSet(FOOD_KEY, String(oldFood));
                safeSet(SALE_KEY, JSON.stringify(sale));
                setEconomyMessage('积分保存失败，出售未完成。', true);
                return;
            }
            updateFoodUI();
            renderEconomy();
            setEconomyMessage(`已出售 ${amount} 份猫粮，获得 ${amount * 2} 积分。`);
        });

        shopToggle.addEventListener('click', function() {
            setEconomyPanel('shop');
        });
        wardrobeToggle.addEventListener('click', function() {
            setEconomyPanel('wardrobe');
        });
        document.getElementById('economyClose').addEventListener('click', function() {
            economyPanel.hidden = true;
            shopToggle.setAttribute('aria-expanded', 'false');
            wardrobeToggle.setAttribute('aria-expanded', 'false');
        });

        renderEconomy();
        setInterval(renderEconomy, 60 * 1000);

        /* =========================================================
           黑板答题系统
           ========================================================= */
        const blackboard   = document.getElementById('blackboard');
        const bbIdle       = document.getElementById('bbIdle');
        const bbQuiz       = document.getElementById('bbQuiz');
        const bbQuestion   = document.getElementById('bbQuestion');
        const bbOptions    = document.getElementById('bbOptions');
        const bbProgress   = document.getElementById('bbProgress');

        const BLACKBOARD_TAP_REQUIRED = 3;
        let blackboardTaps = 0;

        const quizState = {
            active: false,
            correctCount: 0,
            totalForReward: 5,
            locked: false,
            current: null,
            wrongStreak: 0,
            combo: 0
        };

        function boardProgressText() {
            return `答对 ${quizState.correctCount} / ${quizState.totalForReward}（每答对5题奖励1猫粮）　连击 ${quizState.combo % 8}/8（每8次+4积分）`;
        }

        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateQuestion() {
            const types = ['+', '-', '×', '÷'];
            const type = types[Math.floor(Math.random() * types.length)];

            let a, b, answer, qText;

            if (type === '+') {
                a = randInt(10, 99);
                b = randInt(10, 99);
                answer = a + b;
                qText = `${a} + ${b} = ?`;
            } else if (type === '-') {
                a = randInt(10, 99);
                b = randInt(10, 99);
                if (a < b) { const t = a; a = b; b = t; }
                answer = a - b;
                qText = `${a} - ${b} = ?`;
            } else if (type === '×') {
                a = randInt(10, 99);
                b = randInt(2, 9);
                answer = a * b;
                qText = `${a} × ${b} = ?`;
            } else {
                b = randInt(2, 9);
                if (Math.floor(99 / b) < 10) b = 2;
                answer = randInt(10, Math.floor(99 / b));
                a = b * answer;
                qText = `${a} ÷ ${b} = ?`;
            }

            const opts = new Set([answer]);
            let guard = 0;
            while (opts.size < 4 && guard++ < 200) {
                const range = Math.max(3, Math.round(answer * 0.15));
                let delta = randInt(1, range);
                if (Math.random() < 0.5) delta = -delta;
                const v = answer + delta;
                if (v >= 0 && v !== answer) opts.add(v);
            }
            let pad = 1;
            while (opts.size < 4) {
                const v = answer + pad;
                if (v !== answer) opts.add(v);
                pad++;
                if (pad > 50) break;
            }

            const arr = Array.from(opts);
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const tmp = arr[i];
                arr[i] = arr[j];
                arr[j] = tmp;
            }

            return { qText: qText, answer: answer, options: arr };
        }

        function renderQuestion() {
            if (!quizState.active) return;

            const q = generateQuestion();
            quizState.current = q;
            quizState.locked = false;

            bbQuestion.textContent = q.qText;
            bbProgress.textContent = boardProgressText();
            bbOptions.innerHTML = '';

            q.options.forEach(function(v) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'bb-option';
                btn.textContent = v;
                btn.addEventListener('click', function(ev) {
                    ev.stopPropagation();
                    handleAnswer(btn, v);
                });
                bbOptions.appendChild(btn);
            });
        }

        function handleAnswer(btn, value) {
            if (!quizState.active || quizState.locked) return;
            if (!quizState.current) return;

            if (value === quizState.current.answer) {
                quizState.locked = true;
                quizState.wrongStreak = 0;
                btn.classList.add('correct');
                quizState.correctCount++;
                quizState.combo++;
                bbProgress.textContent = boardProgressText();
                if (quizState.combo % 8 === 0) {
                    if (changePoints(4)) {
                        say('连击8次，获得4积分！喵！', 1400);
                    } else {
                        setEconomyMessage('积分保存失败，连击奖励未能保存。', true);
                        say('答对啦喵！', 800);
                    }
                } else {
                    say('答对啦喵！', 800);
                }

                setTimeout(function() {
                    if (!quizState.active) return;

                    if (quizState.correctCount >= quizState.totalForReward) {
                        quizState.correctCount = 0;
                        addFood(1);
                        say('答对5题！奖励1个猫粮！喵呜~', 2000);
                        bbProgress.textContent = boardProgressText();
                        setTimeout(renderQuestion, 700);
                    } else {
                        renderQuestion();
                    }
                }, 500);
            } else {
                // 答错：锁定当前题，累计连错次数
                quizState.locked = true;
                quizState.wrongStreak = isVipActive() ? 0 : quizState.wrongStreak + 1;
                quizState.combo = 0;
                bbProgress.textContent = boardProgressText();
                btn.classList.add('wrong');

                if (quizState.wrongStreak >= 2 && !isVipActive()) {
                    // 连错两次 → 退出黑板，防止乱点刷分
                    say('连错两次啦，不玩了喵~', 1600);
                    setTimeout(function() {
                        if (!quizState.active) return;
                        leaveBoard();
                        say('我去跑一跑！', 1200);
                        petState.running = true;
                        petState.runUntil = performance.now() + 3000;
                        pet.classList.add('running');
                        petState.nextMeowAt = performance.now() + 250;
                        const angle = Math.random() * Math.PI * 2;
                        const speed = randomRange(8, 12);
                        petState.vx = Math.cos(angle) * speed;
                        petState.vy = Math.sin(angle) * speed;
                    }, 900);
                } else {
                    say('喵？再想想~', 900);
                    setTimeout(function() {
                        btn.classList.remove('wrong');
                        quizState.locked = false;
                    }, 600);
                }
            }
        }

        function startBoardQuiz() {
            quizState.active = true;
            quizState.correctCount = 0;
            quizState.locked = false;
            quizState.current = null;
            quizState.wrongStreak = 0;
            quizState.combo = 0;

            bbIdle.style.display = 'none';
            bbQuiz.style.display = '';
            bbProgress.textContent = boardProgressText();

            renderQuestion();
            say('我们来算算术吧喵！', 1400);
        }

        function hideBoardQuiz() {
            quizState.active = false;
            quizState.locked = false;
            quizState.current = null;
            quizState.wrongStreak = 0;
            quizState.combo = 0;
            bbQuiz.style.display = 'none';
            bbIdle.style.display = '';
            bbProgress.textContent = '';
            bbOptions.innerHTML = '';
        }

        function leaveBoard() {
            const wasActive = petState.atBoard || petState.goingToBoard;
            petState.atBoard = false;
            petState.goingToBoard = false;
            blackboardTaps = 0;
            hideBoardQuiz();
            if (wasActive) {
                setRandomIdleDirection();
            }
            return wasActive;
        }

        function attractPetToBoard() {
            if (petState.atBoard || petState.goingToBoard) return;
            if (petState.eating) {
                say('我在吃饭呢喵~', 1200);
                return;
            }
            if (petState.chasingFood || foodDrag.active) return;
            if (petState.chasingWand || wandDrag.active) return;

            const rect = blackboard.getBoundingClientRect();
            const maxX = Math.max(8, document.body.scrollWidth - petWrap.offsetWidth - 8);
            const maxY = Math.max(8, document.body.scrollHeight - petWrap.offsetHeight - 8);

            let tx, ty;
            // 窄屏（黑板占满宽度）时，猫球定位到黑板下方
            if (window.innerWidth <= 700) {
                tx = rect.left + window.scrollX + 12;
                ty = rect.bottom + window.scrollY + 10;
            } else {
                tx = rect.right + window.scrollX - 24;
                ty = rect.bottom + window.scrollY - 16;
            }

            petState.boardTargetX = clamp(tx, 8, maxX);
            petState.boardTargetY = clamp(ty, 8, maxY);

            petState.running = false;
            pet.classList.remove('running');
            petState.goingToBoard = true;
            petState.nextMeowAt = performance.now() + 200;
            say('小黑板叫我啦？喵！', 1200);
        }

        blackboard.addEventListener('click', function(e) {
            if (e.target.closest('.bb-option')) return;
            if (petState.atBoard) return;
            if (petState.goingToBoard) return;
            if (petState.eating) return;

            blackboardTaps++;
            blackboard.classList.remove('shake');
            void blackboard.offsetWidth;
            blackboard.classList.add('shake');

            if (blackboardTaps >= BLACKBOARD_TAP_REQUIRED) {
                blackboardTaps = 0;
                attractPetToBoard();
            } else {
                say(`再敲 ${BLACKBOARD_TAP_REQUIRED - blackboardTaps} 下喵~`, 900);
            }
        });

        /* =========================================================
           每日运势
           ========================================================= */
        const FORTUNE_KEY        = 'catball_fortune_v1';
        const FORTUNE_STREAK_KEY = 'catball_fortune_streak_v1';
        const FORTUNE_UID_KEY    = 'catball_fortune_uid_v1';

        const FORTUNE_LEVELS = [
            { name: '大吉',   weight: 8,  cls: 'lv-daji' },
            { name: '中吉',   weight: 15, cls: 'lv-zhongji' },
            { name: '小吉',   weight: 20, cls: 'lv-xiaoji' },
            { name: '平',     weight: 22, cls: 'lv-ping' },
            { name: '小凶',   weight: 15, cls: 'lv-xiaoxiong' },
            { name: '凶',     weight: 10, cls: 'lv-xiong' },
            { name: '大凶',   weight: 8,  cls: 'lv-daxiong' },
            { name: '？？？', weight: 2,  cls: 'lv-mystery' }
        ];

        const fortuneLevelEl  = document.getElementById('fortuneLevel');
        const fortuneDateEl   = document.getElementById('fortuneDate');
        const fortuneStreakEl = document.getElementById('fortuneStreak');
        const fortuneSignBtn  = document.getElementById('fortuneSignBtn');

        function getFortuneUid() {
            let uid = safeGet(FORTUNE_UID_KEY);
            if (!uid) {
                uid = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
                safeSet(FORTUNE_UID_KEY, uid);
            }
            return uid;
        }

        function fortuneSeed(str) {
            let h = 2166136261 >>> 0;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 16777619) >>> 0;
            }
            return h >>> 0;
        }

        function makeRand(seed) {
            let a = seed >>> 0;
            return function () {
                a = (a + 0x6D2B79F5) >>> 0;
                let t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function pickFortuneLevel(rand, ingotBoost = false) {
            const greatWeight = ingotBoost ? 8 * 1.6 : 8;
            const otherWeightMultiplier = ingotBoost ? (100 - greatWeight) / 92 : 1;
            const levels = FORTUNE_LEVELS.map(function(level) {
                return {
                    ...level,
                    weight: ingotBoost
                        ? (level.name === '大吉' ? greatWeight : level.weight * otherWeightMultiplier)
                        : level.weight
                };
            });
            const total = levels.reduce((s, l) => s + l.weight, 0);
            let r = rand() * total;
            for (const lv of levels) {
                if (r < lv.weight) return lv;
                r -= lv.weight;
            }
            return levels[levels.length - 1];
        }

        function generateFortune(dateStr) {
            const uid = getFortuneUid();
            const rand = makeRand(fortuneSeed('catball::' + uid + '::' + dateStr));
            const lv = pickFortuneLevel(rand, isIngotActive());
            return { date: dateStr, level: lv.name, cls: lv.cls };
        }

        function getTodayFortune() {
            const raw = safeGet(FORTUNE_KEY);
            if (!raw) return null;
            try {
                const f = JSON.parse(raw);
                if (!f || f.date !== todayStr() || !f.level || !f.cls) return null;
                return f;
            } catch (e) {
                return null;
            }
        }

        function setTodayFortune(f) {
            return safeSet(FORTUNE_KEY, JSON.stringify(f));
        }

        function getStreak() {
            const raw = safeGet(FORTUNE_STREAK_KEY);
            if (!raw) return { last: '', count: 0 };
            try {
                const s = JSON.parse(raw);
                if (s && typeof s.last === 'string' && Number.isFinite(s.count) && s.count >= 0) return s;
            } catch (e) { /* 忽略 */ }
            return { last: '', count: 0 };
        }

        function setStreak(s) {
            return safeSet(FORTUNE_STREAK_KEY, JSON.stringify(s));
        }

        function currentStreakDisplay() {
            const s = getStreak();
            const today = todayStr();
            if (s.last === today) return s.count;
            if (s.last === yesterdayStr()) return s.count;
            return 0;
        }

        function renderFortune() {
            const today = todayStr();
            const f = getTodayFortune();
            const streakDisplay = currentStreakDisplay();

            fortuneDateEl.textContent = today;

            if (!f) {
                fortuneLevelEl.textContent = '？';
                fortuneLevelEl.className = 'fortune-level lv-pending';

                fortuneSignBtn.style.display = '';
                fortuneStreakEl.textContent = streakDisplay > 0 ? `🔥 已连续签到 ${streakDisplay} 天` : '';
                return;
            }

            fortuneLevelEl.textContent = f.level;
            fortuneLevelEl.className = 'fortune-level ' + f.cls;
            fortuneSignBtn.style.display = 'none';
            fortuneStreakEl.textContent = streakDisplay > 0 ? `🔥 连续签到 ${streakDisplay} 天` : '';
        }

        function signFortune() {
            if (getTodayFortune()) return;

            const today = todayStr();
            const yesterday = yesterdayStr();
            const s = getStreak();

            let newCount;
            if (s.last === today) {
                newCount = s.count;
            } else if (s.last === yesterday) {
                newCount = s.count + 1;
            } else {
                newCount = 1;
            }

            if (!setStreak({ last: today, count: newCount }) ||
                !setTodayFortune(generateFortune(today))) {
                setEconomyMessage('签到记录保存失败，请检查浏览器存储空间。', true);
                return;
            }

            let rewardMessage = '';
            if (newCount > 3) {
                const reward = Math.floor(newCount * 0.5);
                if (changePoints(reward)) {
                    setEconomyMessage(`连续签到 ${newCount} 天，获得 ${reward} 积分！`);
                    rewardMessage = `获得 ${reward} 积分！`;
                } else {
                    setEconomyMessage('签到成功，但积分保存失败。', true);
                }
            }

            renderFortune();
            say(`签到成功！${rewardMessage}喵~ 🔮`, 1800);
        }

        fortuneSignBtn.addEventListener('click', signFortune);

        let lastFortuneDate = todayStr();
        setInterval(function () {
            const cur = todayStr();
            if (cur !== lastFortuneDate) {
                lastFortuneDate = cur;
                renderFortune();
            }
        }, 60 * 1000);

        renderFortune();

        /* =========================================================
           URL 重置入口
           ========================================================= */
        (function handleResetParam() {
            let params;
            try { params = new URLSearchParams(location.search); } catch (e) { return; }
            if (!params.has('reset')) return;

            const mode = (params.get('reset') || '1').toLowerCase();
            let didReset = false;

            if (mode === 'all') {
                try {
                    const keys = [];
                    for (let i = 0; i < localStorage.length; i++) {
                        const k = localStorage.key(i);
                        if (k && k.indexOf('catball_') === 0) keys.push(k);
                    }
                    keys.forEach(function(k) {
                        try { localStorage.removeItem(k); } catch (e) {}
                    });
                    economyData.points = 0;
                    economyData.inventory = {
                        signUntil: 0,
                        scooterUntil: 0,
                        ingotUntil: 0,
                        vipUntil: 0,
                        equipped: ''
                    };
                    pointsBalance = 0;
                    storeInventory = economyData.inventory;
                    didReset = true;
                } catch (e) { /* 忽略 */ }
            } else {
                try {
                    localStorage.removeItem(FEED_DATE_KEY);
                    didReset = true;
                } catch (e) { /* 忽略 */ }

                if (getFoodCount() < MIN_FOOD) {
                    try { localStorage.setItem(FOOD_KEY, String(MIN_FOOD)); } catch (e) {}
                }
            }

            try {
                const url = new URL(location.href);
                url.searchParams.delete('reset');
                history.replaceState(null, '', url.pathname + url.search + url.hash);
            } catch (e) { /* 忽略 */ }

            updateFoodUI();
            renderEconomy();
            renderFortune();

            if (didReset) {
                setTimeout(function() {
                    say(mode === 'all' ? '全部数据已重置喵~' : '喂食记录已重置喵~', 2400);
                }, 800);
            }
        })();

        (function handleNewPointsParam() {
            const params = new URLSearchParams(location.search);
            if (!params.has('newpoints')) return;

            const amount = Number(params.get('newpoints'));
            if (!Number.isSafeInteger(amount) || amount <= 0 ||
                amount > Number.MAX_SAFE_INTEGER - pointsBalance) {
                setEconomyMessage('newpoints 参数必须是正整数，且不能超过积分上限。', true);
                console.error('无效的 newpoints 参数。');
            } else if (persistEconomy(pointsBalance + amount, storeInventory)) {
                setEconomyPanel('shop');
                setEconomyMessage(`作弊码生效：增加 ${amount} 积分。`);
            } else {
                setEconomyMessage('积分保存失败，newpoints 未生效。', true);
            }

            params.delete('newpoints');
            const query = params.toString();
            history.replaceState(null, '', location.pathname + (query ? `?${query}` : '') + location.hash);
        })();
    </script>
