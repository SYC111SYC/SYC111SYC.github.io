<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简易发帖站</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>我的发帖站</h1>
  <a href="index.html">首页</a>
</header>

<div class="search-box">
  <input id="searchInput" type="text" placeholder="搜索帖子标题/内容...">
  <div id="searchResult"></div>
</div>

<main id="post-list">加载中...</main>

<!-- marked CDN -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="js/main.js"></script>
<script>
let allPosts = [];

fetch("posts.json")
.then(res=>res.json())
.then(data=>{
  allPosts = data.posts;
  renderList(allPosts);
})
.catch(err=>{
  document.getElementById("post-list").innerText = "posts.json加载失败";
  console.error(err);
})

// 渲染帖子列表
function renderList(posts){
  const container = document.getElementById("post-list");
  let html = "";
  posts.forEach(post=>{
    html += `
    <div class="post-card">
      <h2><a href="post.html?id=${post.id}">${post.title}</a></h2>
      <div class="meta">${post.date} | 作者：${post.author}</div>
      <p>${post.summary}</p>
    </div>
    `;
  })
  container.innerHTML = html;
}

// 搜索逻辑
const searchInput = document.getElementById("searchInput");
searchInput.addEventListener("input", function(){
  const kw = this.value.trim().toLowerCase();
  const resultDom = document.getElementById("searchResult");
  if(!kw){
    resultDom.innerHTML="";
    renderList(allPosts);
    return;
  }
  const filter = allPosts.filter(p=>
    p.title.toLowerCase().includes(kw)
    || p.summary.toLowerCase().includes(kw)
    || p.content.toLowerCase().includes(kw)
  );
  renderList(filter);
  if(filter.length ===0){
    resultDom.innerHTML="<p>没有找到匹配帖子</p>"
  }else{
    resultDom.innerHTML=`<p>找到 ${filter.length} 篇</p>`
  }
})
</script>
</body>
</html>
