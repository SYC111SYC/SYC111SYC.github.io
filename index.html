<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫球小站</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            position: relative;
            min-height: 100vh;
        }

        .pet-wrap {
            position: absolute;
            left: 0;
            top: 0;
            width: 94px;
            height: 94px;
            z-index: 9999;
            user-select: none;
            pointer-events: auto;
            opacity: 0;
            transform: translate3d(32px, 140px, 0);
            will-change: transform;
            transition: opacity 0.2s ease;
        }

        .pet {
            position: absolute;
            left: 12px;
            top: 12px;
            width: 72px;
            height: 72px;
            cursor: pointer;
            background: url('images/catball.png') center/contain no-repeat;
            image-rendering: auto;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.18));
            transition: transform 0.15s ease, filter 0.15s ease;
            will-change: transform;
        }

        .pet:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.22));
        }

        .pet.running {
            transform: scale(1.12);
            filter: drop-shadow(0 8px 16px rgba(255, 120, 120, 0.35));
        }

        .pet-speech {
            position: absolute;
            left: 72px;
            top: 8px;
            max-width: 180px;
            padding: 7px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            color: #333;
            font-size: 13px;
            line-height: 1.3;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }

        .pet-speech::before {
            content: "";
            position: absolute;
            left: -8px;
            top: 12px;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.96);
            border-left: 1px solid rgba(0, 0, 0, 0.08);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            transform: rotate(45deg);
        }

        .pet-speech.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <header>
        <h1>猫球小站</h1>
        <nav>
            <a href="index.html">首页</a>
            <a href="download.html">文件分享</a>
            <a href="rand.html">随机数抽取</a>
            <a href="calendar.html">日历与倒数日</a>
            <a href="clock.html">世界时间</a>
        </nav>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="搜索帖子标题或内容...">
        <p id="searchTip"></p>
    </div>

    <div class="post-card foldable-game">
        <div class="fold-header" id="foldToggle">
            <span>🎮 游戏中心</span>
            <span class="fold-arrow">▼</span>
        </div>
        <div class="fold-content" id="foldContent">
            <div class="game-item">
                <h4>🦖 小恐龙</h4>
                <p class="game-tip">按 <kbd>空格</kbd> 跳跃，<kbd>↓</kbd> 下蹲</p>
                <div class="game-viewport">
                    <iframe 
                        src="https://chromedino.com/embed/" 
                        frameborder="0"
                        scrolling="no"
                        class="game-iframe"
                        title="Chrome小恐龙游戏">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <main id="postList">加载中...</main>

    <div id="petWrap" class="pet-wrap" aria-label="桌宠" title="点击让我乱跑 10 秒">
        <div id="pet" class="pet"></div>
        <div id="petSpeech" class="pet-speech" aria-live="polite"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        let allPosts = [];

        fetch('posts.json')
            .then(res => res.json())
            .then(data => {
                allPosts = data.posts;
                renderPosts(allPosts);
            })
            .catch(err => {
                document.getElementById('postList').innerHTML = '<p class="error">加载失败，请检查 posts.json 语法是否正确</p>';
                console.error(err);
            });

        function renderPosts(posts) {
            const container = document.getElementById('postList');
            if (posts.length === 0) {
                container.innerHTML = '<p>没有找到相关帖子</p>';
                return;
            }
            let html = '';
            posts.forEach(post => {
                html += `
                <article class="post-card">
                    <h2><a href="post.html?id=${post.id}">${post.title}</a></h2>
                    <div class="post-meta">${post.date} · 作者：${post.author}</div>
                    <p class="post-summary">${post.summary}</p>
                </article>
                `;
            });
            container.innerHTML = html;
        }

        const searchInput = document.getElementById('searchInput');
        const searchTip = document.getElementById('searchTip');
        searchInput.addEventListener('input', function() {
            const keyword = this.value.trim().toLowerCase();
            if (!keyword) {
                searchTip.textContent = '';
                renderPosts(allPosts);
                return;
            }
            const filtered = allPosts.filter(post => 
                post.title.toLowerCase().includes(keyword) ||
                post.summary.toLowerCase().includes(keyword) ||
                post.content.toLowerCase().includes(keyword)
            );
            renderPosts(filtered);
            searchTip.textContent = `找到 ${filtered.length} 篇相关帖子`;
        });

        const foldToggle = document.getElementById('foldToggle');
        const foldContent = document.getElementById('foldContent');
        const foldArrow = foldToggle.querySelector('.fold-arrow');
        foldToggle.addEventListener('click', function() {
            const isOpen = foldContent.classList.toggle('open');
            foldArrow.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        const petWrap = document.getElementById('petWrap');
        const pet = document.getElementById('pet');
        const petSpeech = document.getElementById('petSpeech');
        let speechTimer = null;

        const idlePhrases = ['喵~', '喵呜~', '欢迎！', '我是猫球。', '哈哈，快来陪我玩！'];
        const returnPhrases = ['等等我！', '不要抛弃我！', '我回来了，慢点！'];

        const petState = {
            x: 32,
            y: 140,
            vx: 1,
            vy: 0.6,
            running: false,
            runUntil: 0,
            idleTimer: 0,
            nextIdleSpeechAt: 0,
            nextMeowAt: 0,
            nextReturnSpeechAt: 0,
            lastTime: 0
        };

        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function say(text, duration = 1400) {
            petSpeech.textContent = text;
            petSpeech.classList.add('visible');
            clearTimeout(speechTimer);
            speechTimer = setTimeout(() => {
                petSpeech.classList.remove('visible');
            }, duration);
        }

        function setRandomIdleDirection() {
            const angle = Math.random() * Math.PI * 2;
            const speed = randomRange(0.5, 1.1);
            petState.vx = Math.cos(angle) * speed;
            petState.vy = Math.sin(angle) * speed;
            petState.idleTimer = randomRange(60, 170);
        }

        function setPetPosition() {
            const maxX = Math.max(8, document.body.scrollWidth - petWrap.offsetWidth - 8);
            const maxY = Math.max(8, document.body.scrollHeight - petWrap.offsetHeight - 8);
            petState.x = clamp(petState.x, 8, maxX);
            petState.y = clamp(petState.y, 8, maxY);
            petWrap.style.transform = `translate3d(${petState.x}px, ${petState.y}px, 0)`;
        }

        function isPetOutsideViewport() {
            const left = petState.x;
            const top = petState.y;
            const right = left + petWrap.offsetWidth;
            const bottom = top + petWrap.offsetHeight;

            return right < window.scrollX - 20 ||
                left > window.scrollX + window.innerWidth + 20 ||
                bottom < window.scrollY - 20 ||
                top > window.scrollY + window.innerHeight + 20;
        }

        function animate(timestamp) {
            if (!petState.lastTime) petState.lastTime = timestamp;
            const delta = (timestamp - petState.lastTime) / 16.67;
            petState.lastTime = timestamp;

            if (petState.running) {
                if (timestamp > petState.runUntil) {
                    petState.running = false;
                    pet.classList.remove('running');
                    setRandomIdleDirection();
                } else {
                    if (timestamp > petState.nextMeowAt) {
                        say('喵喵~', 700);
                        petState.nextMeowAt = timestamp + 550;
                    }

                    petState.vx += randomRange(-2.4, 2.4) * delta;
                    petState.vy += randomRange(-2.4, 2.4) * delta;
                    const length = Math.hypot(petState.vx, petState.vy) || 1;
                    const maxSpeed = 11.5;
                    if (length > maxSpeed) {
                        petState.vx = (petState.vx / length) * maxSpeed;
                        petState.vy = (petState.vy / length) * maxSpeed;
                    }
                }
            } else if (isPetOutsideViewport()) {
                if (timestamp > petState.nextReturnSpeechAt) {
                    say(returnPhrases[Math.floor(Math.random() * returnPhrases.length)], 1500);
                    petState.nextReturnSpeechAt = timestamp + 2200;
                }

                const centerX = window.scrollX + window.innerWidth * 0.5;
                const centerY = window.scrollY + window.innerHeight * 0.5;
                const targetX = clamp(centerX - petWrap.offsetWidth / 2, 8, Math.max(8, document.body.scrollWidth - petWrap.offsetWidth - 8));
                const targetY = clamp(centerY - petWrap.offsetHeight / 2, 8, Math.max(8, document.body.scrollHeight - petWrap.offsetHeight - 8));
                const dx = targetX - petState.x;
                const dy = targetY - petState.y;
                const distance = Math.hypot(dx, dy) || 1;
                const speed = 13;
                petState.vx = (dx / distance) * speed;
                petState.vy = (dy / distance) * speed;

                if (distance < 18) {
                    petState.vx = 0;
                    petState.vy = 0;
                    setRandomIdleDirection();
                }
            } else {
                petState.idleTimer -= delta;
                if (petState.idleTimer <= 0) {
                    setRandomIdleDirection();
                }

                petState.vx *= 0.96;
                petState.vy *= 0.96;
                if (Math.hypot(petState.vx, petState.vy) < 0.35) {
                    setRandomIdleDirection();
                }

                if (timestamp > petState.nextIdleSpeechAt) {
                    const text = idlePhrases[Math.floor(Math.random() * idlePhrases.length)];
                    say(text, 1400);
                    petState.nextIdleSpeechAt = timestamp + randomRange(2800, 5200);
                }
            }

            petState.x += petState.vx * delta;
            petState.y += petState.vy * delta;
            setPetPosition();
            requestAnimationFrame(animate);
        }

        pet.addEventListener('click', function() {
            petState.running = true;
            petState.runUntil = performance.now() + 10000;
            pet.classList.add('running');
            petState.nextMeowAt = performance.now() + 200;
            const angle = Math.random() * Math.PI * 2;
            const speed = randomRange(8, 12);
            petState.vx = Math.cos(angle) * speed;
            petState.vy = Math.sin(angle) * speed;
            say('喵喵喵！', 900);
        });

        setRandomIdleDirection();
        setPetPosition();
        petState.nextIdleSpeechAt = performance.now() + 1500;
        petWrap.style.opacity = '1';
        requestAnimationFrame(animate);

        window.addEventListener('resize', setPetPosition);
        window.addEventListener('scroll', function() {
            if (!petState.running && isPetOutsideViewport()) {
                petState.nextReturnSpeechAt = performance.now();
            }
        }, { passive: true });
    </script>
</body>
</html>
