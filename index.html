<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫球小站</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            position: relative;
            min-height: 100vh;
        }

        header {
            position: relative;
            z-index: 10000;                 /* 让猫窝盖住桌宠 */
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 18px 8px;
        }

        .header-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 3vw, 2.7rem);
        }

        .cat-bed {
            position: relative;
            z-index: 10000;
            width: 72px;
            height: 52px;
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,.12));
        }

        .cat-bed__roof {
            position: absolute;
            left: 10px;
            top: 0;
            width: 52px;
            height: 22px;
            background: #cfc9bb;
            border-radius: 12px 12px 8px 8px;
            border: 2px solid rgba(90, 72, 45, 0.45);
            box-sizing: border-box;
        }

        .cat-bed__body {
            position: absolute;
            left: 8px;
            bottom: 8px;
            width: 56px;
            height: 26px;
            background: linear-gradient(#f1d7a0, #d4b57d);
            border: 2px solid rgba(90, 72, 45, 0.45);
            border-radius: 14px 14px 12px 12px;
            box-sizing: border-box;
        }

        .cat-bed__door {
            position: absolute;
            left: 28px;
            bottom: 12px;
            width: 16px;
            height: 18px;
            border-radius: 6px;
            background: rgba(120, 82, 28, 0.25);
            border: 2px solid rgba(90, 72, 45, 0.45);
            box-sizing: border-box;
        }

        .cat-bed__shadow {
            position: absolute;
            left: 10px;
            bottom: 0;
            width: 52px;
            height: 9px;
            background: rgba(90, 72, 45, 0.14);
            border-radius: 50%;
        }

        /* —— 关键改造：固定定位 + 容器不挡点击 —— */
        .pet-wrap {
            position: fixed;
            left: 0;
            top: 0;
            width: 94px;
            height: 94px;
            z-index: 9999;
            user-select: none;
            pointer-events: none;              /* 容器不挡页面元素 */
            opacity: 0;
            transform: translate3d(32px, 140px, 0);
            will-change: transform;
            transition: opacity 0.2s ease;
        }

        .pet {
            position: absolute;
            left: 12px;
            top: 12px;
            width: 72px;
            height: 72px;
            cursor: pointer;
            pointer-events: auto;              /* 仅猫本体可点 */
            background: url('images/catball.png') center/contain no-repeat;
            image-rendering: auto;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.18));
            transition: transform 0.15s ease, filter 0.15s ease;
            will-change: transform;
        }

        .pet:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.22));
        }

        .pet.running {
            transform: scale(1.12);
            filter: drop-shadow(0 8px 16px rgba(255, 120, 120, 0.35));
        }

        .pet-speech {
            position: absolute;
            left: 72px;
            top: 8px;
            max-width: 180px;
            padding: 7px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            color: #333;
            font-size: 13px;
            line-height: 1.3;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }

        .pet-speech::before {
            content: "";
            position: absolute;
            left: -8px;
            top: 12px;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.96);
            border-left: 1px solid rgba(0, 0, 0, 0.08);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            transform: rotate(45deg);
        }

        .pet-speech.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .pet-question {
            position: absolute;
            left: 88px;
            top: 4px;
            padding: 10px 12px;
            width: min(250px, calc(100vw - 60px));
            background: rgba(255,255,255,0.95);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 12px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.12);
            font-size: 13px;
            color: #333;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            z-index: 10;
        }

        .pet-question.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .pet-question strong {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #6d3a00;
        }

        .pet-question form {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            pointer-events: auto;
        }

        .pet-question #mathPrompt {
            display: inline-block;
            font-weight: 600;
            line-height: 1.5;
        }

        .pet-question input {
            width: 76px;
            padding: 6px 7px;
            border: 1px solid #d3d3d3;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .pet-question button {
            padding: 6px 8px;
            border: none;
            border-radius: 8px;
            background: #ffbf66;
            color: #3a2200;
            font-weight: 700;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            header {
                flex-wrap: wrap;
            }

            .pet-speech {
                left: 64px;
                max-width: 140px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title-wrap">
            <h1>猫球小站</h1>
        </div>

        <button id="catBed" class="cat-bed" type="button" aria-label="猫窝">
            <span class="cat-bed__roof"></span>
            <span class="cat-bed__body"></span>
            <span class="cat-bed__door"></span>
            <span class="cat-bed__shadow"></span>
        </button>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="搜索帖子标题或内容..." disabled>
        <p id="searchTip"></p>
    </div>

    <div class="post-card foldable-game">
        <div class="fold-header" id="foldToggle">
            <span>🎮 游戏中心</span>
            <span class="fold-arrow">▼</span>
        </div>
        <div class="fold-content" id="foldContent">
            <div class="game-item">
                <h4>🦖 小恐龙</h4>
                <p class="game-tip">按 <kbd>空格</kbd> 跳跃，<kbd>↓</kbd> 下蹲</p>
                <div class="game-viewport">
                    <iframe
                        src="https://chromedino.com/embed/"
                        frameborder="0"
                        scrolling="no"
                        class="game-iframe"
                        title="Chrome小恐龙游戏">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <main id="postList">加载中...</main>

    <div id="petWrap" class="pet-wrap" aria-label="桌宠" title="点击让我乱跑 10 秒">
        <div id="pet" class="pet"></div>
        <div id="petSpeech" class="pet-speech" aria-live="polite"></div>
        <div id="petQuestion" class="pet-question" aria-live="polite">
            <strong id="mathTitle">数学题</strong>
            <form id="mathForm">
                <span id="mathPrompt">5 + 3 = ?</span>
                <input id="mathAnswer" type="number" inputmode="numeric" aria-label="答案">
                <button type="submit">提交</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js"></script>
    <script>
    /* =========================================================
       一、文章加载 / 渲染 / 搜索
       ========================================================= */
    let allPosts = [];
    let dataLoaded = false;

    function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    fetch('posts.json')
        .then(res => res.json())
        .then(data => {
            allPosts = Array.isArray(data.posts) ? data.posts : [];
            dataLoaded = true;
            renderPosts(allPosts);
            searchInput.disabled = false;
        })
        .catch(err => {
            document.getElementById('postList').innerHTML =
                '<p class="error">加载失败，请检查 posts.json 语法是否正确</p>';
            console.error(err);
        });

    function renderPosts(posts) {
        const container = document.getElementById('postList');
        if (!posts.length) {
            container.innerHTML = '<p>没有找到相关帖子</p>';
            return;
        }
        container.innerHTML = posts.map(post => `
            <article class="post-card">
                <h2><a href="post.html?id=${encodeURIComponent(post.id)}">${esc(post.title)}</a></h2>
                <div class="post-meta">${esc(post.date)} · 作者：${esc(post.author)}</div>
                <p class="post-summary">${esc(post.summary)}</p>
            </article>
        `).join('');
    }

    const searchInput = document.getElementById('searchInput');
    const searchTip   = document.getElementById('searchTip');

    searchInput.addEventListener('input', function () {
        if (!dataLoaded) return;
        const keyword = this.value.trim().toLowerCase();
        if (!keyword) {
            searchTip.textContent = '';
            renderPosts(allPosts);
            return;
        }
        const filtered = allPosts.filter(post =>
            (post.title   || '').toLowerCase().includes(keyword) ||
            (post.summary || '').toLowerCase().includes(keyword) ||
            (post.content || '').toLowerCase().includes(keyword)
        );
        renderPosts(filtered);
        searchTip.textContent = `找到 ${filtered.length} 篇相关帖子`;
    });

    /* =========================================================
       二、折叠面板
       ========================================================= */
    const foldToggle  = document.getElementById('foldToggle');
    const foldContent = document.getElementById('foldContent');
    const foldArrow   = foldToggle.querySelector('.fold-arrow');

    foldToggle.addEventListener('click', () => {
        const isOpen = foldContent.classList.toggle('open');
        foldArrow.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
    });

    /* =========================================================
       三、桌宠系统
       ========================================================= */
    const petWrap     = document.getElementById('petWrap');
    const pet         = document.getElementById('pet');
    const petSpeech   = document.getElementById('petSpeech');
    const petQuestion = document.getElementById('petQuestion');
    const mathTitle   = document.getElementById('mathTitle');
    const mathPrompt  = document.getElementById('mathPrompt');
    const mathAnswer  = document.getElementById('mathAnswer');
    const mathForm    = document.getElementById('mathForm');
    const catBed      = document.getElementById('catBed');

    let speechTimer    = null;
    let sleepHideTimer = null;
    let bubbleKey      = '';

    const idlePhrases    = ['喵~', '喵呜~', '欢迎！', '我是猫球。', '哈哈，快来陪我玩！'];
    const correctPhrases = ['真聪明！', '对啦！', '真棒！', '哈哈哈！'];
    const wrongPhrases   = ['不对哦...', '这都能错？？！', '好好练去吧~', '下次再来试试...'];

    const STEP      = 16.67;
    const MAX_DELTA = 3;

    const petState = {
        mode: 'roaming',
        x: 32,
        y: 140,
        vx: 1,
        vy: 0.6,
        running: false,
        questionOpen: false,
        answerDeadline: 0,
        runUntil: 0,
        idleTimer: 0,
        nextQuestionAt: 0,
        nextIdleSpeechAt: 0,
        nextMeowAt: 0,
        lastInteraction: performance.now(),
        lastTime: 0,
        bedX: 0,
        bedY: 0,
        bedVisible: true
    };

    /* ---------- 通用工具 ---------- */
    function randomRange(min, max) {
        return Math.random() * (max - min) + min;
    }
    function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
    }

    function say(text, duration = 1400) {
        petSpeech.textContent = text;
        petSpeech.classList.add('visible');
        clearTimeout(speechTimer);
        speechTimer = setTimeout(() => {
            petSpeech.classList.remove('visible');
        }, duration);
    }

    function setPetVisible(visible) {
        petWrap.style.opacity = visible ? '1' : '0';
        pet.style.pointerEvents = visible ? 'auto' : 'none';
        if (!visible) petQuestion.classList.remove('visible');
    }

    /* ---------- 猫窝位置（视口坐标） ---------- */
    function updateBedPosition() {
        const r = catBed.getBoundingClientRect();
        const visible = r.bottom > 0 && r.top < window.innerHeight &&
                        r.right > 0 && r.left < window.innerWidth;
        petState.bedVisible = visible;
        if (visible) {
            petState.bedX = r.left + 12;
            petState.bedY = r.top + 18;
        }
    }

    /* ---------- 气泡定位（带缓存，避免每帧写样式） ---------- */
    function positionQuestionBubble() {
        if (!petState.questionOpen) return;
        const key = `${Math.round(petState.x)},${Math.round(petState.y)},${window.innerWidth}`;
        if (key === bubbleKey) return;
        bubbleKey = key;

        const bubbleW   = Math.min(250, window.innerWidth - 60);
        const spaceRight = window.innerWidth - (petState.x + 94) - 12;
        const left  = spaceRight >= 200 ? 88 : -(Math.min(bubbleW, 190) + 14);
        const top   = petState.y < 130 ? 74 : -14;

        petQuestion.style.left     = left + 'px';
        petQuestion.style.top      = top + 'px';
        petQuestion.style.maxWidth = bubbleW + 'px';
    }

    /* ---------- 答题 ---------- */
    function hideQuestion() {
        petQuestion.classList.remove('visible');
        petState.questionOpen = false;
        petState.answerDeadline = 0;
        mathAnswer.value = '';
        mathAnswer.dataset.answer = '';
        bubbleKey = '';
    }

    function generateMathQuestion() {
        const a  = randomInt(1, 99);
        const b  = randomInt(1, 99);
        const ops = ['+', '-', '*', '÷'];
        const op  = ops[randomInt(0, ops.length - 1)];

        let expr = '', answer = 0;

        if (op === '+') {
            expr = `${a} + ${b}`;
            answer = a + b;
        } else if (op === '-') {
            const left  = Math.max(a, b);
            const right = Math.min(a, b);
            expr = `${left} - ${right}`;
            answer = left - right;
        } else if (op === '*') {
            expr = `${a} × ${b}`;
            answer = a * b;
        } else {
            const divisor  = randomInt(2, 9);
            const quotient = randomInt(1, 9);
            expr = `${divisor * quotient} ÷ ${divisor}`;
            answer = quotient;
        }

        mathTitle.textContent  = '数学题';
        mathPrompt.textContent = `${expr} = ?`;
        mathAnswer.dataset.answer = String(answer);
        mathAnswer.value = '';
        petQuestion.classList.add('visible');
        petState.questionOpen  = true;
        petState.answerDeadline = performance.now() + 20000;
        positionQuestionBubble();
        if (document.activeElement === document.body) {
            setTimeout(() => mathAnswer.focus({ preventScroll: true }), 30);
        }
    }

    function handleCorrectAnswer() {
        hideQuestion();
        petState.lastInteraction = performance.now();
        petState.running  = true;
        petState.runUntil = performance.now() + 3000;
        pet.classList.add('running');
        const angle = Math.random() * Math.PI * 2;
        const speed = randomRange(8, 12);
        petState.vx = Math.cos(angle) * speed;
        petState.vy = Math.sin(angle) * speed;
        say(correctPhrases[Math.floor(Math.random() * correctPhrases.length)], 1600);
        petState.mode = 'roaming';
        petState.nextIdleSpeechAt = performance.now() + 3000;
    }

    function handleWrongAnswer() {
        petState.lastInteraction = performance.now();
        say(wrongPhrases[Math.floor(Math.random() * wrongPhrases.length)], 1700);
        mathAnswer.value = '';
        mathAnswer.focus({ preventScroll: true });
    }

    mathForm.addEventListener('submit', e => {
        e.preventDefault();
        if (!petState.questionOpen) return;

        const raw = mathAnswer.value.trim();
        if (raw === '') {                                 // 空值拦截
            mathAnswer.focus({ preventScroll: true });
            return;
        }
        const answer   = Number(raw);
        const expected = Number(mathAnswer.dataset.answer);
        if (!Number.isFinite(answer)) return;

        answer === expected ? handleCorrectAnswer() : handleWrongAnswer();
    });

    /* ---------- 状态切换 ---------- */
    function setRandomIdleDirection() {
        const angle = Math.random() * Math.PI * 2;
        const speed = randomRange(0.45, 1.1);
        petState.vx = Math.cos(angle) * speed;
        petState.vy = Math.sin(angle) * speed;
        petState.idleTimer = randomRange(60, 170);
    }

    function enterRoaming() {
        petState.mode = 'roaming';
        petState.questionOpen = false;
        petQuestion.classList.remove('visible');
        setPetVisible(true);
        setRandomIdleDirection();
        petState.nextIdleSpeechAt = performance.now() + randomRange(2200, 4000);
        petState.nextQuestionAt   = performance.now() + randomRange(10000, 30000);
    }

    function enterResting() {
        petState.mode = 'resting';
        petState.running = false;
        petState.questionOpen = false;
        petQuestion.classList.remove('visible');
        setPetVisible(true);
        petState.x = clamp(petState.bedX + 18, 8, window.innerWidth  - petWrap.offsetWidth  - 8);
        petState.y = clamp(petState.bedY + 8,  8, window.innerHeight - petWrap.offsetHeight - 8);
        petState.vx = petState.vy = 0;
        petState.nextQuestionAt = performance.now() + randomRange(10000, 30000);
        say('你好！', 1000);
    }

    function enterSleeping() {
        petState.mode = 'sleeping';
        petState.running = false;
        pet.classList.remove('running');
        hideQuestion();
        petState.vx = petState.vy = 0;
        petState.x = clamp(petState.bedX, 8, window.innerWidth  - petWrap.offsetWidth  - 8);
        petState.y = clamp(petState.bedY, 8, window.innerHeight - petWrap.offsetHeight - 8);
        setPetPosition();

        // 先说话，再隐藏（修复原代码中气泡永远看不到的问题）
        say('你不理我那我先回去了，好困呀，回窝窝', 1200);
        clearTimeout(sleepHideTimer);
        sleepHideTimer = setTimeout(() => {
            if (petState.mode === 'sleeping') setPetVisible(false);
        }, 1300);
    }

    function wakeFromSleep() {
        clearTimeout(sleepHideTimer);
        sleepHideTimer = null;
        petState.mode = 'roaming';
        hideQuestion();
        setPetVisible(true);
        petState.lastInteraction = performance.now();
        petState.x = clamp(petState.bedX + 18, 8, window.innerWidth  - petWrap.offsetWidth  - 8);
        petState.y = clamp(petState.bedY + 14, 8, window.innerHeight - petWrap.offsetHeight - 8);
        setRandomIdleDirection();
        petState.nextIdleSpeechAt = performance.now() + randomRange(2200, 4200);

        const h = new Date().getHours();
        const text = h < 6 ? '睡了个好觉~' : h < 12 ? '早上好' : h < 18 ? '叫我啥事？' : '你好！';
        say(text, 1400);
    }

    /* ---------- 位置更新（视口坐标 + 边界反弹） ---------- */
    function setPetPosition() {
        const maxX = Math.max(8, window.innerWidth  - petWrap.offsetWidth  - 8);
        const maxY = Math.max(8, window.innerHeight - petWrap.offsetHeight - 8);

        if (petState.x < 8)    { petState.x = 8;    petState.vx =  Math.abs(petState.vx) * 0.8; }
        if (petState.x > maxX) { petState.x = maxX; petState.vx = -Math.abs(petState.vx) * 0.8; }
        if (petState.y < 8)    { petState.y = 8;    petState.vy =  Math.abs(petState.vy) * 0.8; }
        if (petState.y > maxY) { petState.y = maxY; petState.vy = -Math.abs(petState.vy) * 0.8; }

        petWrap.style.transform = `translate3d(${petState.x}px, ${petState.y}px, 0)`;
    }

    /* ---------- 主循环 ---------- */
    function animate(timestamp) {
        if (!petState.lastTime) petState.lastTime = timestamp;
        const delta = Math.min((timestamp - petState.lastTime) / STEP, MAX_DELTA);
        petState.lastTime = timestamp;
        const now = performance.now();

        if (petState.mode === 'sleeping') {          // 休眠时不跑物理
            requestAnimationFrame(animate);
            return;
        }

        /* 奔跑状态 */
        if (petState.running) {
            if (now > petState.runUntil) {
                petState.running = false;
                pet.classList.remove('running');
                if (petState.mode === 'roaming') setRandomIdleDirection();
            } else {
                if (now > petState.nextMeowAt) {
                    say('喵喵~', 700);
                    petState.nextMeowAt = now + 550;
                }
                petState.vx += randomRange(-2.5, 2.5) * delta;
                petState.vy += randomRange(-2.5, 2.5) * delta;
                const len = Math.hypot(petState.vx, petState.vy) || 1;
                if (len > 11.5) {
                    petState.vx = petState.vx / len * 11.5;
                    petState.vy = petState.vy / len * 11.5;
                }
            }
        }

        /* 状态机 */
        if (petState.mode === 'resting') {
            petState.x = clamp(petState.bedX + 18, 8, window.innerWidth  - petWrap.offsetWidth  - 8);
            petState.y = clamp(petState.bedY + 8,  8, window.innerHeight - petWrap.offsetHeight - 8);
            petState.vx = petState.vy = 0;

            if (now > petState.nextQuestionAt) {
                generateMathQuestion();
                petState.nextQuestionAt = now + randomRange(15000, 30000);
            }
            if (now - petState.lastInteraction > 45000) enterSleeping();
        } else if (petState.mode === 'roaming') {
            petState.idleTimer -= delta;
            if (petState.idleTimer <= 0) setRandomIdleDirection();

            petState.vx *= 0.96;
            petState.vy *= 0.96;
            if (Math.hypot(petState.vx, petState.vy) < 0.35) setRandomIdleDirection();

            if (now > petState.nextIdleSpeechAt) {
                say(idlePhrases[Math.floor(Math.random() * idlePhrases.length)], 1400);
                petState.nextIdleSpeechAt = now + randomRange(2800, 5200);
            }
            if (now - petState.lastInteraction > 25000) enterResting();
        }

        /* 答题超时（统一处理，不再局限于 resting） */
        if (petState.questionOpen && now > petState.answerDeadline) {
            hideQuestion();
            say('时间到啦~', 1200);
        }

        petState.x += petState.vx * delta;
        petState.y += petState.vy * delta;
        setPetPosition();
        if (petState.questionOpen) positionQuestionBubble();
        requestAnimationFrame(animate);
    }

    /* ---------- 交互事件 ---------- */
    pet.addEventListener('click', () => {
        petState.lastInteraction = performance.now();

        if (petState.mode === 'sleeping') {
            wakeFromSleep();
            return;
        }

        petState.running  = true;
        petState.mode     = 'roaming';
        petState.runUntil = performance.now() + 10000;
        pet.classList.add('running');
        petState.nextMeowAt = performance.now() + 200;
        const angle = Math.random() * Math.PI * 2;
        const speed = randomRange(8, 12);
        petState.vx = Math.cos(angle) * speed;
        petState.vy = Math.sin(angle) * speed;
        say('喵喵喵！', 900);
    });

    catBed.addEventListener('click', () => {
        petState.lastInteraction = performance.now();

        if (petState.mode === 'sleeping') {
            wakeFromSleep();
            return;
        }

        petState.mode = 'resting';
        petState.running = false;
        hideQuestion();
        petState.x = clamp(petState.bedX + 18, 8, window.innerWidth  - petWrap.offsetWidth  - 8);
        petState.y = clamp(petState.bedY + 8,  8, window.innerHeight - petWrap.offsetHeight - 8);
        setPetVisible(true);
        pet.classList.remove('running');
        say('叫我啥事？', 1000);
        petState.nextQuestionAt = performance.now() + randomRange(10000, 30000);
    });

    catBed.addEventListener('pointerenter', () => {
        if (petState.mode === 'sleeping') {
            say('点我一下叫醒猫球~', 1200);
        } else if (!petState.questionOpen) {
            say('叫我啥事？', 900);
        }
    });

    /* ---------- 视口事件 ---------- */
    window.addEventListener('scroll', () => {
        updateBedPosition();
        // 猫窝滚出视野时，休息中的猫球应恢复漫游
        if (petState.mode === 'resting' && !petState.bedVisible) {
            enterRoaming();
        }
    }, { passive: true });

    window.addEventListener('resize', () => {
        updateBedPosition();
        if (petState.mode === 'resting' && petState.bedVisible) {
            petState.x = clamp(petState.bedX + 18, 8, window.innerWidth  - petWrap.offsetWidth  - 8);
            petState.y = clamp(petState.bedY + 8,  8, window.innerHeight - petWrap.offsetHeight - 8);
        }
        setPetPosition();
        positionQuestionBubble();
    });

    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) petState.lastTime = 0;   // 切回前台重置时间基准
    });

    /* ---------- 启动 ---------- */
    window.addEventListener('load', () => {
        updateBedPosition();
        setPetPosition();
    });

    updateBedPosition();
    setRandomIdleDirection();
    petState.nextIdleSpeechAt = performance.now() + 1500;
    petState.nextQuestionAt   = performance.now() + randomRange(10000, 30000);
    setPetPosition();
    setPetVisible(true);
    requestAnimationFrame(animate);
    </script>
</body>
</html>
