<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫球小站</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            position: relative;
            min-height: 100vh;
            /* 防止气泡/桌宠瞬时溢出时撑大页面产生横向滚动条，导致卡片被压缩 */
            overflow-x: hidden;
        }

        html {
            overflow-x: hidden;
        }

        .pet-wrap {
            position: absolute;
            left: 0;
            top: 0;
            width: 94px;
            height: 94px;
            z-index: 9999;
            user-select: none;
            pointer-events: auto;
            opacity: 0;
            transform: translate3d(32px, 140px, 0);
            will-change: transform;
            transition: opacity 0.2s ease;
        }

        .pet {
            position: absolute;
            left: 12px;
            top: 12px;
            width: 72px;
            height: 72px;
            cursor: pointer;
            background: url('images/catball.png') center/contain no-repeat;
            image-rendering: auto;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.18));
            transition: transform 0.15s ease, filter 0.15s ease;
            will-change: transform;
        }

        .pet:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.22));
        }

        .pet.running {
            transform: scale(1.12);
            filter: drop-shadow(0 8px 16px rgba(255, 120, 120, 0.35));
        }

        .pet-speech {
            position: absolute;
            left: 72px;
            top: 8px;
            max-width: 180px;
            padding: 7px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            color: #333;
            font-size: 13px;
            line-height: 1.3;
            white-space: normal;      /* 允许换行，避免超长文字无限撑宽 */
            word-break: break-word;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }

        .pet-speech::before {
            content: "";
            position: absolute;
            left: -8px;
            top: 12px;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.96);
            border-left: 1px solid rgba(0, 0, 0, 0.08);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            transform: rotate(45deg);
        }

        /* 翻转：气泡显示在猫球左侧，避免右侧溢出 */
        .pet-speech.flip {
            left: auto;
            right: 70px;
        }

        .pet-speech.flip::before {
            left: auto;
            right: -8px;
            border-left: none;
            border-bottom: none;
            border-right: 1px solid rgba(0, 0, 0, 0.08);
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }

        .pet-speech.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ---------- 标题 + 小黑板 ---------- */
        .header-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            vertical-align: middle;
            flex-wrap: wrap;
        }

        .blackboard {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch;
            width: 190px;
            min-height: 92px;
            padding: 6px 9px;
            background:
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.06) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.05) 0%, transparent 40%),
                linear-gradient(135deg, #2c4a3a, #1e3628);
            border: 4px solid #8a6a3f;
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.22), inset 0 0 26px rgba(0, 0, 0, 0.3);
            color: #e8f2eb;
            font-family: 'Comic Sans MS', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.15s ease;
        }

        .blackboard.shake {
            animation: bb-shake 0.3s ease;
        }

        @keyframes bb-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px) rotate(-0.5deg); }
            75% { transform: translateX(3px) rotate(0.5deg); }
        }

        .bb-idle {
            text-align: center;
            line-height: 1.4;
        }

        .bb-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .bb-hint {
            font-size: 10px;
            color: #b8d4c4;
        }

        .bb-question {
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 4px rgba(220, 255, 230, 0.3);
            white-space: nowrap;
        }

        .bb-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            width: 100%;
        }

        .bb-option {
            padding: 3px 4px;
            border: 1px solid rgba(230, 245, 235, 0.7);
            background: rgba(255, 255, 255, 0.08);
            color: #e8f2eb;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s ease, transform 0.1s ease;
            line-height: 1.2;
        }

        .bb-option:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .bb-option:active {
            transform: scale(0.96);
        }

        .bb-option.correct {
            background: rgba(120, 220, 130, 0.35);
            border-color: #7ed684;
            color: #eaffee;
        }

        .bb-option.wrong {
            background: rgba(230, 100, 100, 0.35);
            border-color: #e67878;
            color: #fff1f1;
        }

        .bb-progress {
            margin-top: 5px;
            font-size: 9px;
            color: #b8d4c4;
            letter-spacing: 0.3px;
            text-align: center;
            line-height: 1.3;
        }

        @media (max-width: 700px) {
            .header-brand {
                display: flex;
                width: 100%;
            }
            .blackboard {
                width: 100%;
            }
        }

        /* ---------- 猫粮状态栏 ---------- */
        .pet-food-bar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 14px;
            margin: 8px 18px;
            padding: 8px 14px;
            background: linear-gradient(135deg, #fff8ec, #ffe9cc);
            border: 1px solid rgba(210, 160, 90, 0.35);
            border-radius: 12px;
            font-size: 14px;
            color: #6d3a00;
            box-shadow: 0 2px 8px rgba(180, 120, 40, 0.08);
        }

        .pet-food-info {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .pet-food-info strong {
            font-size: 1.15em;
            color: #d47700;
            transition: color 0.25s ease, transform 0.25s ease;
            display: inline-block;
            min-width: 1em;
            text-align: center;
        }

        .pet-food-info strong.flash {
            color: #ff8800;
            transform: scale(1.35);
        }

        .pet-food-status {
            color: #a06b28;
            font-size: 13px;
        }

        .pet-food-status.fed {
            color: #2f8a2f;
            font-weight: 600;
        }

        .pet-food-btn {
            margin-left: auto;
            padding: 6px 16px;
            border: none;
            border-radius: 8px;
            background: #ffbf66;
            color: #3a2200;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .pet-food-btn:hover:not(:disabled) {
            background: #ffb144;
        }

        .pet-food-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .pet-food-btn:disabled {
            background: #e8dccb;
            color: #a08b70;
            cursor: not-allowed;
        }

        /* 猫粮槽位 */
        .food-slot {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: 2px dashed rgba(210, 160, 90, 0.55);
            background: rgba(255, 255, 255, 0.55);
            flex: 0 0 auto;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .food-slot.empty {
            border-color: rgba(190, 190, 190, 0.5);
            background: rgba(250, 250, 250, 0.4);
        }

        .food-slot.empty::after {
            content: "空";
            font-size: 12px;
            color: #b8a888;
            letter-spacing: 1px;
        }

        .food-slot.empty .draggable-food {
            display: none;
        }

        .food-slot.locked .draggable-food {
            cursor: not-allowed;
            filter: grayscale(0.4);
            opacity: 0.65;
        }

        .draggable-food {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffe0b0, #ffbf66 55%, #e8963f);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            line-height: 1;
            cursor: grab;
            user-select: none;
            touch-action: none;
            box-shadow: 0 2px 6px rgba(180, 120, 40, 0.35);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .draggable-food:hover {
            transform: scale(1.1);
        }

        .draggable-food.dragging {
            cursor: grabbing;
            transform: scale(1.15);
            box-shadow: 0 6px 14px rgba(180, 120, 40, 0.5);
        }

        .draggable-food.floating {
            position: absolute;
            z-index: 10000;
            margin: 0;
            transition: none;
            box-shadow: 0 8px 18px rgba(180, 120, 40, 0.5);
        }

        .draggable-food.caught {
            cursor: default;
            z-index: 9998;
            box-shadow: 0 0 0 3px rgba(255, 150, 100, 0.45), 0 2px 6px rgba(180, 120, 40, 0.35);
        }

        .draggable-food.gone {
            transform: scale(0.1);
            opacity: 0;
            transition: transform 0.45s ease, opacity 0.45s ease;
        }

        @media (max-width: 500px) {
            .pet-food-btn {
                margin-left: 0;
                width: 100%;
            }
        }

        /* ---------- 每日运势 ---------- */
        .daily-fortune-card {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px 18px;
            margin: 8px 18px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #fffdf7, #eef4ff);
            border: 1px solid rgba(150, 160, 200, 0.28);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(90, 110, 180, 0.08);
        }

        .fortune-level {
            flex: 0 0 auto;
            min-width: 86px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: 2px;
            text-align: center;
            white-space: nowrap;
            border: 2px solid transparent;
        }

        .fortune-level.lv-daji      { color: #d4380d; background: #fff3e8; border-color: #ffb08a; }
        .fortune-level.lv-zhongji   { color: #d46b08; background: #fff8e6; border-color: #ffd591; }
        .fortune-level.lv-xiaoji    { color: #ad8b00; background: #fffbe6; border-color: #ffe58f; }
        .fortune-level.lv-ping      { color: #4a5568; background: #f7f9fc; border-color: #cbd5e0; }
        .fortune-level.lv-xiaoxiong { color: #3c7a89; background: #eff9fb; border-color: #a8d8e2; }
        .fortune-level.lv-xiong     { color: #4a5568; background: #f0f2f5; border-color: #b8c0cc; }
        .fortune-level.lv-daxiong   { color: #2d3748; background: #e8eaee; border-color: #9aa3b0; }
        .fortune-level.lv-mystery   { color: #8e44ad; background: #f8f2ff; border-color: #d3b3ef; letter-spacing: 0; }
        .fortune-level.lv-pending   { color: #9aa3b0; background: #f5f7fa; border-color: #d5dbe4; }

        .fortune-main {
            flex: 1 1 200px;
            min-width: 0;
        }

        .fortune-head {
            font-size: 13px;
            color: #8a94a6;
            margin-bottom: 6px;
        }

        .fortune-date {
            margin-left: 8px;
            color: #b0b8c6;
            font-variant-numeric: tabular-nums;
        }

        .fortune-streak {
            margin-left: 10px;
            color: #e07a2f;
            font-weight: 600;
        }

        .fortune-sign-btn {
            margin-left: auto;
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            background: #8fb0ff;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .fortune-sign-btn:hover { background: #6f97ff; }
        .fortune-sign-btn:active { transform: scale(0.96); }

        @media (max-width: 500px) {
            .daily-fortune-card { gap: 10px; }
            .fortune-level { min-width: 72px; font-size: 20px; padding: 8px 10px; }
            .fortune-sign-btn { margin-left: 0; width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-brand">
            <h1>猫球小站</h1>
            <div class="blackboard" id="blackboard" role="button" aria-label="小黑板" title="敲我 3 下召唤猫球">
                <div class="bb-idle" id="bbIdle">
                    <div class="bb-title">📋 小黑板</div>
                    <div class="bb-hint">敲我 3 下召唤猫球</div>
                </div>
                <div class="bb-quiz" id="bbQuiz" style="display:none;">
                    <div class="bb-question" id="bbQuestion">—</div>
                    <div class="bb-options" id="bbOptions"></div>
                    <div class="bb-progress" id="bbProgress"></div>
                </div>
            </div>
        </div>
        <nav>
            <a href="index.html">首页</a>
            <a href="download.html">文件分享</a>
            <a href="rand.html">随机数抽取</a>
            <a href="calendar.html">日历与倒数日</a>
            <a href="clock.html">世界时间</a>
        </nav>
    </header>

    <div class="pet-food-bar">
        <span class="pet-food-info">🍖 猫粮：<strong id="foodCount">0</strong></span>
        <span class="pet-food-status" id="feedStatus">今天还没喂</span>
        <div class="food-slot" id="foodSlot">
            <div class="draggable-food" id="draggableFood" title="拖动我去喂猫">🍖</div>
        </div>
        <button class="pet-food-btn" id="feedBtn" type="button">喂猫 🐱</button>
    </div>

    <div class="daily-fortune-card" id="dailyFortune">
        <div class="fortune-level" id="fortuneLevel">…</div>
        <div class="fortune-main">
            <div class="fortune-head">
                🔮 今日运势<span class="fortune-date" id="fortuneDate"></span><span class="fortune-streak" id="fortuneStreak"></span>
            </div>
        </div>
        <button class="fortune-sign-btn" id="fortuneSignBtn" type="button">签到抽运势</button>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="搜索帖子标题或内容...">
        <p id="searchTip"></p>
    </div>

    <div class="post-card foldable-game">
        <div class="fold-header" id="foldToggle">
            <span>🎮 游戏中心</span>
            <span class="fold-arrow">▼</span>
        </div>
        <div class="fold-content" id="foldContent">
            <div class="game-item">
                <h4>🦖 小恐龙</h4>
                <p class="game-tip">按 <kbd>空格</kbd> 跳跃，<kbd>↓</kbd> 下蹲</p>
                <div class="game-viewport">
                    <iframe
                        src="https://chromedino.com/embed/"
                        frameborder="0"
                        scrolling="no"
                        class="game-iframe"
                        title="Chrome小恐龙游戏">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <main id="postList">加载中...</main>

    <div id="petWrap" class="pet-wrap" aria-label="桌宠" title="点击让我乱跑 10 秒">
        <div id="pet" class="pet"></div>
        <div id="petSpeech" class="pet-speech" aria-live="polite"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        /* =========================================================
           文章加载 / 渲染 / 搜索 / 折叠
           ========================================================= */
        let allPosts = [];

        fetch('posts.json')
            .then(res => res.json())
            .then(data => {
                allPosts = data.posts;
                renderPosts(allPosts);
            })
            .catch(err => {
                document.getElementById('postList').innerHTML = '<p class="error">加载失败，请检查 posts.json 语法是否正确</p>';
                console.error(err);
            });

        function renderPosts(posts) {
            const container = document.getElementById('postList');
            if (posts.length === 0) {
                container.innerHTML = '<p>没有找到相关帖子</p>';
                return;
            }
            let html = '';
            posts.forEach(post => {
                html += `
                <article class="post-card">
                    <h2><a href="post.html?id=${post.id}">${post.title}</a></h2>
                    <div class="post-meta">${post.date} · 作者：${post.author}</div>
                    <p class="post-summary">${post.summary}</p>
                </article>
                `;
            });
            container.innerHTML = html;
        }

        const searchInput = document.getElementById('searchInput');
        const searchTip = document.getElementById('searchTip');
        searchInput.addEventListener('input', function() {
            const keyword = this.value.trim().toLowerCase();
            if (!keyword) {
                searchTip.textContent = '';
                renderPosts(allPosts);
                return;
            }
            const filtered = allPosts.filter(post =>
                post.title.toLowerCase().includes(keyword) ||
                post.summary.toLowerCase().includes(keyword) ||
                post.content.toLowerCase().includes(keyword)
            );
            renderPosts(filtered);
            searchTip.textContent = `找到 ${filtered.length} 篇相关帖子`;
        });

        const foldToggle = document.getElementById('foldToggle');
        const foldContent = document.getElementById('foldContent');
        const foldArrow = foldToggle.querySelector('.fold-arrow');
        foldToggle.addEventListener('click', function() {
            const isOpen = foldContent.classList.toggle('open');
            foldArrow.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        /* =========================================================
           桌宠系统
           ========================================================= */
        const petWrap = document.getElementById('petWrap');
        const pet = document.getElementById('pet');
        const petSpeech = document.getElementById('petSpeech');
        let speechTimer = null;
        let flipClearTimer = null;

        const idlePhrases = ['喵~', '喵呜~', '欢迎！', '我是猫球。', '哈哈，快来陪我玩！'];
        const returnPhrases = ['等等我！', '不要抛弃我！', '我回来了，慢点！'];

        const petState = {
            x: 32,
            y: 140,
            vx: 1,
            vy: 0.6,
            running: false,
            runUntil: 0,
            idleTimer: 0,
            nextIdleSpeechAt: 0,
            nextMeowAt: 0,
            nextReturnSpeechAt: 0,
            lastTime: 0,
            chasingFood: false,
            eating: false,
            nextEatSpeechAt: 0,
            goingToBoard: false,
            atBoard: false,
            boardTargetX: 0,
            boardTargetY: 0
        };

        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        /* 说话气泡：自动判断是否需要翻转到左侧，避免右侧溢出压缩页面 */
        function say(text, duration = 1400) {
            // 重置 flip，测量默认状态下的气泡宽度
            petSpeech.classList.remove('flip');
            petSpeech.textContent = text;

            // 强制 reflow，获取最新宽度
            void petSpeech.offsetWidth;

            const petRect = petWrap.getBoundingClientRect();
            const bubbleWidth = petSpeech.offsetWidth || petSpeech.scrollWidth;

            // 默认位置：气泡左边缘在 petWrap 内 left:72px 处
            const normalRight = petRect.left + 72 + bubbleWidth;
            const viewportRight = window.innerWidth - 8;

            if (normalRight > viewportRight) {
                petSpeech.classList.add('flip');
            }

            petSpeech.classList.add('visible');

            clearTimeout(speechTimer);
            clearTimeout(flipClearTimer);

            speechTimer = setTimeout(() => {
                petSpeech.classList.remove('visible');
                // 等淡出后再清掉 flip，避免闪烁
                flipClearTimer = setTimeout(() => {
                    petSpeech.classList.remove('flip');
                }, 220);
            }, duration);
        }

        function setRandomIdleDirection() {
            const angle = Math.random() * Math.PI * 2;
            const speed = randomRange(0.5, 1.1);
            petState.vx = Math.cos(angle) * speed;
            petState.vy = Math.sin(angle) * speed;
            petState.idleTimer = randomRange(60, 170);
        }

        function setPetPosition() {
            const maxX = Math.max(8, document.body.scrollWidth - petWrap.offsetWidth - 8);
            const maxY = Math.max(8, document.body.scrollHeight - petWrap.offsetHeight - 8);
            petState.x = clamp(petState.x, 8, maxX);
            petState.y = clamp(petState.y, 8, maxY);
            petWrap.style.transform = `translate3d(${petState.x}px, ${petState.y}px, 0)`;
        }

        function isPetOutsideViewport() {
            const left = petState.x;
            const top = petState.y;
            const right = left + petWrap.offsetWidth;
            const bottom = top + petWrap.offsetHeight;

            return right < window.scrollX - 20 ||
                left > window.scrollX + window.innerWidth + 20 ||
                bottom < window.scrollY - 20 ||
                top > window.scrollY + window.innerHeight + 20;
        }

        function animate(timestamp) {
            if (!petState.lastTime) petState.lastTime = timestamp;
            const delta = (timestamp - petState.lastTime) / 16.67;
            petState.lastTime = timestamp;

            if (petState.goingToBoard) {
                const dx = petState.boardTargetX - petState.x;
                const dy = petState.boardTargetY - petState.y;
                const dist = Math.hypot(dx, dy) || 1;

                if (dist < 12) {
                    petState.x = petState.boardTargetX;
                    petState.y = petState.boardTargetY;
                    petState.vx = 0;
                    petState.vy = 0;
                    petState.goingToBoard = false;
                    petState.atBoard = true;
                    startBoardQuiz();
                } else {
                    const speed = 13;
                    petState.vx = (dx / dist) * speed;
                    petState.vy = (dy / dist) * speed;

                    if (timestamp > petState.nextMeowAt) {
                        say('喵~', 500);
                        petState.nextMeowAt = timestamp + 900;
                    }
                }
            } else if (petState.atBoard) {
                petState.vx = 0;
                petState.vy = 0;
            } else if (petState.chasingFood && foodDrag.active && !foodDrag.caught) {
                const fc = getFoodCenter();
                const pcx = petState.x + petWrap.offsetWidth / 2;
                const pcy = petState.y + petWrap.offsetHeight / 2;
                const dx = fc.x - pcx;
                const dy = fc.y - pcy;
                const dist = Math.hypot(dx, dy);

                if (dist < CATCH_DISTANCE) {
                    catchFood();
                } else {
                    const speed = 13;
                    petState.vx = (dx / dist) * speed;
                    petState.vy = (dy / dist) * speed;

                    if (timestamp > petState.nextMeowAt) {
                        say('喵喵~', 700);
                        petState.nextMeowAt = timestamp + 700;
                    }
                }
            } else if (petState.eating) {
                petState.vx = 0;
                petState.vy = 0;

                if (timestamp > petState.nextEatSpeechAt) {
                    say(EAT_PHRASES[Math.floor(Math.random() * EAT_PHRASES.length)], 520);
                    petState.nextEatSpeechAt = timestamp + 300 + Math.random() * 300;
                }
            } else if (petState.running) {
                if (timestamp > petState.runUntil) {
                    petState.running = false;
                    pet.classList.remove('running');
                    setRandomIdleDirection();
                } else {
                    if (timestamp > petState.nextMeowAt) {
                        say('喵喵~', 700);
                        petState.nextMeowAt = timestamp + 550;
                    }

                    petState.vx += randomRange(-2.4, 2.4) * delta;
                    petState.vy += randomRange(-2.4, 2.4) * delta;
                    const length = Math.hypot(petState.vx, petState.vy) || 1;
                    const maxSpeed = 11.5;
                    if (length > maxSpeed) {
                        petState.vx = (petState.vx / length) * maxSpeed;
                        petState.vy = (petState.vy / length) * maxSpeed;
                    }
                }
            } else if (isPetOutsideViewport()) {
                if (timestamp > petState.nextReturnSpeechAt) {
                    say(returnPhrases[Math.floor(Math.random() * returnPhrases.length)], 1500);
                    petState.nextReturnSpeechAt = timestamp + 2200;
                }

                const centerX = window.scrollX + window.innerWidth * 0.5;
                const centerY = window.scrollY + window.innerHeight * 0.5;
                const targetX = clamp(centerX - petWrap.offsetWidth / 2, 8, Math.max(8, document.body.scrollWidth - petWrap.offsetWidth - 8));
                const targetY = clamp(centerY - petWrap.offsetHeight / 2, 8, Math.max(8, document.body.scrollHeight - petWrap.offsetHeight - 8));
                const dx = targetX - petState.x;
                const dy = targetY - petState.y;
                const distance = Math.hypot(dx, dy) || 1;
                const speed = 13;
                petState.vx = (dx / distance) * speed;
                petState.vy = (dy / distance) * speed;

                if (distance < 18) {
                    petState.vx = 0;
                    petState.vy = 0;
                    setRandomIdleDirection();
                }
            } else {
                petState.idleTimer -= delta;
                if (petState.idleTimer <= 0) {
                    setRandomIdleDirection();
                }

                petState.vx *= 0.96;
                petState.vy *= 0.96;
                if (Math.hypot(petState.vx, petState.vy) < 0.35) {
                    setRandomIdleDirection();
                }

                if (timestamp > petState.nextIdleSpeechAt) {
                    const text = idlePhrases[Math.floor(Math.random() * idlePhrases.length)];
                    say(text, 1400);
                    petState.nextIdleSpeechAt = timestamp + randomRange(2800, 5200);
                }
            }

            petState.x += petState.vx * delta;
            petState.y += petState.vy * delta;
            setPetPosition();
            requestAnimationFrame(animate);
        }

            return `${y}-${m}-${day}`;

        function yesterdayStr() {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;

            const raw = safeGet(READ_POSTS_KEY);
            if (!raw) return { date: todayStr(), ids: [] };
            try {
                const data = JSON.parse(raw);
                if (data && data.date === todayStr() && Array.isArray(data.ids)) {
                    return data;
                }
            } catch (e) { /* 忽略 */ }
            return { date: todayStr(), ids: [] };
        }

        function markPostReadOnce(id) {
            const data = getReadPostsToday();
            if (data.ids.indexOf(id) >= 0) return false;
            data.ids.push(id);
            data.date = todayStr();
            safeSet(READ_POSTS_KEY, JSON.stringify(data));
            return true;

        const foodDrag = {
            active: false,
            dragging: false,

            pointerId: null,
            offsetX: 0,
            offsetY: 0,

            startY: 0,
            moved: false,
            x: 0,

        };

        function getFoodCenter() {
            return {

        function floatFood() {
            const rect = draggableFood.getBoundingClientRect();
            foodDrag.x = rect.left + window.scrollX;
            foodDrag.y = rect.top + window.scrollY;

            document.body.appendChild(draggableFood);

            draggableFood.style.left = foodDrag.x + 'px';
            draggableFood.style.top = foodDrag.y + 'px';

        function resetFoodToSlot() {
            draggableFood.classList.remove('floating', 'caught', 'dragging', 'gone');

            draggableFood.style.top = '';

            draggableFood.style.opacity = '';

            void draggableFood.offsetWidth;
            draggableFood.style.transition = '';

            foodDrag.active = false;
            foodDrag.dragging = false;
            foodDrag.caught = false;
            foodDrag.pointerId = null;
            foodDrag.moved = false;
            updateFoodUI();
        }

        function moveFoodTo(clientX, clientY) {
            foodDrag.x = clientX + window.scrollX - foodDrag.offsetX;
            foodDrag.y = clientY + window.scrollY - foodDrag.offsetY;

            const maxX = Math.max(0, document.documentElement.scrollWidth - FOOD_SIZE);
            const maxY = Math.max(0, document.documentElement.scrollHeight - FOOD_SIZE);
            foodDrag.x = clamp(foodDrag.x, 0, maxX);
            foodDrag.y = clamp(foodDrag.y, 0, maxY);

            draggableFood.style.left = foodDrag.x + 'px';
            draggableFood.style.top = foodDrag.y + 'px';
        }

        draggableFood.addEventListener('pointerdown', function(e) {
            if (foodDrag.caught) return;
            if (petState.eating) return;
            if (hasFedToday()) {
                say('今天已经吃过啦，明天再来~', 1800);
                return;
            }
            if (getFoodCount() < MIN_FOOD) {
                say(`猫粮不够，还差 ${MIN_FOOD - getFoodCount()} 个喵~`, 2200);
                return;
            }

            if (petState.atBoard || petState.goingToBoard) {
                leaveBoard();
            }

            e.preventDefault();

            const rect = draggableFood.getBoundingClientRect();
            foodDrag.offsetX = e.clientX - rect.left;
            foodDrag.offsetY = e.clientY - rect.top;
            foodDrag.startX = e.clientX;
            foodDrag.startY = e.clientY;
            foodDrag.pointerId = e.pointerId;
            foodDrag.dragging = true;
            foodDrag.moved = false;

            draggableFood.classList.add('dragging');

            if (!foodDrag.active) {
                floatFood();
            }
        });

        document.addEventListener('pointermove', function(e) {
            if (!foodDrag.dragging) return;
            if (e.pointerId !== foodDrag.pointerId) return;

            moveFoodTo(e.clientX, e.clientY);

            if (!foodDrag.moved) {
                const moved = Math.hypot(e.clientX - foodDrag.startX, e.clientY - foodDrag.startY);
                if (moved >= DRAG_START_THRESHOLD) {
                    foodDrag.moved = true;
                    petState.running = false;
                    pet.classList.remove('running');
                    petState.chasingFood = true;
                    petState.nextMeowAt = performance.now() + 200;
                    say('小鱼干！等我！', 1000);
                }
            }
        });

        function onGlobalPointerEnd(e) {
            if (!foodDrag.dragging) return;
            if (e.pointerId !== foodDrag.pointerId) return;
            endFoodDrag(e);
        }
        document.addEventListener('pointerup', onGlobalPointerEnd);
        document.addEventListener('pointercancel', onGlobalPointerEnd);

        function endFoodDrag(e) {
            foodDrag.dragging = false;
            draggableFood.classList.remove('dragging');
            foodDrag.pointerId = null;

            if (!foodDrag.caught && foodDrag.active) {
                const slotRect = foodSlotEl.getBoundingClientRect();
                const slotCx = slotRect.left + slotRect.width / 2;
                const slotCy = slotRect.top + slotRect.height / 2;
                const foodRect = draggableFood.getBoundingClientRect();
                const foodCx = foodRect.left + foodRect.width / 2;
                const foodCy = foodRect.top + foodRect.height / 2;
                const distToSlot = Math.hypot(foodCx - slotCx, foodCy - slotCy);

                if (distToSlot < 40) {
                    resetFoodToSlot();
                    petState.chasingFood = false;
                    setRandomIdleDirection();
                    return;
                }
            }
        }

        function catchFood() {
            if (!petState.chasingFood) return;

            foodDrag.dragging = false;
            foodDrag.pointerId = null;
            petState.chasingFood = false;

        /* =========================================================
           黑板答题系统
           ========================================================= */
        const blackboard   = document.getElementById('blackboard');
        const bbIdle       = document.getElementById('bbIdle');
        const bbQuiz       = document.getElementById('bbQuiz');
        const bbQuestion   = document.getElementById('bbQuestion');
        const bbOptions    = document.getElementById('bbOptions');
        const bbProgress   = document.getElementById('bbProgress');

        const BLACKBOARD_TAP_REQUIRED = 3;
        let blackboardTaps = 0;

        const quizState = {
            active: false,
            correctCount: 0,
            totalForReward: 5,
            locked: false,
            current: null
        };

        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateQuestion() {
            const types = ['+', '-', '×', '÷'];
            const type = types[Math.floor(Math.random() * types.length)];

            let a, b, answer, qText;

            if (type === '+') {
                a = randInt(10, 99);
                b = randInt(10, 99);
                answer = a + b;
                qText = `${a} + ${b} = ?`;
            } else if (type === '-') {
                a = randInt(10, 99);
                b = randInt(10, 99);
                if (a < b) { const t = a; a = b; b = t; }
                answer = a - b;
                qText = `${a} - ${b} = ?`;
            } else if (type === '×') {
                a = randInt(10, 99);
                b = randInt(2, 9);
                answer = a * b;
                qText = `${a} × ${b} = ?`;
            } else {
                b = randInt(2, 9);
                if (Math.floor(99 / b) < 10) b = 2;
                answer = randInt(10, Math.floor(99 / b));
                a = b * answer;
                qText = `${a} ÷ ${b} = ?`;
            }

            const opts = new Set([answer]);
            let guard = 0;
            while (opts.size < 4 && guard++ < 200) {
                const range = Math.max(3, Math.round(answer * 0.15));
                let delta = randInt(1, range);
                if (Math.random() < 0.5) delta = -delta;
                const v = answer + delta;
                if (v >= 0 && v !== answer) opts.add(v);
            }
            let pad = 1;
            while (opts.size < 4) {
                const v = answer + pad;
                if (v !== answer) opts.add(v);
                pad++;
                if (pad > 50) break;
            }

            const arr = Array.from(opts);
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const tmp = arr[i];
                arr[i] = arr[j];
                arr[j] = tmp;
            }

            return { qText: qText, answer: answer, options: arr };
        }

        function renderQuestion() {
            if (!quizState.active) return;

            const q = generateQuestion();
            quizState.current = q;
            quizState.locked = false;

            bbQuestion.textContent = q.qText;
            bbProgress.textContent = `答对 ${quizState.correctCount} / ${quizState.totalForReward}　（每答对5题奖励1猫粮）`;
            bbOptions.innerHTML = '';

            q.options.forEach(function(v) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'bb-option';
                btn.textContent = v;
                btn.addEventListener('click', function(ev) {
                    ev.stopPropagation();
                    handleAnswer(btn, v);
                });
                bbOptions.appendChild(btn);
            });
        }

        function handleAnswer(btn, value) {
            if (!quizState.active || quizState.locked) return;
            if (!quizState.current) return;

            if (value === quizState.current.answer) {
                quizState.locked = true;
                btn.classList.add('correct');
                quizState.correctCount++;
                bbProgress.textContent = `答对 ${quizState.correctCount} / ${quizState.totalForReward}　（每答对5题奖励1猫粮）`;
                say('答对啦喵！', 800);

                setTimeout(function() {
                    if (!quizState.active) return;

                    if (quizState.correctCount >= quizState.totalForReward) {
                        quizState.correctCount = 0;
                        addFood(1);
                        say('答对5题！奖励1个猫粮！喵呜~', 2000);
                        bbProgress.textContent = `答对 0 / ${quizState.totalForReward}　（每答对5题奖励1猫粮）`;
                        setTimeout(renderQuestion, 700);
                    } else {
                        renderQuestion();
                    }
                }, 500);
            } else {
                btn.classList.add('wrong');
                say('喵？再想想~', 900);
                setTimeout(function() {
                    btn.classList.remove('wrong');
                }, 600);
            }
        }

        function startBoardQuiz() {
            quizState.active = true;
            quizState.correctCount = 0;
            quizState.locked = false;
            quizState.current = null;

            bbIdle.style.display = 'none';
            bbQuiz.style.display = '';
            bbProgress.textContent = `答对 0 / ${quizState.totalForReward}　（每答对5题奖励1猫粮）`;

            renderQuestion();
            say('我们来算算术吧喵！', 1400);
        }

        function hideBoardQuiz() {
            quizState.active = false;
            quizState.locked = false;
            quizState.current = null;
            bbQuiz.style.display = 'none';
            bbIdle.style.display = '';
            bbProgress.textContent = '';
            bbOptions.innerHTML = '';
        }

        function leaveBoard() {
            const wasActive = petState.atBoard || petState.goingToBoard;
            petState.atBoard = false;
            petState.goingToBoard = false;
            blackboardTaps = 0;
            hideBoardQuiz();
            if (wasActive) {
                setRandomIdleDirection();
            }
            return wasActive;
        }

        function attractPetToBoard() {
            if (petState.atBoard || petState.goingToBoard) return;
            if (petState.eating) {
                say('我在吃饭呢喵~', 1200);
                return;
            }
            if (petState.chasingFood || foodDrag.active) return;

            const rect = blackboard.getBoundingClientRect();
            const maxX = Math.max(8, document.body.scrollWidth - petWrap.offsetWidth - 8);
            const maxY = Math.max(8, document.body.scrollHeight - petWrap.offsetHeight - 8);

            const petW = petWrap.offsetWidth;
            const petH = petWrap.offsetHeight;
            const spacing = 16;

            // 判断黑板右侧是否有足够空间放猫球
            const spaceRight = window.innerWidth - rect.right;

            let tx, ty;
            if (spaceRight >= petW + spacing) {
                // 右侧有空间 → 站在黑板右侧
                tx = rect.right + window.scrollX + spacing;
                ty = rect.bottom + window.scrollY - petH;
            } else {
                // 右侧没空间（窄屏）→ 站在黑板下方居中
                tx = rect.left + window.scrollX + (rect.width - petW) / 2;
                ty = rect.bottom + window.scrollY + 6;
            }

            petState.boardTargetX = clamp(tx, 8, maxX);
            petState.boardTargetY = clamp(ty, 8, maxY);

            petState.running = false;
            pet.classList.remove('running');
            petState.goingToBoard = true;
            petState.nextMeowAt = performance.now() + 200;
            say('小黑板叫我啦？喵！', 1200);
        }

        blackboard.addEventListener('click', function(e) {
            if (e.target.closest('.bb-option')) return;
            if (petState.atBoard) return;
            if (petState.goingToBoard) return;
            if (petState.eating) return;

            blackboardTaps++;
            blackboard.classList.remove('shake');
            void blackboard.offsetWidth;
            blackboard.classList.add('shake');

            if (blackboardTaps >= BLACKBOARD_TAP_REQUIRED) {
                blackboardTaps = 0;
                attractPetToBoard();
            } else {
                say(`再敲 ${BLACKBOARD_TAP_REQUIRED - blackboardTaps} 下喵~`, 900);
            }
        });

        /* =========================================================
           每日运势
           ========================================================= */
        const FORTUNE_KEY        = 'catball_fortune_v1';
        const FORTUNE_STREAK_KEY = 'catball_fortune_streak_v1';
        const FORTUNE_UID_KEY    = 'catball_fortune_uid_v1';

        const FORTUNE_LEVELS = [
            { name: '大吉',   weight: 8,  cls: 'lv-daji' },
            { name: '中吉',   weight: 15, cls: 'lv-zhongji' },
            { name: '小吉',   weight: 20, cls: 'lv-xiaoji' },
            { name: '平',     weight: 22, cls: 'lv-ping' },
            { name: '小凶',   weight: 15, cls: 'lv-xiaoxiong' },
            { name: '凶',     weight: 10, cls: 'lv-xiong' },
            { name: '大凶',   weight: 8,  cls: 'lv-daxiong' },
            { name: '？？？', weight: 2,  cls: 'lv-mystery' }
        ];

        const fortuneLevelEl  = document.getElementById('fortuneLevel');
        const fortuneDateEl   = document.getElementById('fortuneDate');
        const fortuneStreakEl = document.getElementById('fortuneStreak');
        const fortuneSignBtn  = document.getElementById('fortuneSignBtn');

        function getFortuneUid() {
            let uid = safeGet(FORTUNE_UID_KEY);
            if (!uid) {
                uid = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
                safeSet(FORTUNE_UID_KEY, uid);
            }
            return uid;
        }

        function fortuneSeed(str) {
            let h = 2166136261 >>> 0;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 16777619) >>> 0;
            }
            return h >>> 0;
        }

        function makeRand(seed) {
            let a = seed >>> 0;
            return function () {
                a = (a + 0x6D2B79F5) >>> 0;
                let t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function pickFortuneLevel(rand) {
            const total = FORTUNE_LEVELS.reduce((s, l) => s + l.weight, 0);
            let r = rand() * total;
            for (const lv of FORTUNE_LEVELS) {
                if (r < lv.weight) return lv;
                r -= lv.weight;
            }
            return FORTUNE_LEVELS[FORTUNE_LEVELS.length - 1];
        }

        function generateFortune(dateStr) {
            const uid = getFortuneUid();
            const rand = makeRand(fortuneSeed('catball::' + uid + '::' + dateStr));
            const lv = pickFortuneLevel(rand);
            return { date: dateStr, level: lv.name, cls: lv.cls };
        }

        function getTodayFortune() {
            const raw = safeGet(FORTUNE_KEY);
            if (!raw) return null;
            try {
                const f = JSON.parse(raw);
                if (!f || f.date !== todayStr() || !f.level || !f.cls) return null;
                return f;
            } catch (e) {
                return null;
            }
        }

        function setTodayFortune(f) {
            safeSet(FORTUNE_KEY, JSON.stringify(f));
        }

        function getStreak() {
            const raw = safeGet(FORTUNE_STREAK_KEY);
            if (!raw) return { last: '', count: 0 };
            try {
                const s = JSON.parse(raw);
                if (s && typeof s.last === 'string' && Number.isFinite(s.count) && s.count >= 0) return s;
            } catch (e) { /* 忽略 */ }
            return { last: '', count: 0 };
        }

        function setStreak(s) {
            safeSet(FORTUNE_STREAK_KEY, JSON.stringify(s));
        }

        function currentStreakDisplay() {
            const s = getStreak();
            const today = todayStr();
            if (s.last === today) return s.count;
            if (s.last === yesterdayStr()) return s.count;
            return 0;
        }

        function renderFortune() {
            const today = todayStr();
            const f = getTodayFortune();
            const streakDisplay = currentStreakDisplay();

            fortuneDateEl.textContent = today;

            if (!f) {
                fortuneLevelEl.textContent = '？';
                fortuneLevelEl.className = 'fortune-level lv-pending';

                fortuneSignBtn.style.display = '';
                fortuneStreakEl.textContent = streakDisplay > 0 ? `🔥 已连续签到 ${streakDisplay} 天` : '';
                return;
            }

            fortuneLevelEl.textContent = f.level;
            fortuneLevelEl.className = 'fortune-level ' + f.cls;
            fortuneSignBtn.style.display = 'none';
            fortuneStreakEl.textContent = streakDisplay > 0 ? `🔥 连续签到 ${streakDisplay} 天` : '';
        }

        function signFortune() {
            const today = todayStr();
            const yesterday = yesterdayStr();
            const s = getStreak();

            let newCount;
            if (s.last === today) {
                newCount = s.count;
            } else if (s.last === yesterday) {
                newCount = s.count + 1;
            } else {
                newCount = 1;
            }

            setStreak({ last: today, count: newCount });
            setTodayFortune(generateFortune(today));

            renderFortune();
            say('签到成功！喵~ 🔮', 1500);
        }

        fortuneSignBtn.addEventListener('click', signFortune);

        let lastFortuneDate = todayStr();
        setInterval(function () {
            const cur = todayStr();
            if (cur !== lastFortuneDate) {
                lastFortuneDate = cur;
                renderFortune();
            }
        }, 60 * 1000);

        renderFortune();

        /* =========================================================
           URL 重置入口
           ========================================================= */
        (function handleResetParam() {
            let params;
            try { params = new URLSearchParams(location.search); } catch (e) { return; }
            if (!params.has('reset')) return;

            const mode = (params.get('reset') || '1').toLowerCase();
            let didReset = false;

            if (mode === 'all') {
                try {
                    const keys = [];
                    for (let i = 0; i < localStorage.length; i++) {
                        const k = localStorage.key(i);
                        if (k && k.indexOf('catball_') === 0) keys.push(k);
                    }
                    keys.forEach(function(k) {
                        try { localStorage.removeItem(k); } catch (e) {}
                    });
                    didReset = true;
                } catch (e) { /* 忽略 */ }
            } else {
                try {
                    localStorage.removeItem(FEED_DATE_KEY);
                    didReset = true;
                } catch (e) { /* 忽略 */ }

                if (getFoodCount() < MIN_FOOD) {
                    try { localStorage.setItem(FOOD_KEY, String(MIN_FOOD)); } catch (e) {}
                }
            }

            try {
                const url = new URL(location.href);
                url.searchParams.delete('reset');
                history.replaceState(null, '', url.pathname + url.search + url.hash);
            } catch (e) { /* 忽略 */ }

            updateFoodUI();
            renderFortune();

            if (didReset) {
                setTimeout(function() {
                    say(mode === 'all' ? '全部数据已重置喵~' : '喂食记录已重置喵~', 2400);
                }, 800);
            }
        })();
    </script>
</body>
