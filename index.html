<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫球小站</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            position: relative;
            min-height: 100vh;
        }

        .pet-wrap {
            position: absolute;
            left: 0;
            top: 0;
            width: 94px;
            height: 94px;
            z-index: 9999;
            user-select: none;
            pointer-events: auto;
            opacity: 0;
            transform: translate3d(32px, 140px, 0);
            will-change: transform;
            transition: opacity 0.2s ease;
        }

        .pet {
            position: absolute;
            left: 12px;
            top: 12px;
            width: 72px;
            height: 72px;
            cursor: pointer;
            background: url('images/catball.png') center/contain no-repeat;
            image-rendering: auto;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.18));
            transition: transform 0.15s ease, filter 0.15s ease;
            will-change: transform;
        }

        .pet:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.22));
        }

        .pet.running {
            transform: scale(1.12);
            filter: drop-shadow(0 8px 16px rgba(255, 120, 120, 0.35));
        }

        .pet-speech {
            position: absolute;
            left: 72px;
            top: 8px;
            max-width: 180px;
            padding: 7px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            color: #333;
            font-size: 13px;
            line-height: 1.3;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }

        .pet-speech::before {
            content: "";
            position: absolute;
            left: -8px;
            top: 12px;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.96);
            border-left: 1px solid rgba(0, 0, 0, 0.08);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            transform: rotate(45deg);
        }

        .pet-speech.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ---------- 新增：猫粮状态栏 ---------- */
        .pet-food-bar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 14px;
            margin: 8px 18px;
            padding: 8px 14px;
            background: linear-gradient(135deg, #fff8ec, #ffe9cc);
            border: 1px solid rgba(210, 160, 90, 0.35);
            border-radius: 12px;
            font-size: 14px;
            color: #6d3a00;
            box-shadow: 0 2px 8px rgba(180, 120, 40, 0.08);
        }

        .pet-food-info {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .pet-food-info strong {
            font-size: 1.15em;
            color: #d47700;
            transition: color 0.25s ease, transform 0.25s ease;
            display: inline-block;
            min-width: 1em;
            text-align: center;
        }

        .pet-food-info strong.flash {
            color: #ff8800;
            transform: scale(1.35);
        }

        .pet-food-status {
            color: #a06b28;
            font-size: 13px;
        }

        .pet-food-status.fed {
            color: #2f8a2f;
            font-weight: 600;
        }

        .pet-food-btn {
            margin-left: auto;
            padding: 6px 16px;
            border: none;
            border-radius: 8px;
            background: #ffbf66;
            color: #3a2200;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .pet-food-btn:hover:not(:disabled) {
            background: #ffb144;
        }

        .pet-food-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .pet-food-btn:disabled {
            background: #e8dccb;
            color: #a08b70;
            cursor: not-allowed;
        }

        @media (max-width: 500px) {
            .pet-food-btn {
                margin-left: 0;
                width: 100%;
            }
        }

        /* ---------- 新增：每日运势 ---------- */
        .daily-fortune-card {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px 18px;
            margin: 8px 18px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #fffdf7, #eef4ff);
            border: 1px solid rgba(150, 160, 200, 0.28);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(90, 110, 180, 0.08);
        }

        .fortune-level {
            flex: 0 0 auto;
            min-width: 86px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: 2px;
            text-align: center;
            white-space: nowrap;
            border: 2px solid transparent;
        }

        .fortune-level.lv-daji      { color: #d4380d; background: #fff3e8; border-color: #ffb08a; }
        .fortune-level.lv-zhongji   { color: #d46b08; background: #fff8e6; border-color: #ffd591; }
        .fortune-level.lv-xiaoji    { color: #ad8b00; background: #fffbe6; border-color: #ffe58f; }
        .fortune-level.lv-ping      { color: #4a5568; background: #f7f9fc; border-color: #cbd5e0; }
        .fortune-level.lv-xiaoxiong { color: #3c7a89; background: #eff9fb; border-color: #a8d8e2; }
        .fortune-level.lv-xiong     { color: #4a5568; background: #f0f2f5; border-color: #b8c0cc; }
        .fortune-level.lv-daxiong   { color: #2d3748; background: #e8eaee; border-color: #9aa3b0; }
        .fortune-level.lv-mystery   { color: #8e44ad; background: #f8f2ff; border-color: #d3b3ef; letter-spacing: 0; }

        .fortune-main {
            flex: 1 1 200px;
            min-width: 0;
        }

        .fortune-head {
            font-size: 13px;
            color: #8a94a6;
            margin-bottom: 6px;
        }

        .fortune-date {
            margin-left: 8px;
            color: #b0b8c6;
            font-variant-numeric: tabular-nums;
        }

        .fortune-lines {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 20px;
            font-size: 14px;
        }

        .fortune-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .fortune-item .lbl {
            display: inline-block;
            width: 20px;
            height: 20px;
            line-height: 20px;
            text-align: center;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 700;
        }

        .fortune-good { color: #2f8a2f; }
        .fortune-good .lbl { background: #e3f5e3; }
        .fortune-bad { color: #c0392b; }
        .fortune-bad .lbl { background: #fdeaea; }

        @media (max-width: 500px) {
            .daily-fortune-card { gap: 10px; }
            .fortune-level { min-width: 72px; font-size: 20px; padding: 8px 10px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>猫球小站</h1>
        <nav>
            <a href="index.html">首页</a>
            <a href="download.html">文件分享</a>
            <a href="rand.html">随机数抽取</a>
            <a href="calendar.html">日历与倒数日</a>
            <a href="clock.html">世界时间</a>
        </nav>
    </header>

    <!-- 新增：猫粮状态栏 -->
    <div class="pet-food-bar">
        <span class="pet-food-info">🍖 猫粮：<strong id="foodCount">0</strong></span>
        <span class="pet-food-status" id="feedStatus">今天还没喂</span>
        <button class="pet-food-btn" id="feedBtn" type="button">喂猫 🐱</button>
    </div>

    <!-- 新增：每日运势 -->
    <div class="daily-fortune-card" id="dailyFortune">
        <div class="fortune-level" id="fortuneLevel">…</div>
        <div class="fortune-main">
            <div class="fortune-head">🔮 今日运势<span class="fortune-date" id="fortuneDate"></span></div>
            <div class="fortune-lines" id="fortuneLines"></div>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="搜索帖子标题或内容...">
        <p id="searchTip"></p>
    </div>

    <div class="post-card foldable-game">
        <div class="fold-header" id="foldToggle">
            <span>🎮 游戏中心</span>
            <span class="fold-arrow">▼</span>
        </div>
        <div class="fold-content" id="foldContent">
            <div class="game-item">
                <h4>🦖 小恐龙</h4>
                <p class="game-tip">按 <kbd>空格</kbd> 跳跃，<kbd>↓</kbd> 下蹲</p>
                <div class="game-viewport">
                    <iframe
                        src="https://chromedino.com/embed/"
                        frameborder="0"
                        scrolling="no"
                        class="game-iframe"
                        title="Chrome小恐龙游戏">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <main id="postList">加载中...</main>

    <div id="petWrap" class="pet-wrap" aria-label="桌宠" title="点击让我乱跑 10 秒">
        <div id="pet" class="pet"></div>
        <div id="petSpeech" class="pet-speech" aria-live="polite"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        /* =========================================================
           文章加载 / 渲染 / 搜索 / 折叠（原有）
           ========================================================= */
        let allPosts = [];

        fetch('posts.json')
            .then(res => res.json())
            .then(data => {
                allPosts = data.posts;
                renderPosts(allPosts);
            })
            .catch(err => {
                document.getElementById('postList').innerHTML = '<p class="error">加载失败，请检查 posts.json 语法是否正确</p>';
                console.error(err);
            });

        function renderPosts(posts) {
            const container = document.getElementById('postList');
            if (posts.length === 0) {
                container.innerHTML = '<p>没有找到相关帖子</p>';
                return;
            }
            let html = '';
            posts.forEach(post => {
                html += `
                <article class="post-card">
                    <h2><a href="post.html?id=${post.id}">${post.title}</a></h2>
                    <div class="post-meta">${post.date} · 作者：${post.author}</div>
                    <p class="post-summary">${post.summary}</p>
                </article>
                `;
            });
            container.innerHTML = html;
        }

        const searchInput = document.getElementById('searchInput');
        const searchTip = document.getElementById('searchTip');
        searchInput.addEventListener('input', function() {
            const keyword = this.value.trim().toLowerCase();
            if (!keyword) {
                searchTip.textContent = '';
                renderPosts(allPosts);
                return;
            }
            const filtered = allPosts.filter(post =>
                post.title.toLowerCase().includes(keyword) ||
                post.summary.toLowerCase().includes(keyword) ||
                post.content.toLowerCase().includes(keyword)
            );
            renderPosts(filtered);
            searchTip.textContent = `找到 ${filtered.length} 篇相关帖子`;
        });

        const foldToggle = document.getElementById('foldToggle');
        const foldContent = document.getElementById('foldContent');
        const foldArrow = foldToggle.querySelector('.fold-arrow');
        foldToggle.addEventListener('click', function() {
            const isOpen = foldContent.classList.toggle('open');
            foldArrow.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        /* =========================================================
           桌宠系统（原有）
           ========================================================= */
        const petWrap = document.getElementById('petWrap');
        const pet = document.getElementById('pet');
        const petSpeech = document.getElementById('petSpeech');
        let speechTimer = null;

        const idlePhrases = ['喵~', '喵呜~', '欢迎！', '我是猫球。', '哈哈，快来陪我玩！'];
        const returnPhrases = ['等等我！', '不要抛弃我！', '我回来了，慢点！'];

        const petState = {
            x: 32,
            y: 140,
            vx: 1,
            vy: 0.6,
            running: false,
            runUntil: 0,
            idleTimer: 0,
            nextIdleSpeechAt: 0,
            nextMeowAt: 0,
            nextReturnSpeechAt: 0,
            lastTime: 0
        };

        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function say(text, duration = 1400) {
            petSpeech.textContent = text;
            petSpeech.classList.add('visible');
            clearTimeout(speechTimer);
            speechTimer = setTimeout(() => {
                petSpeech.classList.remove('visible');
            }, duration);
        }

        function setRandomIdleDirection() {
            const angle = Math.random() * Math.PI * 2;
            const speed = randomRange(0.5, 1.1);
            petState.vx = Math.cos(angle) * speed;
            petState.vy = Math.sin(angle) * speed;
            petState.idleTimer = randomRange(60, 170);
        }

        function setPetPosition() {
            const maxX = Math.max(8, document.body.scrollWidth - petWrap.offsetWidth - 8);
            const maxY = Math.max(8, document.body.scrollHeight - petWrap.offsetHeight - 8);
            petState.x = clamp(petState.x, 8, maxX);
            petState.y = clamp(petState.y, 8, maxY);
            petWrap.style.transform = `translate3d(${petState.x}px, ${petState.y}px, 0)`;
        }

        function isPetOutsideViewport() {
            const left = petState.x;
            const top = petState.y;
            const right = left + petWrap.offsetWidth;
            const bottom = top + petWrap.offsetHeight;

            return right < window.scrollX - 20 ||
                left > window.scrollX + window.innerWidth + 20 ||
                bottom < window.scrollY - 20 ||
                top > window.scrollY + window.innerHeight + 20;
        }

        function animate(timestamp) {
            if (!petState.lastTime) petState.lastTime = timestamp;
            const delta = (timestamp - petState.lastTime) / 16.67;
            petState.lastTime = timestamp;

            if (petState.running) {
                if (timestamp > petState.runUntil) {
                    petState.running = false;
                    pet.classList.remove('running');
                    setRandomIdleDirection();
                } else {
                    if (timestamp > petState.nextMeowAt) {
                        say('喵喵~', 700);
                        petState.nextMeowAt = timestamp + 550;
                    }

                    petState.vx += randomRange(-2.4, 2.4) * delta;
                    petState.vy += randomRange(-2.4, 2.4) * delta;
                    const length = Math.hypot(petState.vx, petState.vy) || 1;
                    const maxSpeed = 11.5;
                    if (length > maxSpeed) {
                        petState.vx = (petState.vx / length) * maxSpeed;
                        petState.vy = (petState.vy / length) * maxSpeed;
                    }
                }
            } else if (isPetOutsideViewport()) {
                if (timestamp > petState.nextReturnSpeechAt) {
                    say(returnPhrases[Math.floor(Math.random() * returnPhrases.length)], 1500);
                    petState.nextReturnSpeechAt = timestamp + 2200;
                }

                const centerX = window.scrollX + window.innerWidth * 0.5;
                const centerY = window.scrollY + window.innerHeight * 0.5;
                const targetX = clamp(centerX - petWrap.offsetWidth / 2, 8, Math.max(8, document.body.scrollWidth - petWrap.offsetWidth - 8));
                const targetY = clamp(centerY - petWrap.offsetHeight / 2, 8, Math.max(8, document.body.scrollHeight - petWrap.offsetHeight - 8));
                const dx = targetX - petState.x;
                const dy = targetY - petState.y;
                const distance = Math.hypot(dx, dy) || 1;
                const speed = 13;
                petState.vx = (dx / distance) * speed;
                petState.vy = (dy / distance) * speed;

                if (distance < 18) {
                    petState.vx = 0;
                    petState.vy = 0;
                    setRandomIdleDirection();
                }
            } else {
                petState.idleTimer -= delta;
                if (petState.idleTimer <= 0) {
                    setRandomIdleDirection();
                }

                petState.vx *= 0.96;
                petState.vy *= 0.96;
                if (Math.hypot(petState.vx, petState.vy) < 0.35) {
                    setRandomIdleDirection();
                }

                if (timestamp > petState.nextIdleSpeechAt) {
                    const text = idlePhrases[Math.floor(Math.random() * idlePhrases.length)];
                    say(text, 1400);
                    petState.nextIdleSpeechAt = timestamp + randomRange(2800, 5200);
                }
            }

            petState.x += petState.vx * delta;
            petState.y += petState.vy * delta;
            setPetPosition();
            requestAnimationFrame(animate);
        }

        pet.addEventListener('click', function() {
            petState.running = true;
            petState.runUntil = performance.now() + 10000;
            pet.classList.add('running');
            petState.nextMeowAt = performance.now() + 200;
            const angle = Math.random() * Math.PI * 2;
            const speed = randomRange(8, 12);
            petState.vx = Math.cos(angle) * speed;
            petState.vy = Math.sin(angle) * speed;
            say('喵喵喵！', 900);
        });

        setRandomIdleDirection();
        setPetPosition();
        petState.nextIdleSpeechAt = performance.now() + 1500;
        petWrap.style.opacity = '1';
        requestAnimationFrame(animate);

        window.addEventListener('resize', setPetPosition);
        window.addEventListener('scroll', function() {
            if (!petState.running && isPetOutsideViewport()) {
                petState.nextReturnSpeechAt = performance.now();
            }
        }, { passive: true });

        /* =========================================================
           新增：猫粮系统
           ========================================================= */
        const FOOD_KEY        = 'catball_food_v1';           // 猫粮数量
        const FEED_DATE_KEY   = 'catball_feed_date_v1';      // 上次喂食日期 YYYY-MM-DD

        const foodCountEl     = document.getElementById('foodCount');
        const feedStatusEl    = document.getElementById('feedStatus');
        const feedBtn         = document.getElementById('feedBtn');

        // localStorage 安全封装（隐私模式下会抛错）
        function safeGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function safeSet(key, value) {
            try { localStorage.setItem(key, value); } catch (e) { /* 忽略 */ }
        }

        // 本地日期（不涉及时区，用本地 0 点做日界）
        function todayStr() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function getFoodCount() {
            const raw = parseInt(safeGet(FOOD_KEY) || '0', 10);
            return Number.isFinite(raw) && raw > 0 ? raw : 0;
        }

        function setFoodCount(n) {
            const safe = Math.max(0, Math.floor(Number(n) || 0));
            safeSet(FOOD_KEY, String(safe));
            updateFoodUI();
        }

        function addFood(n = 1) {
            setFoodCount(getFoodCount() + n);
            flashFoodCount();
        }

        function hasFedToday() {
            return safeGet(FEED_DATE_KEY) === todayStr();
        }

        function flashFoodCount() {
            foodCountEl.classList.add('flash');
            clearTimeout(flashFoodCount._t);
            flashFoodCount._t = setTimeout(() => {
                foodCountEl.classList.remove('flash');
            }, 350);
        }

        function updateFoodUI() {
            const count = getFoodCount();
            const fed = hasFedToday();

            foodCountEl.textContent = count;

            if (fed) {
                feedStatusEl.textContent = '今日已喂 ✅（明天再来）';
                feedStatusEl.classList.add('fed');
                feedBtn.disabled = true;
                feedBtn.textContent = '今天喂过啦';
            } else if (count < 1) {
                feedStatusEl.textContent = '还没有猫粮（浏览帖子可 +1）';
                feedStatusEl.classList.remove('fed');
                feedBtn.disabled = true;
                feedBtn.textContent = '猫粮不足';
            } else {
                feedStatusEl.textContent = '今天还没喂，快点我~';
                feedStatusEl.classList.remove('fed');
                feedBtn.disabled = false;
                feedBtn.textContent = '喂猫 🐱';
            }
        }

        // 喂猫
        function feedCat() {
            if (hasFedToday()) {
                say('我今天已经吃过啦，明天再来~', 1800);
                return;
            }
            const count = getFoodCount();
            if (count < 1) {
                say('还没有猫粮…去看看帖子攒猫粮喵~', 2200);
                return;
            }

            // 扣粮 + 记录今日
            setFoodCount(count - 1);
            safeSet(FEED_DATE_KEY, todayStr());

            // 开心乱跑 3 秒
            petState.running = true;
            petState.runUntil = performance.now() + 3000;
            pet.classList.add('running');
            petState.nextMeowAt = performance.now() + 250;
            const angle = Math.random() * Math.PI * 2;
            const speed = randomRange(9, 12);
            petState.vx = Math.cos(angle) * speed;
            petState.vy = Math.sin(angle) * speed;

            say('好吃！最喜欢你啦喵~', 1800);
            setTimeout(() => say('喵呜~ 🍖', 1200), 1900);

            updateFoodUI();
        }

        feedBtn.addEventListener('click', feedCat);

        /* 浏览帖子 → +1 猫粮（事件委托，动态渲染也生效） */
        document.getElementById('postList').addEventListener('click', function(e) {
            const link = e.target.closest('a[href*="post.html"]');
            if (!link) return;
            addFood(1);
            // 页面马上会跳转，所以不 say，用户返回时猫粮数已经是新值
        });

        /* 跨标签页同步（其他标签喂/得粮时，本页 UI 自动刷新） */
        window.addEventListener('storage', function(e) {
            if (e.key === FOOD_KEY || e.key === FEED_DATE_KEY) {
                updateFoodUI();
            }
        });

        /* 跨午夜自动解禁（保持页面长时间打开也能重置） */
        let lastToday = todayStr();
        setInterval(function() {
            const cur = todayStr();
            if (cur !== lastToday) {
                lastToday = cur;
                updateFoodUI();
            }
        }, 60 * 1000);

        /* 初始化 */
        updateFoodUI();

        /* =========================================================
           新增：每日运势（数据存在浏览器本地）
           ========================================================= */
        const FORTUNE_KEY = 'catball_fortune_v1';

        // 等级与权重（总和 100）
        const FORTUNE_LEVELS = [
            { name: '大吉',   weight: 8,  cls: 'lv-daji' },
            { name: '中吉',   weight: 15, cls: 'lv-zhongji' },
            { name: '小吉',   weight: 20, cls: 'lv-xiaoji' },
            { name: '平',     weight: 22, cls: 'lv-ping' },
            { name: '小凶',   weight: 15, cls: 'lv-xiaoxiong' },
            { name: '凶',     weight: 10, cls: 'lv-xiong' },
            { name: '大凶',   weight: 8,  cls: 'lv-daxiong' },
            { name: '？？？', weight: 2,  cls: 'lv-mystery' }
        ];

        // 猫猫「宜」
        const FORTUNE_GOOD = [
            '撸猫', '投喂小鱼干', '晒太阳', '钻进纸箱', '给猫球梳毛', '打呼噜',
            '追激光笔', '蹭腿', '踩奶', '观察窗外的小鸟', '安静地喵一声',
            '在键盘上睡觉', '囤猫粮', '陪猫球玩逗猫棒', '午后打个盹',
            '收下猫主子的踩奶', '对着月亮喵喵叫', '给猫球让出沙发'
        ];

        // 猫猫「忌」
        const FORTUNE_BAD = [
            '给猫洗澡', '剪指甲', '深夜跑酷', '抓沙发', '打翻水杯', '踩猫尾巴',
            '抢猫粮', '强行抱抱', '喂巧克力', '对着猫学狗叫', '挪动猫窝',
            '直视猫咪的眼睛', '深夜开吸尘器', '摸猫肚子', '把猫从纸箱里赶出来',
            '空调直吹猫', '湿着手摸猫', '在猫面前独吞小鱼干'
        ];

        const fortuneLevelEl = document.getElementById('fortuneLevel');
        const fortuneDateEl  = document.getElementById('fortuneDate');
        const fortuneLinesEl = document.getElementById('fortuneLines');

        // 字符串 → 32 位种子（FNV-1a）
        function fortuneSeed(str) {
            let h = 2166136261 >>> 0;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 16777619) >>> 0;
            }
            return h >>> 0;
        }

        // 可复现的伪随机数（mulberry32）
        function makeRand(seed) {
            let a = seed >>> 0;
            return function () {
                a = (a + 0x6D2B79F5) >>> 0;
                let t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function pickFortuneLevel(rand) {
            const total = FORTUNE_LEVELS.reduce((s, l) => s + l.weight, 0);
            let r = rand() * total;
            for (const lv of FORTUNE_LEVELS) {
                if (r < lv.weight) return lv;
                r -= lv.weight;
            }
            return FORTUNE_LEVELS[FORTUNE_LEVELS.length - 1];
        }

        function generateFortune(dateStr) {
            const rand = makeRand(fortuneSeed('catball::' + dateStr));
            const lv = pickFortuneLevel(rand);

            let good = '';
            let bad = '';

            if (lv.name === '大吉') {
                good = '诸事皆宜';
            } else if (lv.name === '大凶') {
                bad = '诸事不宜';
            } else if (lv.name !== '？？？') {
                good = FORTUNE_GOOD[Math.floor(rand() * FORTUNE_GOOD.length)];
                bad = FORTUNE_BAD[Math.floor(rand() * FORTUNE_BAD.length)];
            }

            return { date: dateStr, level: lv.name, cls: lv.cls, good: good, bad: bad };
        }

        // 读取（当天已抽过就直接用本地的，否则生成并写入本地）
        function loadFortune() {
            const today = todayStr();
            const raw = safeGet(FORTUNE_KEY);
            if (raw) {
                try {
                    const saved = JSON.parse(raw);
                    if (saved && saved.date === today && saved.level && saved.cls) return saved;
                } catch (e) { /* 数据异常则重新生成 */ }
            }
            const fresh = generateFortune(today);
            safeSet(FORTUNE_KEY, JSON.stringify(fresh));
            return fresh;
        }

        function makeFortuneLine(type, text) {
            const item = document.createElement('span');
            item.className = 'fortune-item fortune-' + type;

            const lbl = document.createElement('span');
            lbl.className = 'lbl';
            lbl.textContent = type === 'good' ? '宜' : '忌';

            item.appendChild(lbl);
            item.appendChild(document.createTextNode(text));
            return item;
        }

        function renderFortune() {
            const f = loadFortune();

            fortuneLevelEl.textContent = f.level;
            fortuneLevelEl.className = 'fortune-level ' + f.cls;
            fortuneDateEl.textContent = f.date;
            fortuneLinesEl.innerHTML = '';

            if (f.level === '？？？') return;   // 什么也不写

            if (f.good) fortuneLinesEl.appendChild(makeFortuneLine('good', f.good));
            if (f.bad)  fortuneLinesEl.appendChild(makeFortuneLine('bad', f.bad));
        }

        renderFortune();

        /* 跨午夜自动换新运势 */
        let lastFortuneDate = todayStr();
        setInterval(function () {
            const cur = todayStr();
            if (cur !== lastFortuneDate) {
                lastFortuneDate = cur;
                renderFortune();
            }
        }, 60 * 1000);
    </script>
</body>
</html>
