<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫球小站</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            position: relative;
            min-height: 100vh;
        }

        header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 18px 8px;
        }

        .header-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 3vw, 2.7rem);
        }

        .cat-bed {
            position: relative;
            width: 72px;
            height: 52px;
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,.12));
        }

        .cat-bed__roof {
            position: absolute;
            left: 10px;
            top: 0;
            width: 52px;
            height: 22px;
            background: #cfc9bb;
            border-radius: 12px 12px 8px 8px;
            border: 2px solid rgba(90, 72, 45, 0.45);
            box-sizing: border-box;
        }

        .cat-bed__body {
            position: absolute;
            left: 8px;
            bottom: 8px;
            width: 56px;
            height: 26px;
            background: linear-gradient(#f1d7a0, #d4b57d);
            border: 2px solid rgba(90, 72, 45, 0.45);
            border-radius: 14px 14px 12px 12px;
            box-sizing: border-box;
        }

        .cat-bed__door {
            position: absolute;
            left: 28px;
            bottom: 12px;
            width: 16px;
            height: 18px;
            border-radius: 6px;
            background: rgba(120, 82, 28, 0.25);
            border: 2px solid rgba(90, 72, 45, 0.45);
            box-sizing: border-box;
        }

        .cat-bed__shadow {
            position: absolute;
            left: 10px;
            bottom: 0;
            width: 52px;
            height: 9px;
            background: rgba(90, 72, 45, 0.14);
            border-radius: 50%;
        }

        .pet-wrap {
            position: absolute;
            left: 32px;
            top: 140px;
            width: 94px;
            height: 94px;
            z-index: 9999;
            user-select: none;
            pointer-events: auto;
            transition: opacity 0.2s ease;
        }

        .pet {
            position: absolute;
            left: 12px;
            top: 12px;
            width: 72px;
            height: 72px;
            cursor: pointer;
            background: url('images/catball.png') center/contain no-repeat;
            image-rendering: auto;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.18));
            transition: transform 0.15s ease, filter 0.15s ease;
            will-change: transform, left, top;
        }

        .pet:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.22));
        }

        .pet.running {
            transform: scale(1.12);
            filter: drop-shadow(0 8px 16px rgba(255, 120, 120, 0.35));
        }

        .pet-speech {
            position: absolute;
            left: 72px;
            top: 8px;
            max-width: 180px;
            padding: 7px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            color: #333;
            font-size: 13px;
            line-height: 1.3;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }

        .pet-speech::before {
            content: "";
            position: absolute;
            left: -8px;
            top: 12px;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.96);
            border-left: 1px solid rgba(0, 0, 0, 0.08);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            transform: rotate(45deg);
        }

        .pet-speech.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .pet-question {
            position: absolute;
            left: 110px;
            top: 58px;
            padding: 10px 12px;
            width: min(250px, calc(100vw - 60px));
            background: rgba(255,255,255,0.95);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 12px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.12);
            font-size: 13px;
            color: #333;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            z-index: 10;
        }

        .pet-question.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .pet-question strong {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #6d3a00;
        }

        .pet-question form {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            pointer-events: auto;
        }

        .pet-question #mathPrompt {
            display: inline-block;
            font-weight: 600;
            line-height: 1.5;
        }

        .pet-question input {
            width: 76px;
            padding: 6px 7px;
            border: 1px solid #d3d3d3;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .pet-question button {
            padding: 6px 8px;
            border: none;
            border-radius: 8px;
            background: #ffbf66;
            color: #3a2200;
            font-weight: 700;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            header {
                flex-wrap: wrap;
            }

            .pet-speech {
                left: 64px;
                max-width: 140px;
            }

            .pet-question {
                width: min(220px, calc(100vw - 46px));
                left: 88px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title-wrap">
            <h1>猫球小站</h1>
        </div>

        <button id="catBed" class="cat-bed" type="button" aria-label="猫窝">
            <span class="cat-bed__roof"></span>
            <span class="cat-bed__body"></span>
            <span class="cat-bed__door"></span>
            <span class="cat-bed__shadow"></span>
        </button>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="搜索帖子标题或内容...">
        <p id="searchTip"></p>
    </div>

    <div class="post-card foldable-game">
        <div class="fold-header" id="foldToggle">
            <span>🎮 游戏中心</span>
            <span class="fold-arrow">▼</span>
        </div>
        <div class="fold-content" id="foldContent">
            <div class="game-item">
                <h4>🦖 小恐龙</h4>
                <p class="game-tip">按 <kbd>空格</kbd> 跳跃，<kbd>↓</kbd> 下蹲</p>
                <div class="game-viewport">
                    <iframe 
                        src="https://chromedino.com/embed/" 
                        frameborder="0"
                        scrolling="no"
                        class="game-iframe"
                        title="Chrome小恐龙游戏">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <main id="postList">加载中...</main>

    <div id="petWrap" class="pet-wrap" aria-label="桌宠" title="点击让我乱跑 10 秒">
        <div id="pet" class="pet"></div>
        <div id="petSpeech" class="pet-speech" aria-live="polite"></div>
        <div id="petQuestion" class="pet-question" aria-live="polite">
            <strong id="mathTitle">数学题</strong>
            <form id="mathForm">
                <span id="mathPrompt">5 + 3 = ?</span>
                <input id="mathAnswer" type="number" inputmode="numeric" aria-label="答案">
                <button type="submit">提交</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        let allPosts = [];

        fetch('posts.json')
            .then(res => res.json())
            .then(data => {
                allPosts = data.posts;
                renderPosts(allPosts);
            })
            .catch(err => {
                document.getElementById('postList').innerHTML = '<p class="error">加载失败，请检查 posts.json 语法是否正确</p>';
                console.error(err);
            });

        function renderPosts(posts) {
            const container = document.getElementById('postList');
            if (posts.length === 0) {
                container.innerHTML = '<p>没有找到相关帖子</p>';
                return;
            }
            let html = '';
            posts.forEach(post => {
                html += `
                <article class="post-card">
                    <h2><a href="post.html?id=${post.id}">${post.title}</a></h2>
                    <div class="post-meta">${post.date} · 作者：${post.author}</div>
                    <p class="post-summary">${post.summary}</p>
                </article>
                `;
            });
            container.innerHTML = html;
        }

        const searchInput = document.getElementById('searchInput');
        const searchTip = document.getElementById('searchTip');
        searchInput.addEventListener('input', function() {
            const keyword = this.value.trim().toLowerCase();
            if (!keyword) {
                searchTip.textContent = '';
                renderPosts(allPosts);
                return;
            }
            const filtered = allPosts.filter(post => 
                post.title.toLowerCase().includes(keyword) ||
                post.summary.toLowerCase().includes(keyword) ||
                post.content.toLowerCase().includes(keyword)
            );
            renderPosts(filtered);
            searchTip.textContent = `找到 ${filtered.length} 篇相关帖子`;
        });

        const foldToggle = document.getElementById('foldToggle');
        const foldContent = document.getElementById('foldContent');
        const foldArrow = foldToggle.querySelector('.fold-arrow');
        foldToggle.addEventListener('click', function() {
            const isOpen = foldContent.classList.toggle('open');
            foldArrow.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        const petWrap = document.getElementById('petWrap');
        const pet = document.getElementById('pet');
        const petSpeech = document.getElementById('petSpeech');
        const petQuestion = document.getElementById('petQuestion');
        const mathTitle = document.getElementById('mathTitle');
        const mathPrompt = document.getElementById('mathPrompt');
        const mathAnswer = document.getElementById('mathAnswer');
        const mathForm = document.getElementById('mathForm');
        const catBed = document.getElementById('catBed');
        let speechTimer = null;

        const idlePhrases = ['喵~', '喵呜~', '欢迎！', '我是猫球。', '哈哈，快来陪我玩！'];
        const returnPhrases = ['等等我！', '不要抛弃我！', '我回来了，慢点！'];
        const correctPhrases = ['真聪明！', '对啦！', '真棒！', '哈哈哈！'];
        const wrongPhrases = ['不对哦...', '这都能错？？！', '好好练去吧~', '下次再来试试...'];
        const wakePhrases = ['早上好', '叫我啥事？', '你好！', '睡了个好觉~'];
        const restLeavePhrases = ['你不理我那我先回去了，好困呀，回窝窝'];

        const petState = {
            mode: 'roaming',
            x: 32,
            y: 140,
            vx: 1,
            vy: 0.6,
            running: false,
            questionOpen: false,
            answerDeadline: 0,
            runUntil: 0,
            idleTimer: 0,
            nextQuestionAt: 0,
            nextIdleSpeechAt: 0,
            nextMeowAt: 0,
            nextReturnSpeechAt: 0,
            lastInteraction: performance.now(),
            lastTime: 0,
            bedX: 0,
            bedY: 0
        };

        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function say(text, duration = 1400) {
            petSpeech.textContent = text;
            petSpeech.classList.add('visible');
            clearTimeout(speechTimer);
            speechTimer = setTimeout(() => {
                petSpeech.classList.remove('visible');
            }, duration);
        }

        function setPetVisible(visible) {
            petWrap.style.opacity = visible ? '1' : '0';
            petWrap.style.pointerEvents = visible ? 'auto' : 'none';
            if (!visible) {
                petQuestion.classList.remove('visible');
            }
        }

        function updateBedPosition() {
            const rect = catBed.getBoundingClientRect();
            petState.bedX = rect.left + window.scrollX + 12;
            petState.bedY = rect.top + window.scrollY + 18;

            if (petState.mode === 'sleeping') {
                petState.x = petState.bedX + 10;
                petState.y = petState.bedY + 8;
            }
            if (petState.mode === 'resting') {
                petState.x = petState.bedX + 14;
                petState.y = petState.bedY + 8;
            }
        }

        function hideQuestion() {
            petQuestion.classList.remove('visible');
            petState.questionOpen = false;
            petState.answerDeadline = 0;
            mathAnswer.value = '';
            mathAnswer.dataset.answer = '';
        }

        function positionQuestionBubble() {
            if (!petState.questionOpen) return;
            const pageLeft = petState.x + petWrap.offsetWidth * 0.5;
            const viewportX = pageLeft - window.scrollX;
            let left = 110;
            if (viewportX < window.innerWidth * 0.38) {
                left = -200;
            } else if (viewportX > window.innerWidth * 0.62) {
                left = 110;
            }
            const top = petState.y < window.innerHeight * 0.42 ? 0 : 58;
            petQuestion.style.left = left + 'px';
            petQuestion.style.top = top + 'px';
            petQuestion.style.maxWidth = Math.min(250, window.innerWidth - 50) + 'px';
        }

        function generateMathQuestion() {
            const a = randomInt(1, 99);
            const b = randomInt(1, 99);
            const ops = ['+', '-', '*', '÷'];
            const op = ops[randomInt(0, ops.length - 1)];

            let expr = '';
            let answer = 0;

            if (op === '+') {
                expr = `${a} + ${b}`;
                answer = a + b;
            } else if (op === '-') {
                const left = Math.max(a, b);
                const right = Math.min(a, b);
                expr = `${left} - ${right}`;
                answer = left - right;
            } else if (op === '*') {
                expr = `${a} × ${b}`;
                answer = a * b;
            } else {
                const divisor = randomInt(2, 9);
                const quotient = randomInt(1, 9);
                const dividend = divisor * quotient;
                expr = `${dividend} ÷ ${divisor}`;
                answer = quotient;
            }

            mathTitle.textContent = '数学题';
            mathPrompt.textContent = `${expr} = ?`;
            mathAnswer.dataset.answer = String(answer);
            mathAnswer.value = '';
            petQuestion.classList.add('visible');
            petState.questionOpen = true;
            petState.answerDeadline = performance.now() + 60000;
            positionQuestionBubble();
            setTimeout(() => mathAnswer.focus(), 30);
        }

        function setRandomIdleDirection() {
            const angle = Math.random() * Math.PI * 2;
            const speed = randomRange(0.45, 1.1);
            petState.vx = Math.cos(angle) * speed;
            petState.vy = Math.sin(angle) * speed;
            petState.idleTimer = randomRange(60, 170);
        }

        function setPetPosition() {
            const maxX = Math.max(8, document.body.scrollWidth - petWrap.offsetWidth - 8);
            const maxY = Math.max(8, document.body.scrollHeight - petWrap.offsetHeight - 8);
            petState.x = clamp(petState.x, 8, maxX);
            petState.y = clamp(petState.y, 8, maxY);
            petWrap.style.left = petState.x + 'px';
            petWrap.style.top = petState.y + 'px';
        }

        function isPetOutsideViewport() {
            const x = petState.x;
            const y = petState.y;
            const right = x + petWrap.offsetWidth;
            const bottom = y + petWrap.offsetHeight;
            return right < window.scrollX - 30 ||
                x > window.scrollX + window.innerWidth + 30 ||
                bottom < window.scrollY - 30 ||
                y > window.scrollY + window.innerHeight + 30;
        }

        function enterRoaming() {
            petState.mode = 'roaming';
            petState.questionOpen = false;
            petQuestion.classList.remove('visible');
            setPetVisible(true);
            setRandomIdleDirection();
            petState.nextIdleSpeechAt = performance.now() + randomRange(2200, 4000);
            petState.nextQuestionAt = performance.now() + randomRange(10000, 30000);
        }

        function enterResting() {
            petState.mode = 'resting';
            petState.running = false;
            petState.questionOpen = false;
            petQuestion.classList.remove('visible');
            setPetVisible(true);
            petState.x = petState.bedX + 18;
            petState.y = petState.bedY + 8;
            petState.vx = 0;
            petState.vy = 0;
            petState.nextQuestionAt = performance.now() + randomRange(10000, 30000);
            say('你好！', 1000);
        }

        function enterSleeping() {
            petState.mode = 'sleeping';
            petState.running = false;
            hideQuestion();
            petState.questionOpen = false;
            petState.vx = 0;
            petState.vy = 0;
            petState.x = petState.bedX + 10;
            petState.y = petState.bedY + 8;
            setPetVisible(false);
            say('你不理我那我先回去了，好困呀，回窝窝', 1600);
        }

        function wakeFromSleep() {
            petState.mode = 'roaming';
            petState.questionOpen = false;
            hideQuestion();
            setPetVisible(true);
            const hour = new Date().getHours();
            let text = '你好！';
            if (hour < 6) text = '睡了个好觉~';
            else if (hour < 12) text = '早上好';
            else if (hour < 18) text = '叫我啥事？';
            say(text, 1400);
            petState.lastInteraction = performance.now();
            setRandomIdleDirection();
            petState.x = petState.bedX + 18;
            petState.y = petState.bedY + 14;
            petState.nextIdleSpeechAt = performance.now() + randomRange(2200, 4200);
        }

        function handleCorrectAnswer() {
            hideQuestion();
            petState.lastInteraction = performance.now();
            petState.running = true;
            petState.runUntil = performance.now() + 3000;
            pet.classList.add('running');
            const angle = Math.random() * Math.PI * 2;
            const speed = randomRange(8, 12);
            petState.vx = Math.cos(angle) * speed;
            petState.vy = Math.sin(angle) * speed;
            say(correctPhrases[Math.floor(Math.random() * correctPhrases.length)], 1600);
            petState.nextQuestionAt = performance.now() + randomRange(10000, 30000);
            petState.mode = 'roaming';
        }

        function handleWrongAnswer() {
            petState.lastInteraction = performance.now();
            say(wrongPhrases[Math.floor(Math.random() * wrongPhrases.length)], 1700);
            mathAnswer.value = '';
            mathAnswer.focus();
        }

        mathForm.addEventListener('submit', function(event) {
            event.preventDefault();
            if (!petState.questionOpen) return;
            const answer = Number(mathAnswer.value);
            const expected = Number(mathAnswer.dataset.answer || 0);
            if (Number.isFinite(answer) && answer === expected) {
                handleCorrectAnswer();
            } else {
                handleWrongAnswer();
            }
        });

        function animate(timestamp) {
            if (!petState.lastTime) petState.lastTime = timestamp;
            const delta = (timestamp - petState.lastTime) / 16.67;
            petState.lastTime = timestamp;
            const now = performance.now();

            if (petState.running) {
                if (now > petState.runUntil) {
                    petState.running = false;
                    pet.classList.remove('running');
                    if (petState.mode !== 'resting' && petState.mode !== 'sleeping') {
                        setRandomIdleDirection();
                    }
                } else {
                    if (now > petState.nextMeowAt) {
                        say('喵喵~', 700);
                        petState.nextMeowAt = now + 550;
                    }
                    petState.vx += randomRange(-2.5, 2.5) * delta;
                    petState.vy += randomRange(-2.5, 2.5) * delta;
                    const length = Math.hypot(petState.vx, petState.vy) || 1;
                    const maxSpeed = 11.5;
                    if (length > maxSpeed) {
                        petState.vx = (petState.vx / length) * maxSpeed;
                        petState.vy = (petState.vy / length) * maxSpeed;
                    }
                }
            }

            if (petState.mode === 'sleeping') {
                petState.x = petState.bedX + 10;
                petState.y = petState.bedY + 8;
                petState.vx = 0;
                petState.vy = 0;
            } else if (petState.mode === 'resting') {
                petState.x = petState.bedX + 18;
                petState.y = petState.bedY + 8;
                petState.vx = 0;
                petState.vy = 0;

                if (now > petState.nextQuestionAt) {
                    generateMathQuestion();
                    petState.nextQuestionAt = now + randomRange(10000, 30000);
                }

                if (petState.questionOpen && now > petState.answerDeadline) {
                    hideQuestion();
                    enterSleeping();
                }

                if (now - petState.lastInteraction > 60000) {
                    enterSleeping();
                }
            } else {
                if (isPetOutsideViewport()) {
                    petState.mode = 'roaming';
                    petState.returning = true;
                    if (now > petState.nextReturnSpeechAt) {
                        say(returnPhrases[Math.floor(Math.random() * returnPhrases.length)], 1500);
                        petState.nextReturnSpeechAt = now + 2200;
                    }

                    const centerX = window.scrollX + window.innerWidth * 0.5;
                    const centerY = window.scrollY + window.innerHeight * 0.5;
                    const targetX = clamp(centerX - petWrap.offsetWidth / 2, 8, Math.max(8, document.body.scrollWidth - petWrap.offsetWidth - 8));
                    const targetY = clamp(centerY - petWrap.offsetHeight / 2, 8, Math.max(8, document.body.scrollHeight - petWrap.offsetHeight - 8));
                    const dx = targetX - petState.x;
                    const dy = targetY - petState.y;
                    const distance = Math.hypot(dx, dy) || 1;
                    const speed = 13;
                    petState.vx = (dx / distance) * speed;
                    petState.vy = (dy / distance) * speed;
                    if (distance < 18) {
                        petState.vx = 0;
                        petState.vy = 0;
                        setRandomIdleDirection();
                    }
                } else {
                    petState.idleTimer -= delta;
                    if (petState.idleTimer <= 0) {
                        setRandomIdleDirection();
                    }
                    petState.vx *= 0.96;
                    petState.vy *= 0.96;
                    if (Math.hypot(petState.vx, petState.vy) < 0.35) {
                        setRandomIdleDirection();
                    }

                    if (now > petState.nextIdleSpeechAt) {
                        const text = idlePhrases[Math.floor(Math.random() * idlePhrases.length)];
                        say(text, 1400);
                        petState.nextIdleSpeechAt = now + randomRange(2800, 5200);
                    }
                }

                if (now - petState.lastInteraction > 25000) {
                    enterResting();
                }
            }

            if (petState.questionOpen) {
                positionQuestionBubble();
            }

            petState.x += petState.vx * delta;
            petState.y += petState.vy * delta;
            setPetPosition();
            requestAnimationFrame(animate);
        }

        pet.addEventListener('click', function() {
            petState.lastInteraction = performance.now();

            if (petState.mode === 'sleeping') {
                wakeFromSleep();
                return;
            }

            petState.running = true;
            petState.mode = 'roaming';
            petState.runUntil = performance.now() + 10000;
            pet.classList.add('running');
            petState.nextMeowAt = performance.now() + 200;
            const angle = Math.random() * Math.PI * 2;
            const speed = randomRange(8, 12);
            petState.vx = Math.cos(angle) * speed;
            petState.vy = Math.sin(angle) * speed;
            say('喵喵喵！', 900);
        });

        catBed.addEventListener('click', function() {
            petState.lastInteraction = performance.now();

            if (petState.mode === 'sleeping') {
                wakeFromSleep();
                return;
            }

            petState.mode = 'resting';
            petState.running = false;
            petState.questionOpen = false;
            hideQuestion();
            petState.x = petState.bedX + 18;
            petState.y = petState.bedY + 8;
            setPetVisible(true);
            pet.classList.remove('running');
            say('叫我啥事？', 1000);
            petState.nextQuestionAt = performance.now() + randomRange(10000, 30000);
        });

        catBed.addEventListener('mouseenter', function() {
            if (petState.mode !== 'sleeping' && !petState.questionOpen) {
                say('叫我啥事？', 900);
            }
        });

        window.addEventListener('scroll', function() {
            if (petState.mode === 'sleeping') return;
            if (petState.mode === 'resting') {
                petState.lastInteraction = performance.now();
                enterRoaming();
            }
        }, { passive: true });

        window.addEventListener('resize', function() {
            updateBedPosition();
            if (petState.questionOpen) positionQuestionBubble();
        });

        setRandomIdleDirection();
        updateBedPosition();
        petState.nextIdleSpeechAt = performance.now() + 1500;
        petState.nextQuestionAt = performance.now() + randomRange(10000, 30000);
        setPetPosition();
        setPetVisible(true);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
