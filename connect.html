<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>联机大厅｜syc专属私有池子（修复版）</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:900px;margin:16px auto;padding:0 12px;}
.box{border:1px solid #ccc;padding:12px;border-radius:8px;margin:10px 0}
#userList{min-height:120px}
.user-item{padding:6px 8px;margin:4px 0;background:#f3f4f6;border-radius:6px;cursor:pointer;}
.user-item:hover{background:#e5e7eb}
#chatLog{height:240px;overflow-y:auto;border:1px solid #aaa;padding:8px 0}
.msg{margin:4px 0}
.me{color:#0066cc}
.other{color:#222}
.sys{color:#777}
</style>
</head>
<body>

<h2>【私有大厅】syc111syc 联机房间</h2>
<!-- 设置昵称 -->
<div class="box">
  <label>设置你的昵称：</label>
  <input id="nameInput" placeholder="输入名字" value="玩家">
  <button onclick="setNick()">确认进入私有大厅</button>
  <div id="myInfo"></div>
</div>

<!-- 在线用户列表 -->
<div class="box">
  <h4>在线用户（点击名字连接）</h4>
  <div id="userList"></div>
</div>

<!-- 聊天区域 -->
<div class="box">
  <h4>聊天窗口</h4>
  <div id="chatLog"></div>
  <input id="chatInput" placeholder="输入消息">
  <button onclick="sendChat()">发送</button>
  <button onclick="closeConn()">断开连接</button>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ========== 专属私有池子ID ==========
const BASKET_NAME = "syc111syc-githubio-private-lobby-20261031";
const basketUrl = `https://peerbasket.bittu.dev/basket/${BASKET_NAME}`;

let peer = null;
let myPeerId = "";
let myNick = "";
let targetConn = null;
let refreshTimer = null;

const $ = s => document.querySelector(s);

function setNick(){
  myNick = $("#nameInput").value.trim();
  if(!myNick) return alert("名字不能为空");
  $("#nameInput").disabled = true;
  $("button[onclick='setNick()']").disabled = true;

  peer = new Peer();
  peer.on("open", (id)=>{
    myPeerId = id;
    $("#myInfo").innerText = `✅ 你的PeerID：${id}，昵称：${myNick}（私有大厅）`;
    refreshTimer = setInterval(updateLobby, 8000);
    updateLobby();
  });

  peer.on("connection", (conn)=>{
    bindConnection(conn);
  });

  peer.on("error", err=>{
    appendLog("Peer错误："+err, "sys");
  })
}

// 上报自己、拉取本私有池子的在线列表【加大量容错】
async function updateLobby(){
  if(!peer || !myPeerId) return;
  try{
    const res = await fetch(basketUrl,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({peer_id:myPeerId, meta:{nick:myNick}})
    })
    if(!res.ok) throw new Error("http状态码 "+res.status);
    const data = await res.json();
    if(!data || !Array.isArray(data.peers)){
      appendLog("大厅返回数据格式异常", "sys");
      return;
    }
    renderUserList(data.peers);
  }catch(e){
    // 不再疯狂刷屏报错，只偶尔打印
    console.warn("大厅刷新失败：", e);
    // appendLog("大厅刷新失败："+e, "sys");
  }
}

function renderUserList(peersArr){
  const wrap = $("#userList");
  wrap.innerHTML = "";
  for(const u of peersArr){
    // 核心判空！防止 u 是undefined
    if(!u || !u.peer_id) continue;
    if(u.peer_id === myPeerId) continue;
    const nick = (u.meta && u.meta.nick) ? u.meta.nick : "匿名玩家";
    const div = document.createElement("div");
    div.className = "user-item";
    div.innerText = `${nick} (${u.peer_id.slice(0,8)}...)`
    div.onclick = ()=>connectToUser(u.peer_id);
    wrap.appendChild(div);
  }
  if(wrap.innerHTML === "") wrap.innerHTML = "<i>暂无其他玩家在这个私有大厅</i>";
}

function connectToUser(remoteId){
  if(targetConn) return appendLog("⚠️ 你已经在一个聊天连接里了", "sys");
  appendLog(`尝试连接对方`, "sys");
  const conn = peer.connect(remoteId);
  bindConnection(conn);
}

function bindConnection(conn){
  targetConn = conn;
  conn.on("open",()=>{
    appendLog("✅ 连接成功！可以聊天", "sys");
  })
  conn.on("data", (msg)=>{
    if(msg.type === "chat"){
      appendLog(`【${msg.from}】${msg.content}`, "other");
    }
  })
  conn.on("close",()=>{
    appendLog("❌ 对方断开连接", "sys");
    targetConn = null;
  })
  conn.on("error",e=>{
    appendLog("连接失败："+e,"sys");
    targetConn = null;
  })
}

function sendChat(){
  const text = $("#chatInput").value.trim();
  if(!text || !targetConn || !targetConn.open){
    alert("还没有连上对方！");
    return;
  }
  targetConn.send({
    type:"chat",
    from:myNick,
    content:text
  })
  appendLog(`【我】${text}`, "me");
  $("#chatInput").value = "";
}

function closeConn(){
  if(targetConn){
    targetConn.close();
    targetConn = null;
    appendLog("✅ 已主动断开", "sys");
  }
}

function appendLog(text, cls="sys"){
  const log = $("#chatLog");
  const d = document.createElement("div");
  d.className = "msg "+cls;
  d.innerText = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

window.onbeforeunload = ()=>{
  if(refreshTimer) clearInterval(refreshTimer);
}
</script>
</body>
</html>
