<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>猫球串门大厅</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:900px;margin:16px auto;padding:0 12px;color:#303545}
.box{border:1px solid #ccc;padding:12px;border-radius:8px;margin:10px 0}
input{max-width:100%;padding:7px;border:1px solid #cbd1dc;border-radius:6px}
button{padding:7px 11px;border:0;border-radius:6px;background:#8fb0ff;color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
#userList{min-height:50px}
.user-item{padding:6px 8px;margin:4px 0;background:#f3f4f6;border-radius:6px;cursor:pointer}
.user-item:hover{background:#e5e7eb}
#chatLog{height:180px;overflow-y:auto;border:1px solid #aaa;padding:8px}
.msg{margin:4px 0;overflow-wrap:anywhere}
.me{color:#0066cc}.other{color:#222}.sys{color:#777}
.arena{position:relative;height:380px;overflow:hidden;border:2px solid #d5c6a4;border-radius:14px;background:linear-gradient(#e9f7ff 0 70%,#dff0cf 70%);margin:10px 0}
.arena-title{position:absolute;top:10px;left:0;width:100%;text-align:center;color:#596b80;font-size:13px}
.cat{position:absolute;bottom:22px;width:86px;height:72px;text-align:center;transition:left .85s ease;z-index:2}
.cat.local{left:25%}.cat.remote{left:75%;display:none}
.arena.room-active .cat.remote{display:block}
.cat img{display:block;width:72px;height:72px;margin:auto;object-fit:contain;animation:cat-hop .55s ease-in-out infinite alternate}
.cat-name{position:absolute;top:-34px;left:50%;display:inline-block;max-width:100%;overflow:hidden;padding:2px 8px;border-radius:99px;background:#fff;color:#58497d;font-size:12px;font-weight:700;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 1px 5px #0002;transform:translateX(-50%)}
@keyframes cat-hop{to{transform:translateY(-5px)}}
.cat-decoration{position:absolute;z-index:3;display:none;pointer-events:none}
.cat-decoration.active{display:block}
.cat-decoration svg{display:block;width:100%;height:100%}
.cat-sign{top:-4px;left:50%;padding:2px 8px;border:2px solid #fff;border-radius:8px;background:linear-gradient(110deg,#ff5577,#ffbf3f,#55d878,#4ab8ff,#b45cff,#ff5577);background-size:250% 100%;color:#fff;font-size:10px;font-weight:900;line-height:1.4;white-space:nowrap;transform:translateX(-50%);animation:sign-rainbow 2.4s linear infinite;text-shadow:0 1px 2px #0006}
@keyframes sign-rainbow{to{background-position:250% 0}}
.cat-ingot{top:-10px;left:50%;width:38px;height:30px;transform:translateX(-50%)}
.cat-scooter{left:8px;bottom:-3px;width:76px;height:30px}
.math-board{position:absolute;top:14px;left:50%;z-index:4;display:flex;width:min(420px,calc(100% - 24px));min-height:150px;padding:8px 12px;flex-direction:column;justify-content:center;align-items:stretch;gap:6px;border:4px solid #8a6a3f;border-radius:8px;background:radial-gradient(circle at 20% 30%,#ffffff10 0,transparent 40%),radial-gradient(circle at 80% 70%,#ffffff0d 0,transparent 40%),linear-gradient(135deg,#2c4a3a,#1e3628);box-shadow:0 3px 8px #0004,inset 0 0 26px #0005;color:#e8f2eb;font-family:"Comic Sans MS","PingFang SC","Microsoft YaHei",sans-serif;transform:translateX(-50%)}
.math-board-title{margin:0;text-align:center;font-size:13px}
.math-board-controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px}
.math-board select,.math-board input,.math-board button{min-height:30px;padding:4px 8px;border:1px solid #d3ddce;border-radius:5px;font:inherit}
.math-board input{width:125px;background:#f8fff8;color:#26382d;font-size:16px}
.math-board select{background:#f8fff8;color:#26382d}
.math-board button{background:#709878;color:#fff;cursor:pointer}
.math-board button:disabled{opacity:.55;cursor:not-allowed}
.math-question{min-height:24px;text-align:center;font-size:20px;font-weight:700;letter-spacing:.5px;text-shadow:0 0 4px #dcffe64d}
.math-progress-track{height:8px;overflow:hidden;border:1px solid #c1d5c2;border-radius:99px;background:#ffffff20}
.math-progress-fill{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#84d69a,#f8dc7d);transition:width .25s ease}
.math-board-meta,.math-player-status{display:flex;justify-content:space-between;gap:8px;font-size:11px;line-height:1.3}
.math-board-meta{color:#c4ddcb}
.math-player-status{padding-top:4px;border-top:1px solid #ffffff30;color:#eef8ee}
.math-player-status span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visit-sign{position:absolute;top:36px;left:50%;z-index:5;padding:6px 10px;border:2px solid #9a6b36;border-radius:6px;background:#ffe4a8;color:#704716;font-size:13px;font-weight:700;transform:translateX(-50%)}
[hidden]{display:none!important}
@media(max-width:520px){.arena{height:390px}.cat.local{left:18%}.cat.remote{left:82%}.math-board{top:12px;min-height:174px;padding:7px 8px}.math-question{font-size:18px}}
</style>
</head>
<body>
<h2>猫球串门大厅</h2>
<div class="box">
  <label for="nameInput">玩家昵称：</label>
  <input id="nameInput" maxlength="24" placeholder="输入名字" value="玩家">
  <button id="enterButton" type="button" onclick="setNick()">进入大厅</button>
  <div id="myInfo" aria-live="polite"></div>
</div>
<div class="box">
  <h3>在线玩家（点击连接）</h3>
  <div id="lobbyStatus" role="status" aria-live="polite">联机大厅使用 GoEasy 国内 WebSocket 中继；站点管理员需在 connect.html 配置 Common Key。</div>
  <div id="userList">请先进入大厅</div>
</div>
<div class="box">
  <h3>猫球活动室</h3>
  <div id="roomStatus" aria-live="polite">连接一位玩家后，可以邀请对方的猫球来串门。</div>
  <div class="arena" id="arena">
    <div class="arena-title">猫球活动室</div>
    <div class="visit-sign" id="visitSign" hidden>我的猫球正在串门</div>
    <div class="cat local" id="localCat">
      <span class="cat-name" id="localCatName">猫球</span>
      <div id="localCosmetic"></div>
      <img src="images/catball.png" alt="">
    </div>
    <div class="cat remote" id="remoteCat">
      <span class="cat-name" id="remoteCatName">朋友的猫球</span>
      <div id="remoteCosmetic"></div>
      <img src="images/catball.png" alt="">
    </div>
    <div class="math-board" id="mathBoard" aria-label="数学比赛">
      <h4 class="math-board-title">📋 数学比赛</h4>
      <div class="math-board-controls" id="mathSetup">
        <select id="mathQuestionCount" aria-label="每轮题数">
          <option value="3">3题 · +4积分</option>
          <option value="5">5题 · +6积分</option>
          <option value="8">8题 · +11积分</option>
          <option value="15">15题 · +18积分</option>
          <option value="20">20题 · +22积分</option>
        </select>
        <button id="startMathButton" type="button" disabled>开始</button>
      </div>
      <div class="math-question" id="mathQuestion" aria-live="polite">串门成功后开始比赛</div>
      <div class="math-board-controls" id="mathAnswerControls" hidden>
        <input id="mathAnswer" type="number" inputmode="numeric" placeholder="填入答案" disabled>
        <button id="submitMathAnswer" type="button" disabled>提交</button>
      </div>
      <div class="math-progress-track" role="progressbar" aria-label="比赛题目进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="math-progress-fill" id="mathProgressFill"></div>
      </div>
      <div class="math-board-meta"><span id="mathProgressText">等待串门连接</span><span id="mathTimer">--:--</span></div>
      <div class="math-player-status"><span id="localPlayerStatus">你：未开始</span><span id="remotePlayerStatus">对方：未开始</span></div>
      <div class="math-board-meta" id="mathScores"></div>
      <div class="math-board-meta" id="mathStatus" aria-live="polite">每题先答对得 2 分，后答对得 1 分，答错得 0 分。</div>
    </div>
  </div>
  <button id="inviteButton" type="button" hidden>邀请对方猫球来玩</button>
</div>
<div class="box">
  <h3>聊天窗口</h3>
  <div id="chatLog" aria-live="polite"></div>
  <input id="chatInput" placeholder="输入消息">
  <button onclick="sendChat()">发送</button>
  <button onclick="closeConn()">断开连接</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/goeasy-lite@2.13.24/goeasy-lite.min.js"></script>
<script>
const GOEASY_COMMON_KEY = "BC-98335ad497924a1e9b8d730919ae0472";
const GOEASY_HOST = "hangzhou.goeasy.io";
const LOBBY_CHANNEL = "catball-lobby-syc111syc-githubio-v1";
const INBOX_CHANNEL_PREFIX = "catball-inbox-";
const ECONOMY_KEY = "catball_economy_v1";
const CAT_NAME_KEY = "catball_pet_name_v1";
const PET_VISIT_KEY = "catball_pet_visit_v1";
const MATH_PRIZES = { 3: 4, 5: 6, 8: 11, 15: 18, 20: 22 };
const MATH_QUESTION_SECONDS = 20;
const $ = selector => document.querySelector(selector);

function getGoEasyCommonKey() {
  return window.CATBALL_GO_EASY_COMMON_KEY || GOEASY_COMMON_KEY;
}

let goeasy = null;
let goeasyConnected = false;
let myPeerId = "";
let myNick = "";
let myCatName = "猫球";
let remoteNick = "玩家";
let remoteCatName = "朋友的猫球";
let targetConn = null;
let connectionTimer = null;
const onlinePeers = new Map();
let visitHeartbeat = null;
let inviteTimer = null;
let visitRole = "";
let pendingInvite = false;
let pendingInviteId = "";
let visitInviteId = "";
let mathGame = null;
let paidMathGames = new Set();

function readStorage(key) {
  try {
    return localStorage.getItem(key);
  } catch (error) {
    console.error(`无法读取本地数据（${key}）：`, error);
    return null;
  }
}

function writeStorage(key, value) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch (error) {
    console.error(`无法保存本地数据（${key}）：`, error);
    return false;
  }
}

function getEquippedCosmetic() {
  try {
    const data = JSON.parse(readStorage(ECONOMY_KEY) || "{}");
    const inventory = data.inventory || {};
    const equipped = inventory.equipped;
    return ["sign", "scooter", "ingot"].includes(equipped) &&
      Number.isFinite(inventory[`${equipped}Until`]) &&
      inventory[`${equipped}Until`] > Date.now() ? equipped : "";
  } catch (error) {
    console.warn("无法读取猫球装扮：", error);
    return "";
  }
}

function renderCosmetic(element, cosmetic) {
  const decorations = {
    sign: {
      className: "cat-decoration cat-sign active",
      markup: "最帅猫球"
    },
    ingot: {
      className: "cat-decoration cat-ingot active",
      markup: '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="m5 23 5-12h20l5 12-5 11H10L5 23Z" fill="#f6bd35" stroke="#a76b13" stroke-width="2"/><path d="m10 11 5 8h10l5-8M15 19l-5 15m15-15 5 15M15 19h10" fill="none" stroke="#ffe98b" stroke-width="2"/></svg>'
    },
    scooter: {
      className: "cat-decoration cat-scooter active",
      markup: '<svg viewBox="0 0 80 32" aria-hidden="true"><circle cx="13" cy="25" r="5" fill="#7655a8"/><circle cx="65" cy="25" r="5" fill="#7655a8"/><path d="M13 23h43l-13-14H31m12 0h15l10 14m-10-14V3" fill="none" stroke="#65a8d7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M31 9h12" stroke="#ff9d55" stroke-width="4" stroke-linecap="round"/></svg>'
    }
  };
  const decoration = decorations[cosmetic];
  element.className = decoration ? decoration.className : "";
  element.innerHTML = decoration ? decoration.markup : "";
}

function updateCosmetics() {
  renderCosmetic($("#localCosmetic"), getEquippedCosmetic());
}

function syncCosmetic() {
  updateCosmetics();
  if (targetConn && targetConn.open) {
    sendData({ type: "cosmetic", cosmetic: getEquippedCosmetic() });
  }
}

function loadCatName() {
  myCatName = (readStorage(CAT_NAME_KEY) || "").trim().slice(0, 16) || "猫球";
  $("#localCatName").textContent = myCatName;
  if (targetConn && targetConn.open) {
    sendData({ type: "catName", name: myCatName });
  }
}

function appendLog(text, cls = "sys") {
  const log = $("#chatLog");
  const entry = document.createElement("div");
  entry.className = `msg ${cls}`;
  entry.textContent = text;
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

function sendData(data) {
  if (!goeasyConnected || !targetConn || !targetConn.open ||
      !onlinePeers.has(targetConn.peer)) return false;
  const targetId = targetConn.peer;
  sendToPeer(targetId, data).catch(error => {
    appendLog(`发送失败：${error.message || error}`, "sys");
    if (error.code === "peer_not_found") removeOnlinePeer(targetId);
  });
  return true;
}

function sendToPeer(peerId, data) {
  if (!goeasy || !goeasyConnected) {
    return Promise.reject(new Error("GoEasy 中继服务未连接"));
  }
  return new Promise((resolve, reject) => {
    goeasy.pubsub.publish({
      channel: `${INBOX_CHANNEL_PREFIX}${peerId}`,
      message: JSON.stringify({ from: myPeerId, to: peerId, data }),
      onSuccess: resolve,
      onFailed: reject
    });
  });
}

function setRoomStatus(text) {
  $("#roomStatus").textContent = text;
}

function mathRoomReady() {
  return Boolean(targetConn && targetConn.open && visitRole);
}

function updateRoom() {
  const active = Boolean(visitRole && targetConn && targetConn.open);
  $("#arena").classList.toggle("room-active", active);
  $("#remoteCatName").textContent = remoteCatName;
  $("#inviteButton").hidden = !targetConn || !targetConn.open || active || pendingInvite;
  $("#visitSign").hidden = !(active && visitRole === "visitor");
  $("#startMathButton").disabled = !active || Boolean(mathGame);
  $("#mathSetup").hidden = !active || Boolean(mathGame);
  $("#mathAnswerControls").hidden = !mathGame;
  $("#mathAnswer").disabled = !active || !mathGame ||
    mathGame.correctPlayers.has(myPeerId) || mathGame.finished || mathGame.deadline <= Date.now();
  $("#submitMathAnswer").disabled = $("#mathAnswer").disabled;
  if (!active && !mathGame) {
    $("#mathProgressText").textContent = "等待串门连接";
    $("#mathTimer").textContent = "--:--";
  }
}

function setVisitMarker() {
  const marker = {
    sessionId: myPeerId,
    peerId: targetConn ? targetConn.peer : "",
    catName: myCatName,
    updatedAt: Date.now()
  };
  if (!writeStorage(PET_VISIT_KEY, JSON.stringify(marker))) return false;
  return true;
}

function startVisiting() {
  if (!setVisitMarker()) return false;
  visitRole = "visitor";
  clearInterval(visitHeartbeat);
  visitHeartbeat = setInterval(setVisitMarker, 2000);
  updateRoom();
  setRoomStatus(`${myCatName}去串门了！对方断开后就会回家。`);
  return true;
}

function stopVisiting() {
  clearInterval(visitHeartbeat);
  clearTimeout(inviteTimer);
  visitHeartbeat = null;
  inviteTimer = null;
  if (visitRole === "visitor") {
    try {
      const marker = JSON.parse(readStorage(PET_VISIT_KEY) || "null");
      if (marker && marker.sessionId === myPeerId) localStorage.removeItem(PET_VISIT_KEY);
    } catch (error) {
      console.error("无法清除猫球串门状态：", error);
    }
  }
  visitRole = "";
  pendingInvite = false;
  pendingInviteId = "";
  visitInviteId = "";
  if (mathGame) cancelMathGame("串门结束，比赛已取消。");
  updateRoom();
}

function renderUserList() {
  const wrap = $("#userList");
  wrap.replaceChildren();
  let count = 0;
  for (const [peerId, player] of onlinePeers) {
    if (!peerId || peerId === myPeerId) continue;
    const item = document.createElement("button");
    item.type = "button";
    item.className = "user-item";
    item.textContent = `${player.nick || "玩家"} (${peerId.slice(0, 8)}…)`;
    item.addEventListener("click", () => connectToUser(peerId));
    wrap.appendChild(item);
    count++;
  }
  if (!count) wrap.textContent = "暂无其他玩家在线";
}

function announceTo(peerId) {
  sendToPeer(peerId, {
    type: "hello",
    nick: myNick,
    catName: myCatName,
    cosmetic: getEquippedCosmetic()
  }).catch(error => {
    if (error.code === "peer_not_found") removeOnlinePeer(peerId);
    else console.error("无法发送玩家信息：", error);
  });
}

function goEasyErrorMessage(error) {
  return error && (error.content || error.message) || String(error);
}

function goEasyOperation(start) {
  return new Promise((resolve, reject) => {
    start({
      onSuccess: resolve,
      onFailed: error => reject(new Error(
        `GoEasy ${error.code ? `(${error.code}) ` : ""}${goEasyErrorMessage(error)}`
      ))
    });
  });
}

function removeOnlinePeer(peerId) {
  onlinePeers.delete(peerId);
  renderUserList();
  if (!targetConn || targetConn.peer !== peerId) return;
  clearTimeout(connectionTimer);
  connectionTimer = null;
  stopVisiting();
  targetConn = null;
  remoteNick = "玩家";
  remoteCatName = "朋友的猫球";
  updateRoom();
  setRoomStatus("对方已离线，已断开中继连接。");
  appendLog("对方已离线，猫球回家了。", "sys");
}

function addOnlineMember(member) {
  if (!member || typeof member.id !== "string" || !member.id || member.id === myPeerId) return;
  const data = member.data || {};
  onlinePeers.set(member.id, {
    nick: typeof data.nickname === "string" ? data.nickname.slice(0, 24) : "玩家",
    catName: typeof data.catName === "string" ? data.catName.slice(0, 16) : "猫球",
    cosmetic: ["sign", "scooter", "ingot"].includes(data.cosmetic) ? data.cosmetic : ""
  });
  announceTo(member.id);
}

function handlePresence(event) {
  if (!event) return;
  if (event.action === "join") {
    addOnlineMember(event.member);
  } else if (event.action === "leave" && event.member && typeof event.member.id === "string") {
    removeOnlinePeer(event.member.id);
  }
  renderUserList();
  $("#lobbyStatus").textContent = `GoEasy 国内中继已连接 · ${onlinePeers.size} 位玩家在线`;
}

function onDirectMessage(message) {
  let envelope;
  try {
    envelope = typeof message.content === "string"
      ? JSON.parse(message.content)
      : message.content;
  } catch (error) {
    console.warn("忽略无法解析的中继消息：", error);
    return;
  }
  if (!envelope || envelope.to !== myPeerId || typeof envelope.from !== "string" ||
      !onlinePeers.has(envelope.from)) return;
  const { from, data } = envelope;
  if (data && data.type === "hello") {
    const player = onlinePeers.get(from);
    player.nick = typeof data.nick === "string" ? data.nick.slice(0, 24) : "玩家";
    player.catName = typeof data.catName === "string" ? data.catName.slice(0, 16) : "猫球";
    player.cosmetic = ["sign", "scooter", "ingot"].includes(data.cosmetic) ? data.cosmetic : "";
    renderUserList();
    if (targetConn && targetConn.peer === from) {
      remoteNick = player.nick;
      remoteCatName = player.catName || "猫球";
      renderCosmetic($("#remoteCosmetic"), player.cosmetic);
      updateRoom();
    }
  }
  if (!data || typeof data.type !== "string") return;
  if (data.type === "connectRequest") {
    handleConnectRequest(from, data);
  } else if (data.type === "connectAccepted") {
    if (!targetConn || targetConn.peer !== from) return;
    clearTimeout(connectionTimer);
    connectionTimer = null;
    targetConn.open = true;
    remoteNick = typeof data.nick === "string" ? data.nick.slice(0, 24) : remoteNick;
    remoteCatName = typeof data.catName === "string" ? data.catName.slice(0, 16) || "猫球" : remoteCatName;
    const player = onlinePeers.get(from);
    if (player) player.cosmetic = ["sign", "scooter", "ingot"].includes(data.cosmetic) ? data.cosmetic : "";
    renderCosmetic($("#remoteCosmetic"), player ? player.cosmetic : "");
    updateRoom();
    setRoomStatus(`已通过 GoEasy 连接到 ${remoteNick}。`);
    appendLog("GoEasy 中继连接成功！可以聊天或邀请猫球串门。", "sys");
  } else if (data.type === "connectRejected") {
    if (!targetConn || targetConn.peer !== from) return;
    clearTimeout(connectionTimer);
    connectionTimer = null;
    targetConn = null;
    updateRoom();
    setRoomStatus(data.reason || "对方暂时无法连接，请稍后重试。");
  } else if (data.type === "disconnect") {
    if (!targetConn || targetConn.peer !== from) return;
    clearTimeout(connectionTimer);
    connectionTimer = null;
    targetConn = null;
    stopVisiting();
    remoteNick = "玩家";
    remoteCatName = "朋友的猫球";
    updateRoom();
    setRoomStatus("对方已断开 GoEasy 中继连接。");
    appendLog("对方已断开连接，猫球回家了。", "sys");
  } else if (data.type === "cosmetic") {
    if (targetConn && targetConn.peer === from) {
      renderCosmetic($("#remoteCosmetic"),
        ["sign", "scooter", "ingot"].includes(data.cosmetic) ? data.cosmetic : "");
    }
  } else if (data.type === "mathStart") {
    receiveMathStart(from, data);
  } else if (data.type === "mathStartRejected") {
    if (mathGame && mathGame.id === data.gameId && mathGame.host) {
      cancelMathGame(data.reason || "对方无法开始比赛。");
    }
  } else if (data.type === "mathQuestion") {
    receiveMathQuestion(from, data);
  } else if (data.type === "mathAnswer") {
    receiveMathAnswer(from, data);
  } else if (data.type === "mathPlayerStatus") {
    receiveMathPlayerStatus(from, data);
  } else if (data.type === "mathJudgement") {
    receiveMathJudgement(from, data);
  } else if (data.type === "mathWrong") {
    if (mathGame && mathGame.id === data.gameId && data.playerId === myPeerId) {
      $("#mathStatus").textContent = "答错了，本题暂时没有得分，还可以再试。";
      $("#mathAnswer").value = "";
      $("#mathAnswer").focus();
    }
  } else if (data.type === "mathFinish") {
    receiveMathFinish(from, data);
  } else if (targetConn && targetConn.peer === from && targetConn.open) {
    handleData(data);
  }
}

async function setNick() {
  myNick = $("#nameInput").value.trim();
  if (!myNick) {
    alert("名字不能为空");
    return;
  }
  const GoEasy = window.GoEasy;
  const appKey = getGoEasyCommonKey();
  if (!GoEasy || typeof GoEasy.getInstance !== "function") {
    $("#lobbyStatus").textContent = "GoEasy 组件加载失败，请检查网络后刷新页面。";
    appendLog("GoEasy WebSocket SDK 加载失败，请检查网络后刷新页面。", "sys");
    return;
  }
  if (!appKey || appKey === "BC-REPLACE_ME") {
    $("#lobbyStatus").textContent = "尚未配置 GoEasy 服务。请在 connect.html 中填写 GoEasy Common Key。";
    appendLog("需要先在 GoEasy 控制台创建杭州区域应用，并将 Common Key 填入 connect.html。", "sys");
    return;
  }
  $("#nameInput").disabled = true;
  $("#enterButton").disabled = true;
  $("#lobbyStatus").textContent = "正在连接 GoEasy 国内中继……";
  loadCatName();
  try {
    const activeClient = GoEasy.getInstance({
      host: GOEASY_HOST,
      appkey: appKey,
      modules: ["pubsub"]
    });
    goeasy = activeClient;
    onlinePeers.clear();
    myPeerId = `catball-${crypto.randomUUID()}`;
    $("#myInfo").textContent = `正在进入大厅：${myNick}`;
    await goEasyOperation(callbacks => activeClient.connect({
      id: myPeerId,
      data: { nickname: myNick, catName: myCatName, cosmetic: getEquippedCosmetic() },
      onProgress: () => {
        goeasyConnected = false;
        $("#lobbyStatus").textContent = "GoEasy 正在连接或自动重连……";
      },
      ...callbacks
    }));
    goeasyConnected = true;
    $("#myInfo").textContent = `已进入大厅：${myNick}（${myPeerId}）`;
    await new Promise((resolve, reject) => {
      activeClient.pubsub.subscribe({
        channel: LOBBY_CHANNEL,
        presence: { enable: true },
        onMessage: () => {},
        onSuccess: resolve,
        onFailed: error => reject(new Error(
          `大厅订阅失败${error.code ? `（${error.code}）` : ""}：${goEasyErrorMessage(error)}`
        ))
      });
    });
    await new Promise((resolve, reject) => {
      activeClient.pubsub.subscribe({
        channel: `${INBOX_CHANNEL_PREFIX}${myPeerId}`,
        onMessage: onDirectMessage,
        onSuccess: resolve,
        onFailed: error => reject(new Error(
          `消息中继订阅失败${error.code ? `（${error.code}）` : ""}：${goEasyErrorMessage(error)}`
        ))
      });
    });
    await new Promise((resolve, reject) => {
      activeClient.pubsub.subscribePresence({
        channel: LOBBY_CHANNEL,
        onPresence: handlePresence,
        onSuccess: resolve,
        onFailed: error => reject(new Error(
          `在线列表订阅失败${error.code ? `（${error.code}）` : ""}：${goEasyErrorMessage(error)}`
        ))
      });
    });
    await new Promise((resolve, reject) => {
      activeClient.pubsub.hereNow({
        channel: LOBBY_CHANNEL,
        limit: 100,
        onSuccess: response => {
          const members = response && response.content && response.content.members;
          if (!Array.isArray(members)) {
            reject(new Error("GoEasy 在线成员数据格式异常"));
            return;
          }
          members.forEach(addOnlineMember);
          renderUserList();
          $("#lobbyStatus").textContent = `GoEasy 国内中继已连接 · ${onlinePeers.size} 位玩家在线`;
          resolve();
        },
        onFailed: error => reject(new Error(
          `在线成员查询失败${error.code ? `（${error.code}）` : ""}：${goEasyErrorMessage(error)}`
        ))
      });
    });
  } catch (error) {
    if (goeasy) {
      const failedClient = goeasy;
      goeasy = null;
      goeasyConnected = false;
      try {
        failedClient.disconnect({});
      } catch (closeError) {
        console.error("关闭失败的 GoEasy 连接时出错：", closeError);
      }
    }
    myPeerId = "";
    onlinePeers.clear();
    $("#nameInput").disabled = false;
    $("#enterButton").disabled = false;
    $("#lobbyStatus").textContent = `无法进入 GoEasy 大厅：${error.message || error}`;
    appendLog(`无法进入 GoEasy 大厅：${error.message || error}`, "sys");
  }
}

function connectToUser(remoteId) {
  if (!goeasyConnected || !myPeerId || !onlinePeers.has(remoteId)) return;
  if (targetConn && targetConn.peer !== remoteId) {
    appendLog("请先断开当前连接。", "sys");
    return;
  }
  if (targetConn && targetConn.peer === remoteId && targetConn.open) {
    setRoomStatus(`已通过 GoEasy 连接到 ${remoteNick}。`);
    return;
  }
  if (targetConn && targetConn.peer === remoteId) {
    setRoomStatus(`正在等待 ${remoteNick} 确认 GoEasy 连接……`);
    return;
  }
  const player = onlinePeers.get(remoteId);
  remoteNick = player.nick || "玩家";
  remoteCatName = player.catName || "朋友的猫球";
  renderCosmetic($("#remoteCosmetic"), player.cosmetic);
  const selection = { peer: remoteId, open: false };
  targetConn = selection;
  updateRoom();
  setRoomStatus(`正在通过 GoEasy 连接到 ${remoteNick}……`);
  connectionTimer = setTimeout(() => {
    if (targetConn !== selection || selection.open) return;
    connectionTimer = null;
    targetConn = null;
    updateRoom();
    setRoomStatus("等待对方确认连接超时，请重试。");
  }, 15000);
  sendToPeer(remoteId, {
    type: "connectRequest",
    nick: myNick,
    catName: myCatName,
    cosmetic: getEquippedCosmetic()
  }).catch(error => {
    if (targetConn !== selection) return;
    clearTimeout(connectionTimer);
    connectionTimer = null;
    targetConn = null;
    updateRoom();
    setRoomStatus(`GoEasy 连接失败：${error.message || error}。请刷新大厅后重试。`);
    appendLog(`GoEasy 连接失败：${error.message || error}`, "sys");
  });
}

function handleConnectRequest(from, data) {
  if (!onlinePeers.has(from)) return;
  const remoteName = typeof data.nick === "string" ? data.nick.slice(0, 24) : "玩家";
  if (targetConn && targetConn.peer !== from) {
    sendToPeer(from, {
      type: "connectRejected",
      reason: `${myNick} 正在和其他玩家连接，请稍后再试。`
    }).catch(error => console.error("无法回复 GoEasy 连接请求：", error));
    return;
  }
  clearTimeout(connectionTimer);
  connectionTimer = null;
  if (!targetConn) targetConn = { peer: from, open: true };
  else targetConn.open = true;
  remoteNick = remoteName;
  remoteCatName = typeof data.catName === "string" ? data.catName.slice(0, 16) || "猫球" : "朋友的猫球";
  const player = onlinePeers.get(from);
  if (player) player.cosmetic = ["sign", "scooter", "ingot"].includes(data.cosmetic) ? data.cosmetic : "";
  renderCosmetic($("#remoteCosmetic"), player ? player.cosmetic : "");
  updateRoom();
  setRoomStatus(`已通过 GoEasy 连接到 ${remoteNick}。`);
  appendLog(`${remoteNick} 已连接。`, "sys");
  sendToPeer(from, {
    type: "connectAccepted",
    nick: myNick,
    catName: myCatName,
    cosmetic: getEquippedCosmetic()
  }).catch(error => {
    if (targetConn && targetConn.peer === from) removeOnlinePeer(from);
    console.error("无法确认中继连接：", error);
  });
}

function handleInviteRequest(data) {
  const inviteId = typeof data.id === "string" ? data.id : "";
  if (!inviteId || inviteId.length > 100) return;
  if (visitRole || pendingInvite) {
    sendData({ type: "inviteResponse", id: inviteId, accepted: false, reason: "猫球正在串门或邀请中" });
    return;
  }
  pendingInvite = true;
  pendingInviteId = inviteId;
  updateRoom();
  const accepted = confirm(`${data.nick || remoteNick} 邀请你的猫球「${myCatName}」去串门。接受吗？`);
  if (!accepted) {
    pendingInvite = false;
    pendingInviteId = "";
    sendData({ type: "inviteResponse", id: inviteId, accepted: false });
    updateRoom();
    setRoomStatus("你暂时拒绝了串门邀请。");
    return;
  }
  if (!startVisiting()) {
    pendingInvite = false;
    pendingInviteId = "";
    sendData({ type: "inviteResponse", id: inviteId, accepted: false, reason: "无法保存串门状态" });
    updateRoom();
    appendLog("无法保存串门状态；请检查浏览器的本地存储权限。", "sys");
    return;
  }
  pendingInvite = false;
  pendingInviteId = "";
  visitInviteId = inviteId;
  if (!sendData({ type: "inviteResponse", id: inviteId, accepted: true, catName: myCatName })) {
    stopVisiting();
    appendLog("邀请回复发送失败，猫球没有离开。", "sys");
    return;
  }
  appendLog(`${myCatName}出门串门啦！`, "sys");
}

function handleData(data) {
  if (!data || typeof data !== "object" || typeof data.type !== "string") return;
  if (data.type === "hello") {
    remoteNick = typeof data.nick === "string" ? data.nick.slice(0, 24) : "玩家";
    if (typeof data.catName === "string") remoteCatName = data.catName.slice(0, 16) || "猫球";
    const player = onlinePeers.get(targetConn.peer);
    if (player) {
      player.cosmetic = ["sign", "scooter", "ingot"].includes(data.cosmetic) ? data.cosmetic : "";
      renderCosmetic($("#remoteCosmetic"), player.cosmetic);
    }
    updateRoom();
  } else if (data.type === "catName") {
    if (typeof data.name === "string") {
      remoteCatName = data.name.slice(0, 16) || "猫球";
      updateRoom();
    }
  } else if (data.type === "chat") {
    if (typeof data.content === "string") appendLog(`【${remoteNick}】${data.content.slice(0, 1000)}`, "other");
  } else if (data.type === "catInvite") {
    handleInviteRequest(data);
  } else if (data.type === "inviteResponse") {
    if (!pendingInvite || data.id !== pendingInviteId) {
      if (data.accepted === true && typeof data.id === "string") {
        sendData({ type: "inviteCancel", id: data.id });
      }
      return;
    }
    clearTimeout(inviteTimer);
    inviteTimer = null;
    pendingInvite = false;
    pendingInviteId = "";
    if (data.accepted === true && typeof data.catName === "string") {
      remoteCatName = data.catName.slice(0, 16) || "猫球";
      visitRole = "host";
      visitInviteId = data.id;
      updateRoom();
      setRoomStatus(`${remoteCatName}来串门啦！两只猫球现在可以一起玩。`);
      appendLog(`${remoteCatName}接受了串门邀请！`, "sys");
    } else {
      if (data.accepted === true) sendData({ type: "inviteCancel", id: data.id });
      updateRoom();
      setRoomStatus(data.reason ? `邀请未能完成：${data.reason}` : "对方暂时没有接受邀请。");
    }
  } else if (data.type === "inviteCancel") {
    if (visitRole === "visitor" && data.id === visitInviteId) {
      stopVisiting();
      appendLog("串门邀请已过期，猫球回家了。", "sys");
      setRoomStatus("串门邀请已过期，猫球回家了。");
    }
  }
}

function inviteCat() {

}

function randomOperand() {
  return Math.floor(Math.random() * 1000);
}

function makeMathQuestion() {
  const operators = ["+", "-", "*", "/"];
  const operator = operators[Math.floor(Math.random() * operators.length)];
  let a = randomOperand();
  let b = randomOperand();
  if (operator === "-" && a < b) [a, b] = [b, a];
  if (operator === "/") {
    b = 1 + Math.floor(Math.random() * 31);
    const quotient = 1 + Math.floor(Math.random() * Math.floor(999 / b));
    a = b * quotient;
  }
  const answer = operator === "+" ? a + b
    : operator === "-" ? a - b
      : operator === "*" ? a * b
        : a / b;
  return { a, b, operator, answer };
}

function isValidMathQuestion(question) {
  if (!question || !Number.isInteger(question.a) || question.a < 0 || question.a > 999 ||
      !Number.isInteger(question.b) || question.b < 0 || question.b > 999 ||
      !["+", "-", "*", "/"].includes(question.operator) ||
      !Number.isSafeInteger(question.answer)) return false;
  if (question.operator === "/" && question.b === 0) return false;
  const expected = question.operator === "+" ? question.a + question.b
    : question.operator === "-" ? question.a - question.b
      : question.operator === "*" ? question.a * question.b
        : question.a / question.b;
  return Number.isInteger(expected) && expected === question.answer;
}

function renderMathRound() {
  if (!mathGame) return;
  const question = mathGame.questions[mathGame.index];
  $("#mathQuestion").textContent = `第 ${mathGame.index + 1}/${mathGame.questions.length} 题：${question.a} ${question.operator} ${question.b} = ?`;
  $("#mathScores").textContent =
    `${myNick}：${mathGame.scores[myPeerId]} 分　${remoteNick}：${mathGame.scores[targetConn.peer]} 分`;
  renderMathProgress();
  $("#mathAnswer").value = "";
  $("#mathAnswer").disabled = mathGame.correctPlayers.has(myPeerId);
  $("#submitMathAnswer").disabled = $("#mathAnswer").disabled;
  updateRoom();
}

function createMathGame() {
  if (!mathRoomReady() || mathGame) return;
  const count = Number($("#mathQuestionCount").value);
  const prize = MATH_PRIZES[count];
  if (!prize) return;
  const id = `${myPeerId}:${crypto.randomUUID()}`;
  const questions = Array.from({ length: count }, makeMathQuestion);
  mathGame = {
    id,
    host: true,
    hostId: myPeerId,
    questions,
    prize,
    scores: { [myPeerId]: 0, [targetConn.peer]: 0 },
    index: 0,
    firstCorrectId: "",
    correctPlayers: new Set(),
    playerStatus: { [myPeerId]: "答题中", [targetConn.peer]: "答题中" },
    questionTimer: null,
    timerInterval: null,
    advanceTimer: null,
    advancing: false
  };
  const startedAt = Date.now();
  if (!sendData({ type: "mathStart", gameId: id, questions, prize, startedAt })) {
    cancelMathGame("比赛开始消息发送失败，请重试。");
    return;
  }
  beginMathQuestion(0, startedAt);
  appendLog(`数学比赛开始：${count} 题，赢家获得 ${prize} 积分。`, "sys");
}

function receiveMathStart(from, data) {
  if (!targetConn || targetConn.peer !== from || !mathRoomReady() ||
      typeof data.gameId !== "string" || data.gameId.length > 100 ||
      !Array.isArray(data.questions) ||
      ![3, 5, 8, 15, 20].includes(data.questions.length) ||
      MATH_PRIZES[data.questions.length] !== data.prize ||
      !Number.isFinite(data.startedAt) ||
      data.questions.some(question => !isValidMathQuestion(question))) return;
  if (mathGame) {
    if (mathGame.id === data.gameId) return;
    sendData({
      type: "mathStartRejected",
      gameId: data.gameId,
      reason: "对方正在进行另一场比赛。"
    });
    return;
  }
  mathGame = {
    id: data.gameId,
    host: false,
    hostId: from,
    questions: data.questions,
    prize: data.prize,
    scores: { [myPeerId]: 0, [from]: 0 },
    index: 0,
    firstCorrectId: "",
    correctPlayers: new Set(),
    playerStatus: { [myPeerId]: "答题中", [from]: "答题中" },
    questionTimer: null,
    timerInterval: null,
    advanceTimer: null,
    advancing: false
  };
  beginMathQuestion(0, data.startedAt);
  appendLog(`收到数学比赛邀请：${data.questions.length} 题，赢家获得 ${data.prize} 积分。`, "sys");
}

function beginMathQuestion(index, startedAt = Date.now()) {
  if (!mathGame || index < 0 || index >= mathGame.questions.length) return;
  clearTimeout(mathGame.questionTimer);
  clearInterval(mathGame.timerInterval);
  clearTimeout(mathGame.advanceTimer);
  mathGame.index = index;
  mathGame.startedAt = startedAt;
  mathGame.deadline = startedAt + MATH_QUESTION_SECONDS * 1000;
  mathGame.firstCorrectId = "";
  mathGame.correctPlayers.clear();
  mathGame.playerStatus[myPeerId] = "答题中";
  mathGame.playerStatus[targetConn.peer] = "答题中";
  mathGame.advancing = false;
  renderMathRound();
  $("#mathStatus").textContent = `本题限时 ${MATH_QUESTION_SECONDS} 秒。先答对得 2 分，后答对得 1 分，答错得 0 分。`;
  updateMathTimer();
  mathGame.timerInterval = setInterval(updateMathTimer, 200);
  if (mathGame.host) {
    mathGame.questionTimer = setTimeout(
      advanceMathQuestion,
      Math.max(0, mathGame.deadline - Date.now())
    );
  }
}

function updateMathTimer() {
  if (!mathGame || mathGame.finished) return;
  const seconds = Math.max(0, Math.ceil((mathGame.deadline - Date.now()) / 1000));
  $("#mathTimer").textContent = `00:${String(seconds).padStart(2, "0")}`;
}

function renderMathProgress() {
  if (!mathGame) return;
  const total = mathGame.questions.length;
  const percent = Math.floor(((mathGame.index + (mathGame.advancing ? 1 : 0)) / total) * 100);
  const track = $(".math-progress-track");
  $("#mathProgressFill").style.width = `${percent}%`;
  track.setAttribute("aria-valuenow", String(percent));
  $("#mathProgressText").textContent = `第 ${mathGame.index + 1} / ${total} 题`;
  $("#localPlayerStatus").textContent = `你：${mathGame.playerStatus[myPeerId]}`;
  $("#remotePlayerStatus").textContent =
    `${remoteNick}：${mathGame.playerStatus[targetConn.peer]}`;
}

function setMathPlayerStatus(playerId, status, notifyPeer = false) {
  if (!mathGame || !["答题中", "已提交", "答错，继续答题", "已答对"].includes(status)) return;
  mathGame.playerStatus[playerId] = status;
  renderMathProgress();
  if (notifyPeer) {
    sendData({ type: "mathPlayerStatus", gameId: mathGame.id, playerId, status });
  }
}

function submitMathAnswer() {
  if (!mathGame || mathGame.correctPlayers.has(myPeerId) ||
      !mathRoomReady()) return;
  const answer = Number($("#mathAnswer").value);
  if (!Number.isSafeInteger(answer) || $("#mathAnswer").value.trim() === "") {
    $("#mathStatus").textContent = "请输入整数答案。";
    return;
  }
  const message = {
    type: "mathAnswer",
    gameId: mathGame.id,
    index: mathGame.index,
    answer
  };
  if (mathGame.host) {
    processMathAnswer(myPeerId, message);
  } else if (sendData(message)) {
    $("#mathStatus").textContent = "答案已提交，等待裁定……";
  }
  if (!mathGame.host && !mathGame.correctPlayers.has(myPeerId)) {
    setMathPlayerStatus(myPeerId, "已提交", true);
  }
}

function receiveMathAnswer(from, data) {
  if (!mathGame || !mathGame.host || !targetConn || targetConn.peer !== from) return;
  processMathAnswer(from, data);
}

function processMathAnswer(playerId, data) {
  if (!mathGame || !mathGame.host || mathGame.advancing ||
      Date.now() >= mathGame.deadline ||
      data.gameId !== mathGame.id || data.index !== mathGame.index ||
      ![myPeerId, targetConn.peer].includes(playerId) ||
      mathGame.correctPlayers.has(playerId)) return;
  const question = mathGame.questions[mathGame.index];
  if (data.answer !== question.answer) {
    if (playerId === myPeerId) {
      $("#mathStatus").textContent = "答错了，本题暂时没有得分，还可以再试。";
      $("#mathAnswer").value = "";
      $("#mathAnswer").focus();
      setMathPlayerStatus(playerId, "答错，继续答题", true);
    } else {
      sendData({ type: "mathWrong", gameId: mathGame.id, playerId });
      setMathPlayerStatus(playerId, "答错，继续答题", true);
    }
    return;
  }
  const first = mathGame.correctPlayers.size === 0;
  const correctPlayers = [...mathGame.correctPlayers, playerId];
  const scores = {
    ...mathGame.scores,
    [playerId]: mathGame.scores[playerId] + (first ? 2 : 1)
  };
  const judgement = {
    type: "mathJudgement",
    gameId: mathGame.id,
    index: mathGame.index,
    playerId,
    first,
    correctPlayers,
    scores
  };
  applyMathJudgement(judgement);
  sendData(judgement);
  if (mathGame.correctPlayers.size === 2) {
    mathGame.advancing = true;
    clearTimeout(mathGame.questionTimer);
    renderMathProgress();
    $("#mathStatus").textContent = "本题答完，准备下一题……";
    mathGame.advanceTimer = setTimeout(advanceMathQuestion, 1000);
  }
}

function receiveMathJudgement(from, data) {
  if (!mathGame || mathGame.host || from !== mathGame.hostId ||
      data.gameId !== mathGame.id || data.index !== mathGame.index ||
      ![myPeerId, from].includes(data.playerId) ||
      typeof data.first !== "boolean" ||
      !Array.isArray(data.correctPlayers) ||
      !data.correctPlayers.every(id => [myPeerId, from].includes(id)) ||
      !data.scores || !Number.isSafeInteger(data.scores[myPeerId]) ||
      !Number.isSafeInteger(data.scores[from])) return;
  applyMathJudgement(data);
}

function receiveMathPlayerStatus(from, data) {
  if (!mathGame || data.gameId !== mathGame.id ||
      !["答题中", "已提交", "答错，继续答题", "已答对"].includes(data.status)) return;
  if (mathGame.host && from === targetConn.peer && data.playerId === from) {
    setMathPlayerStatus(from, data.status, true);
  } else if (!mathGame.host && from === mathGame.hostId &&
      [myPeerId, from].includes(data.playerId)) {
    setMathPlayerStatus(data.playerId, data.status);
  }
}

function applyMathJudgement(data) {
  if (!mathGame || data.gameId !== mathGame.id || data.index !== mathGame.index) return;
  mathGame.correctPlayers = new Set(data.correctPlayers);
  mathGame.scores = { ...data.scores };
  mathGame.playerStatus[data.playerId] = "已答对";
  renderMathRound();
  const points = data.first ? 2 : 1;
  $("#mathStatus").textContent =
    `${data.playerId === myPeerId ? "你" : remoteNick}${data.first ? "先" : "后"}答对，本题 +${points} 分。`;
  if (!mathGame.host && mathGame.correctPlayers.size === 2) {
    mathGame.advancing = true;
    $("#mathStatus").textContent = "本题答完，等待下一题……";
  }
}

function receiveMathQuestion(from, data) {
  if (!mathGame || mathGame.host || from !== mathGame.hostId ||
      data.gameId !== mathGame.id || !Number.isInteger(data.index) ||
      !Number.isFinite(data.startedAt) ||
      data.index !== mathGame.index + 1 ||
      data.index >= mathGame.questions.length) return;
  beginMathQuestion(data.index, data.startedAt);
}

function advanceMathQuestion() {
  if (!mathGame || !mathGame.host) return;
  mathGame.advancing = true;
  renderMathProgress();
  const nextIndex = mathGame.index + 1;
  if (nextIndex >= mathGame.questions.length) {
    finishMathGame();
    return;
  }
  const startedAt = Date.now();
  sendData({ type: "mathQuestion", gameId: mathGame.id, index: nextIndex, startedAt });
  beginMathQuestion(nextIndex, startedAt);
}

function awardMathPrize(gameId, prize) {
  if (paidMathGames.has(gameId)) return true;
  let economy;
  try {
    economy = JSON.parse(readStorage(ECONOMY_KEY) || "{}");
  } catch (error) {
    console.error("无法读取积分数据：", error);
    return false;
  }
  const points = Number(economy.points);
  if (!Number.isSafeInteger(points) || points < 0 ||
      !Number.isSafeInteger(points + prize)) return false;
  economy.points = points + prize;
  if (!economy.inventory || typeof economy.inventory !== "object" || Array.isArray(economy.inventory)) {
    economy.inventory = {};
  }
  if (!writeStorage(ECONOMY_KEY, JSON.stringify(economy))) return false;
  paidMathGames.add(gameId);
  return true;
}

function finishMathGame() {
  if (!mathGame || !mathGame.host) return;
  const game = mathGame;
  clearTimeout(game.questionTimer);
  clearTimeout(game.advanceTimer);
  const localScore = game.scores[myPeerId];
  const remoteScore = game.scores[targetConn.peer];
  const winnerId = localScore === remoteScore ? "" : localScore > remoteScore ? myPeerId : targetConn.peer;
  const result = {
    type: "mathFinish",
    gameId: game.id,
    scores: game.scores,
    winnerId,
    prize: game.prize
  };
  sendData(result);
  showMathResult(result);
}

function receiveMathFinish(from, data) {
  const maxScore = mathGame ? mathGame.questions.length * 2 : 0;
  const localScore = data.scores && data.scores[myPeerId];
  const remoteScore = data.scores && data.scores[from];
  const expectedWinner = localScore === remoteScore ? ""
    : localScore > remoteScore ? myPeerId : from;
  if (!mathGame || mathGame.host || from !== mathGame.hostId ||
      data.gameId !== mathGame.id || !data.scores ||
      !Number.isSafeInteger(localScore) || localScore < 0 || localScore > maxScore ||
      !Number.isSafeInteger(remoteScore) || remoteScore < 0 || remoteScore > maxScore ||
      data.winnerId !== expectedWinner ||
      data.prize !== mathGame.prize) return;
  showMathResult(data);
}

function showMathResult(result) {
  if (!mathGame || result.gameId !== mathGame.id) return;
  const game = mathGame;
  game.finished = true;
  clearTimeout(game.questionTimer);
  clearInterval(game.timerInterval);
  clearTimeout(game.advanceTimer);
  game.scores = { ...result.scores };
  const winnerName = result.winnerId === myPeerId ? myNick
    : result.winnerId ? remoteNick : "";
  let status;
  if (!result.winnerId) {
    status = `比赛平局（${game.scores[myPeerId]}：${game.scores[targetConn.peer]}），本轮不发积分。`;
  } else if (result.winnerId === myPeerId) {
    status = awardMathPrize(game.id, game.prize)
      ? `你赢了！获得 ${game.prize} 积分。`
      : `你赢了！积分保存失败，请检查浏览器存储空间。`;
  } else {
    status = `${winnerName}获胜，得到 ${game.prize} 积分。`;
  }
  $("#mathQuestion").textContent = "本轮比赛结束";
  $("#mathProgressFill").style.width = "100%";
  $(".math-progress-track").setAttribute("aria-valuenow", "100");
  $("#mathProgressText").textContent = `完成 ${game.questions.length} / ${game.questions.length} 题`;
  $("#mathTimer").textContent = "00:00";
  $("#localPlayerStatus").textContent = `你：${result.winnerId === myPeerId ? "获胜" : result.winnerId ? "完成" : "平局"}`;
  $("#remotePlayerStatus").textContent =
    `${remoteNick}：${result.winnerId === targetConn.peer ? "获胜" : result.winnerId ? "完成" : "平局"}`;
  $("#mathScores").textContent =
    `${myNick}：${game.scores[myPeerId]} 分　${remoteNick}：${game.scores[targetConn.peer]} 分`;
  $("#mathStatus").textContent = status;
  mathGame = null;
  updateRoom();
  appendLog(status, "sys");
}

function cancelMathGame(message) {
  if (mathGame) {
    clearTimeout(mathGame.questionTimer);
    clearInterval(mathGame.timerInterval);
    clearTimeout(mathGame.advanceTimer);
  }
  mathGame = null;
  $("#mathQuestion").textContent = "串门成功后可以开始比赛。";
  $("#mathStatus").textContent = message;
  $("#mathScores").textContent = "";
  $("#mathProgressFill").style.width = "0%";
  $(".math-progress-track").setAttribute("aria-valuenow", "0");
  $("#mathProgressText").textContent = "等待串门连接";
  $("#mathTimer").textContent = "--:--";
  $("#localPlayerStatus").textContent = "你：未开始";
  $("#remotePlayerStatus").textContent = "对方：未开始";
  updateRoom();
}

function sendChat() {
  const input = $("#chatInput");
  const text = input.value.trim();
  if (!text || !targetConn || !targetConn.open) {
    if (text) appendLog("还没有连上对方。", "sys");
    return;
  }
  if (sendData({ type: "chat", content: text })) {
    appendLog(`【我】${text}`, "me");
    input.value = "";
  }
}

function closeConn() {
  if (!targetConn) return;
  sendData({ type: "disconnect" });
  clearTimeout(connectionTimer);
  connectionTimer = null;
  targetConn = null;
  stopVisiting();
  remoteNick = "玩家";
  remoteCatName = "朋友的猫球";
  updateRoom();
  setRoomStatus("连接一位玩家后，可以邀请对方的猫球来串门。");
  appendLog("已断开与玩家的 GoEasy 连接，猫球回家了。", "sys");
}

$("#inviteButton").addEventListener("click", inviteCat);
$("#startMathButton").addEventListener("click", createMathGame);
$("#submitMathAnswer").addEventListener("click", submitMathAnswer);
$("#mathAnswer").addEventListener("keydown", event => {
  if (event.key === "Enter") submitMathAnswer();
});
window.addEventListener("storage", event => {
  if (event.key === CAT_NAME_KEY) {
    loadCatName();
  }
  if (event.key === ECONOMY_KEY) syncCosmetic();
});
window.addEventListener("beforeunload", () => {
  stopVisiting();
  if (goeasy) goeasy.disconnect({});
});

loadCatName();
updateCosmetics();
updateRoom();
</script>
</body>
</html>
