<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>世界时钟 · 地图选点</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    padding: 30px 20px 70px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #e6ecff;
    background:
      radial-gradient(1100px 600px at 10% -10%, #1e2a4a 0%, rgba(30,42,74,0) 60%),
      radial-gradient(900px 500px at 90% 0%, #1a2b46 0%, rgba(26,43,70,0) 55%),
      #05070d;
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  /* ================= 顶部 ================= */
  .page-head {
    max-width: 1240px;
    margin: 0 auto 22px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: clamp(22px, 3vw, 30px);
    letter-spacing: .1em;
    font-weight: 600;
    background: linear-gradient(90deg, #ffffff 10%, #8fb4ff 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub {
    margin: 6px 0 0;
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #6b7ca3;
  }
  .head-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .local-time {
    display: flex; align-items: baseline; gap: 10px;
    padding: 9px 16px; border-radius: 12px;
    background: rgba(24, 35, 60, .6);
    border: 1px solid rgba(120, 160, 255, .18);
  }
  .local-time .label { font-size: 12px; color: #7f90b5; letter-spacing: .1em; }
  .local-time .value {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 18px; color: #cfe0ff;
    font-variant-numeric: tabular-nums; letter-spacing: .06em;
  }
  .btn-ghost {
    padding: 9px 16px; border-radius: 12px; cursor: pointer;
    font-size: 13px; letter-spacing: .06em;
    color: #a8bde8; background: rgba(24, 35, 60, .6);
    border: 1px solid rgba(120, 160, 255, .18);
    transition: .2s;
  }
  .btn-ghost:hover { color: #fff; border-color: rgba(120,160,255,.5); background: rgba(40,58,96,.8); }

    max-width: 1240px;
    margin: 0 auto 30px;
    padding: 16px;
    border-radius: 22px;
    background: linear-gradient(160deg, rgba(22, 33, 57, .88), rgba(8, 12, 22, .92));
    border: 1px solid rgba(120, 160, 255, .16);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255,255,255,.05);
  }

    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; flex-wrap: wrap;
    padding: 4px 6px 14px;
  }
  .map-head h2 {
    margin: 0; font-size: 15px; font-weight: 600;
    letter-spacing: .08em; color: #cfe0ff;
  }
  .map-head p {
    margin: 5px 0 0; font-size: 12px; color: #6b7ca3; letter-spacing: .04em;
  }
  .map-hint {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; color: #7f95c8;
    padding: 6px 13px; border-radius: 999px;
    background: rgba(12, 20, 36, .8);
    border: 1px solid rgba(120, 160, 255, .14);
    white-space: nowrap;
  }
  .map-box {
    position: relative;
    border-radius: 15px;
    overflow: hidden;
    background: #060a14;
    border: 1px solid rgba(90, 130, 210, .16);
  }
  #worldMap { display: block; width: 100%; height: auto; cursor: crosshair; }

  .ocean { fill: #0a1120; }
  .graticule { stroke: rgba(120, 160, 255, .07); stroke-width: .8; fill: none; }
  .land {
    fill: #22304b;
    stroke: #3f5686;
    stroke-width: .8;
    stroke-linejoin: round;
    transition: fill .22s ease;
  }
  #worldMap:hover .land { fill: #273a5b; }

  .map-marker { pointer-events: auto; cursor: pointer; }
  .map-marker .dot {
    fill: #6d9bff; stroke: #dbe8ff; stroke-width: 1.1;
    transition: fill .2s;
  }
  .map-marker:hover .dot { fill: #a7c2ff; }
  .map-marker .pulse {
    fill: none; stroke: #6d9bff; stroke-width: 1.4;
    animation: markerPulse 2.2s ease-out infinite;
  }
  .map-marker text {
    font-size: 11px; font-weight: 500;
    fill: #dbe8ff;
    text-anchor: middle;
    paint-order: stroke;
    stroke: #05080f; stroke-width: 3.2; stroke-linejoin: round;
    pointer-events: none;
  }
  @keyframes markerPulse {
    0%   { r: 5;  opacity: .85; }
    100% { r: 17; opacity: 0; }
  }
  #mapCursor { display: none; pointer-events: none; }
  #mapCursor circle { fill: none; stroke: #6d9bff; stroke-width: 1.2; opacity: .55; }
  #mapCursor line { stroke: #6d9bff; stroke-width: .7; opacity: .3; }

  /* ================= 时钟网格 ================= */
  .clocks {
    max-width: 1240px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
    gap: 18px;
  }

  .clock-card {
    position: relative;
    padding: 16px 14px 14px;
    border-radius: 20px;
    text-align: center;
    background: linear-gradient(160deg, rgba(32, 45, 74, .9), rgba(11, 16, 28, .92));
    border: 1px solid rgba(120, 160, 255, .14);
    box-shadow: 0 14px 34px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .06);
    transition: transform .28s ease, border-color .28s ease, box-shadow .28s ease,
                opacity .26s ease;
    animation: cardIn .38s cubic-bezier(.2,.9,.3,1.2) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(12px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }
  .clock-card.leaving { opacity: 0; transform: scale(.9); }
  .clock-card:hover {
    transform: translateY(-5px);
    border-color: rgba(120, 160, 255, .42);
    box-shadow: 0 20px 44px rgba(0, 0, 0, .6), 0 0 50px rgba(79, 124, 255, .14);
  }
  .clock-card.flash { animation: flashRing .85s ease 2; }
  @keyframes flashRing {
    0%, 100% { box-shadow: 0 14px 34px rgba(0,0,0,.5); }
    50% { box-shadow: 0 0 0 3px rgba(109,155,255,.85), 0 0 40px rgba(109,155,255,.45); }
  }

  .remove {
    position: absolute; top: 7px; right: 7px;
    width: 22px; height: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; cursor: pointer;
    font-size: 15px; color: #8ea3cc;
    background: rgba(10, 16, 28, .75);
    border: 1px solid rgba(120, 160, 255, .2);
    opacity: .4; transition: .2s;
  }
  .clock-card:hover .remove { opacity: 1; }
  .remove:hover { color: #ff8b96; border-color: rgba(255, 93, 108, .6); background: rgba(60, 16, 26, .9); }

  .city { font-size: 16px; font-weight: 600; letter-spacing: .05em; }
  .region {
    margin-top: 4px;
    font-size: 10.5px;
    letter-spacing: .08em;
    color: #65759a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .dial-wrap { margin: 12px auto 0; width: 100%; max-width: 176px; }
  .dial { display: block; width: 100%; height: auto; filter: drop-shadow(0 6px 14px rgba(0,0,0,.55)); }

  .hour-hand   { stroke: #eaf1ff; stroke-width: 5.5; stroke-linecap: round; }
  .minute-hand { stroke: #a7bce8; stroke-width: 3.4; stroke-linecap: round; }
  .second-hand {
    stroke: #ff5d6c; stroke-width: 1.7; stroke-linecap: round;
    filter: drop-shadow(0 0 4px rgba(255, 93, 108, .9));
  }
  .cap-outer { fill: #ff5d6c; }
  .cap-inner { fill: #0a101d; }

  .digital {
    margin-top: 12px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 19px; letter-spacing: .07em;
    color: #d3e2ff; font-variant-numeric: tabular-nums;
  }
  .foot {
    margin-top: 5px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; color: #7485aa; letter-spacing: .04em;
  }
  .foot .daynight { color: #a9bde0; }
  .foot .daynight.night { color: #7f95c8; }

  .empty-tip {
    grid-column: 1 / -1;
    text-align: center;
    padding: 46px 20px;
    color: #5c6c92;
    font-size: 13.5px;
    letter-spacing: .08em;
    border: 1px dashed rgba(120, 160, 255, .18);
    border-radius: 18px;
  }

  @media (max-width: 560px) {
    body { padding: 20px 12px 50px; }
    .clocks { grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 13px; }
    .digital { font-size: 17px; }
    .map-panel { padding: 10px; }
    .map-head p { display: none; }
  }
</style>
</head>

    </div>
    <div class="map-hint" id="mapHint">移动鼠标查看经纬度</div>
  </div>

  <div class="map-box">
    <svg id="worldMap" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="oceanGrad" cx="50%" cy="42%" r="72%">
          <stop offset="0%"   stop-color="#0e1830"/>
          <stop offset="100%" stop-color="#060a14"/>
        </radialGradient>
      </defs>
      <rect class="ocean" x="0" y="0" width="1000" height="500" fill="url(#oceanGrad)"/>
      <g id="gridGroup"></g>
      <g id="landGroup"></g>
      <g id="markerGroup"></g>
      <g id="mapCursor">
        <line id="cursorH" x1="0" y1="0" x2="0" y2="0"/>
        <line id="cursorV" x1="0" y1="0" x2="0" y2="0"/>
        <circle id="cursorDot" cx="0" cy="0" r="9"/>
      </g>
    </svg>
  </div>
</section>

<main class="clocks" id="clocks"></main>

  function distKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
  }

    let fmt = offFmtCache.get(timeZone);
    if (!fmt) {
      fmt = new Intl.DateTimeFormat('en-US', {
        timeZone, hour12: false,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
      offFmtCache.set(timeZone, fmt);
    }
    const p = {};
    for (const part of fmt.formatToParts(date)) p[part.type] = part.value;
    let h = parseInt(p.hour, 10);
    if (h === 24) h = 0;
    const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, h, +p.minute, +p.second);
    return Math.round((asUTC - date.getTime()) / 60000);
  }

  function utcText(offsetMin) {
    const sign = offsetMin < 0 ? '-' : '+';
    const abs = Math.abs(offsetMin);
    return 'UTC' + sign + pad(Math.floor(abs / 60)) + ':' + pad(abs % 60);
  }

  /* =========================================================
     4. 绘制地图
     ========================================================= */
  const mapSvg     = document.getElementById('worldMap');
  const gridGroup  = document.getElementById('gridGroup');
  const landGroup  = document.getElementById('landGroup');
  const markerGroup= document.getElementById('markerGroup');
  const mapHint    = document.getElementById('mapHint');
  const cursorG    = document.getElementById('mapCursor');
  const cursorDot  = document.getElementById('cursorDot');
  const cursorH    = document.getElementById('cursorH');
  const cursorV    = document.getElementById('cursorV');

  // 经纬网
  (function drawGraticule() {
    let d = '';
    for (let lon = -180; lon <= 180; lon += 30) {
      const x = project(lon, 0).x;
      d += `M${x} 0 V${H} `;
    }
    for (let lat = -60; lat <= 60; lat += 30) {
      const y = project(0, lat).y;
      d += `M0 ${y} H${W} `;
    }
    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('class', 'graticule');
    path.setAttribute('d', d);
    gridGroup.appendChild(path);
  })();

  // 大陆
  LAND.forEach(coords => {
    const d = coords.map(([lon, lat], i) => {
      const p = project(lon, lat);
      return (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1);
    }).join(' ') + ' Z';

    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('class', 'land');
    path.setAttribute('d', d);
    landGroup.appendChild(path);
  });

  function clientToSvg(evt) {
    const pt = mapSvg.createSVGPoint();
    pt.x = evt.clientX;
    pt.y = evt.clientY;
    const m = mapSvg.getScreenCTM();
    if (!m) return null;
    return pt.matrixTransform(m.inverse());
  }

  /* =========================================================
     5. 时钟卡片
     ========================================================= */
  const clocksRoot = document.getElementById('clocks');
  const localTimeEl = document.getElementById('localTime');
  const clockList = [];   // 正在显示的时钟
  let dialUid = 0;
  let clockId = 0;

  function buildDialSVG() {
    const id = ++dialUid;
    const faceId  = 'face'  + id;
    const bezelId = 'bezel' + id;
    const glossId = 'gloss' + id;

    let ticks = '';
    for (let i = 0; i < 60; i++) {
      const a = (i * 6) * Math.PI / 180;
      const major = i % 5 === 0;
      const r1 = major ? 74 : 81;
      const r2 = 87;
      const sin = Math.sin(a), cos = Math.cos(a);
      ticks += `<line x1="${(100 + r1 * sin).toFixed(2)}" y1="${(100 - r1 * cos).toFixed(2)}"
                      x2="${(100 + r2 * sin).toFixed(2)}" y2="${(100 - r2 * cos).toFixed(2)}"
                      stroke="${major ? '#c9d8ff' : '#4a5b80'}"
                      stroke-width="${major ? 2.6 : 1}" stroke-linecap="round"/>`;
    }

    let nums = '';
    for (let i = 1; i <= 12; i++) {
      const a = (i * 30) * Math.PI / 180;
      const r = 61;
      nums += `<text x="${(100 + r * Math.sin(a)).toFixed(2)}"
                     y="${(100 - r * Math.cos(a)).toFixed(2)}"
                     text-anchor="middle" dominant-baseline="central"
                     font-family="Georgia, 'Times New Roman', serif" font-size="16"
                     fill="#93a8d4">${i}</text>`;
    }

    return `
<svg class="dial" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <radialGradient id="${faceId}" cx="42%" cy="30%" r="80%">
      <stop offset="0%"   stop-color="#25315a"/>
      <stop offset="55%"  stop-color="#141c33"/>
      <stop offset="100%" stop-color="#080c16"/>
    </radialGradient>
    <linearGradient id="${bezelId}" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#5570a8"/>
      <stop offset="30%"  stop-color="#1b2438"/>
      <stop offset="70%"  stop-color="#141b2b"/>
      <stop offset="100%" stop-color="#5570a8"/>
    </linearGradient>
    <radialGradient id="${glossId}" cx="34%" cy="20%" r="58%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#${bezelId})"/>
  <circle cx="100" cy="100" r="92" fill="url(#${faceId})"/>
  <circle cx="100" cy="100" r="92" fill="url(#${glossId})"/>
  <circle cx="100" cy="100" r="91.5" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="1"/>
  ${ticks}
  ${nums}
  <line class="hour-hand"   x1="100" y1="110" x2="100" y2="50"/>
  <line class="minute-hand" x1="100" y1="114" x2="100" y2="32"/>
  <line class="second-hand" x1="100" y1="120" x2="100" y2="26"/>
  <circle class="cap-outer" cx="100" cy="100" r="5.5"/>
  <circle class="cap-inner" cx="100" cy="100" r="2"/>
</svg>`;
  }

  function updateEmptyTip() {
    const tip = clocksRoot.querySelector('.empty-tip');
    if (clockList.length === 0 && !tip) {
      const d = document.createElement('div');
      d.className = 'empty-tip';
      d.textContent = '还没有时钟 —— 在上方地图上点击一个地区开始吧';
      clocksRoot.appendChild(d);
    } else if (clockList.length > 0 && tip) {
      tip.remove();
    }
  }

  /* ---------- 添加时钟 ---------- */
  function addClock(opt) {
    const { tz, label, lon, lat } = opt;

    // 同一时区已存在 → 高亮提示
    const exist = clockList.find(c => c.tz === tz);
    if (exist) {
      flashCard(exist.card);
      exist.card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    const id = ++clockId;

    const card = document.createElement('article');
    card.className = 'clock-card';
    card.innerHTML = `
      <button class="remove" type="button" title="移除时钟">×</button>
      <div class="city">${escapeHTML(label)}</div>
      <div class="region" title="${escapeHTML(tz)}">${escapeHTML(tz)}</div>
      <div class="dial-wrap">${buildDialSVG()}</div>
      <div class="digital">--:--:--</div>
      <div class="foot">
        <span class="daynight"></span>
        <span class="utc"></span>
      </div>
    `;
    clocksRoot.appendChild(card);

    const clock = {
      id, tz, label, lon, lat,
      card,
      fmt: new Intl.DateTimeFormat('en-GB', {
        timeZone: tz, hour12: false,
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      }),
      hourEl:   card.querySelector('.hour-hand'),
      minuteEl: card.querySelector('.minute-hand'),
      secondEl: card.querySelector('.second-hand'),
      digitalEl:card.querySelector('.digital'),
      utcEl:    card.querySelector('.utc'),
      daynightEl: card.querySelector('.daynight'),
      h: 0, m: 0, s: 0, secKey: -1,
      marker: null
    };

    card.querySelector('.remove').addEventListener('click', () => removeClock(id));
    clockList.push(clock);

    addMarker(clock);
    updateEmptyTip();

    // 首次渲染立即显示时间
    refreshClockText(clock, new Date());
    return clock;
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function flashCard(card) {
    card.classList.remove('flash');
    void card.offsetWidth;   // 重置动画
    card.classList.add('flash');
  }

  /* ---------- 移除时钟 ---------- */
  function removeClock(id) {
    const idx = clockList.findIndex(c => c.id === id);
    if (idx < 0) return;
    const c = clockList[idx];
    clockList.splice(idx, 1);

    if (c.marker) c.marker.remove();
    c.card.classList.add('leaving');
    setTimeout(() => {
      c.card.remove();
      updateEmptyTip();
    }, 260);
  }

  /* ---------- 地图标记 ---------- */
  function addMarker(clock) {
    const { x, y } = project(clock.lon, clock.lat);

    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'map-marker');
    g.setAttribute('transform', ''); // 保持独立

    const pulse = document.createElementNS(SVGNS, 'circle');
    pulse.setAttribute('class', 'pulse');
    pulse.setAttribute('cx', x); pulse.setAttribute('cy', y); pulse.setAttribute('r', 5);

    const dot = document.createElementNS(SVGNS, 'circle');
    dot.setAttribute('class', 'dot');
    dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('r', 4.5);

    const text = document.createElementNS(SVGNS, 'text');
    text.setAttribute('x', x);
    text.setAttribute('y', y - 11);
    text.textContent = clock.label;

    g.appendChild(pulse);
    g.appendChild(dot);
    g.appendChild(text);

    g.addEventListener('click', evt => {
      evt.stopPropagation();
      flashCard(clock.card);
      clock.card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    markerGroup.appendChild(g);
    clock.marker = g;
  }

  /* =========================================================
     6. 地图交互
     ========================================================= */
  mapSvg.addEventListener('mousemove', evt => {
    const pt = clientToSvg(evt);
    if (!pt) return;
    const lon = pt.x / W * 360 - 180;
    const lat = 90 - pt.y / H * 180;

    mapHint.textContent = `${Math.abs(lat).toFixed(1)}°${lat >= 0 ? 'N' : 'S'}  ` +
                          `${Math.abs(lon).toFixed(1)}°${lon >= 0 ? 'E' : 'W'}`;

    cursorG.style.display = 'block';
    cursorDot.setAttribute('cx', pt.x);
    cursorDot.setAttribute('cy', pt.y);
    cursorH.setAttribute('x1', 0);
    cursorH.setAttribute('y1', pt.y);
    cursorH.setAttribute('x2', W);
    cursorH.setAttribute('y2', pt.y);
    cursorV.setAttribute('x1', pt.x);
    cursorV.setAttribute('y1', 0);
    cursorV.setAttribute('x2', pt.x);
    cursorV.setAttribute('y2', H);
  });

  mapSvg.addEventListener('mouseleave', () => {
    cursorG.style.display = 'none';
    mapHint.textContent = '移动鼠标查看经纬度';
  });

  mapSvg.addEventListener('click', evt => {
    const pt = clientToSvg(evt);
    if (!pt) return;

    let lon = pt.x / W * 360 - 180;
    let lat = 90 - pt.y / H * 180;
    lon = Math.max(-180, Math.min(180, lon));
    lat = Math.max(-85, Math.min(85, lat));

    // 找最近的城市
    let best = null, bestD = Infinity;
    for (const c of CITIES) {
      const d = distKm(lat, lon, c.lat, c.lon);
      if (d < bestD) { bestD = d; best = c; }
    }

    if (best && bestD <= SNAP_KM) {
      addClock({ tz: best.tz, label: best.name, lon: best.lon, lat: best.lat });
    } else {
      // 远离城市的海洋 / 偏远地区：按经度推算固定偏移时区
      let n = Math.round(lon / 15);
      n = Math.max(-12, Math.min(12, n));
      let tz;
      if (n === 0)       tz = 'Etc/GMT';
      else if (n > 0)    tz = 'Etc/GMT-' + n;   // 注意：Etc/GMT 的符号是反的
      else               tz = 'Etc/GMT+' + (-n);

      const label = 'UTC' + (n >= 0 ? '+' : '-') + pad(Math.abs(n)) + ' 区';
      addClock({ tz, label, lon, lat });
    }
  });

  /* =========================================================
     7. 时间刷新
     ========================================================= */
  function refreshClockText(c, now) {
    let h = 0, m = 0, s = 0;
    for (const p of c.fmt.formatToParts(now)) {
      if (p.type === 'hour')        h = parseInt(p.value, 10) % 24;
      else if (p.type === 'minute') m = parseInt(p.value, 10);
      else if (p.type === 'second') s = parseInt(p.value, 10);
    }
    c.h = h; c.m = m; c.s = s;

    c.digitalEl.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
    c.utcEl.textContent = utcText(tzOffsetMinutes(now, c.tz));

    const isDay = h >= 6 && h < 18;
    c.daynightEl.textContent = isDay ? '☀ 白天' : '☾ 夜晚';
    c.daynightEl.classList.toggle('night', !isDay);
  }

  let lastLocalKey = -1;

  function loop() {
    const now = new Date();
    const ms = now.getMilliseconds();
    const secKey = Math.floor(now.getTime() / 1000);

    // 顶部本地时间
    if (lastLocalKey !== secKey) {
      lastLocalKey = secKey;
      localTimeEl.textContent =
        pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    }

    for (let i = 0; i < clockList.length; i++) {
      const c = clockList[i];

      if (c.secKey !== secKey) {
        c.secKey = secKey;
        refreshClockText(c, now);
      }

      const sec  = c.s + ms / 1000;
      const min  = c.m + sec / 60;
      const hour = (c.h % 12) + min / 60;

      c.secondEl.setAttribute('transform', 'rotate(' + (sec * 6).toFixed(3) + ' 100 100)');
      c.minuteEl.setAttribute('transform', 'rotate(' + (min * 6).toFixed(3) + ' 100 100)');
      c.hourEl.setAttribute('transform',   'rotate(' + (hour * 30).toFixed(3) + ' 100 100)');
    }

    requestAnimationFrame(loop);
  }

  /* =========================================================
     8. 初始状态
     ========================================================= */
  document.getElementById('clearAll').addEventListener('click', () => {
    [...clockList].forEach(c => removeClock(c.id));
  });

  (function bootstrap() {
    const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const initial = [];
    const localCity = CITIES.find(c => c.tz === localTz);
    if (localCity) initial.push(localCity);

    ['北京', '伦敦', '纽约'].forEach(name => {
      const c = CITIES.find(x => x.name === name);
      if (c && !initial.includes(c)) initial.push(c);
    });

    initial.slice(0, 4).forEach(c => {
      addClock({ tz: c.tz, label: c.name, lon: c.lon, lat: c.lat });
    });

    updateEmptyTip();
    requestAnimationFrame(loop);
  })();

})();
</script>
</body>
</html>
