<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大字日历 · 农历与倒数日</title>
<!-- 农历库改为动态多源加载，见脚本 loadLunarLib() -->
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-soft: #22262f;
    --text: #f2f3f5;
    --muted: #9aa0aa;
    --accent: #ff6b6b;
    --accent-soft: #ffb4b4;
    --gold: #f6c453;
    --line: #2e3340;
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 20% 0%, #1e2430 0%, var(--bg) 45%);
    color: var(--text);
    font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 28px 18px 64px;
    display: flex;
    justify-content: center;
  }

  .app { width: 100%; max-width: 760px; }

  .hero { text-align: center; padding: 12px 0 34px; }

  .hero-weekday {
    color: var(--muted);
    font-size: 15px;
    letter-spacing: 4px;
    margin-bottom: 10px;
  }

  .hero-date {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    line-height: 1;
  }

  .hero-year {
    font-size: clamp(24px, 6vw, 36px);
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 2px;
  }

  .hero-month-day {
    font-size: clamp(76px, 22vw, 128px);
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(180deg, #ffffff 0%, #c9d2e3 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-variant-numeric: tabular-nums;
  }

  .hero-lunar {
    margin-top: 16px;
    font-size: clamp(22px, 5.5vw, 32px);
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 2px;
  }

  .hero-ganzhi {
    margin-top: 8px;
    font-size: 15px;
    color: var(--muted);
    letter-spacing: 2px;
  }

  .section-title {
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 2px;
    margin: 0 0 14px 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .section-title span:last-child {
    font-size: 12px;
    color: #6b7280;
    letter-spacing: 0;
  }

  .fixed-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 34px;
  }

  .fixed-card {
    background: linear-gradient(145deg, var(--card), var(--card-soft));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 18px;
    position: relative;
    overflow: hidden;
  }

  .fixed-card::after {
    content: "";
    position: absolute;
    right: -30px;
    bottom: -40px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(246, 196, 83, 0.06);
    pointer-events: none;
  }

  .fixed-label {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .fixed-days {
    font-size: 46px;
    font-weight: 800;
    color: var(--accent-soft);
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
    position: relative;
    z-index: 1;
  }

  .fixed-days small {
    font-size: 15px;
    font-weight: 500;
    color: var(--muted);
    margin-left: 4px;
  }

  .fixed-date {
    margin-top: 8px;
    font-size: 12px;
    color: #6b7280;
  }

  .custom-form {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .custom-form input {
    flex: 1 1 200px;
    background: var(--card-soft);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    font-family: inherit;
  }

  .custom-form input:focus { border-color: var(--accent); }

  .custom-form input[type="date"] {
    flex: 0 1 180px;
    color-scheme: dark;
  }

  .custom-form button {
    background: var(--accent);
    border: none;
    border-radius: 14px;
    padding: 14px 24px;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.2s, transform 0.2s;
  }

  .custom-form button:hover { opacity: 0.85; }
  .custom-form button:active { transform: scale(0.97); }

  .custom-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .custom-item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .custom-item-info { flex: 1; min-width: 0; }

  .custom-item-name {
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .custom-item-date {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  .custom-item-days {
    font-size: 28px;
    font-weight: 800;
    color: var(--accent-soft);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .custom-item-days small {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-left: 2px;
  }

  .fixed-days,
  .custom-item-days {
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    display: inline-block;
    padding: 3px 7px;
    margin: -3px -7px;
    border-radius: 10px;
    transform-origin: center;
    will-change: transform, opacity;
    transition: background 0.25s ease, filter 0.25s ease;
  }

  .fixed-days:hover,
  .custom-item-days:hover {
    background: rgba(255, 255, 255, 0.055);
  }

  .fixed-days.past,
  .custom-item-days.past {
    color: #6b7280;
  }

  .num-text {
    font-size: 0.72em;
    letter-spacing: 3px;
  }

  .delete-btn {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 10px;
    width: 32px;
    height: 32px;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: border-color 0.2s, color 0.2s;
  }

  .delete-btn:hover { border-color: var(--accent); color: var(--accent); }

  .empty-tip {
    text-align: center;
    color: #5b6270;
    font-size: 14px;
    padding: 30px 0;
    border: 1px dashed var(--line);
    border-radius: 16px;
  }

  @media (max-width: 520px) {
    .fixed-grid { grid-template-columns: 1fr; }
    .custom-form input[type="date"] { flex: 1 1 100%; }
    .custom-form button { flex: 1 1 100%; }
    .custom-item-days { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="app">

  <section class="hero">
    <div class="hero-weekday" id="weekday">—</div>
    <div class="hero-date">
      <span class="hero-year" id="year">—</span>
      <span class="hero-month-day" id="monthDay">—</span>
    </div>
    <div class="hero-lunar" id="lunar">—</div>
    <div class="hero-ganzhi" id="ganzhi">—</div>
  </section>

  <div class="section-title">
    <span>固定倒数日</span>
    <span>点击天数切换单位</span>
  </div>
  <div class="fixed-grid">
    <div class="fixed-card">
      <div class="fixed-label">元旦 · 2027</div>
      <div class="fixed-days" id="daysToNewYear" data-key="newYear" title="点击切换单位：天 / 周 / 月 / 年">—</div>
      <div class="fixed-date">2027 年 1 月 1 日</div>
    </div>
    <div class="fixed-card">
      <div class="fixed-label">除夕 · 2027</div>
      <div class="fixed-days" id="daysToEve" data-key="eve" title="点击切换单位：天 / 周 / 月 / 年">—</div>
      <div class="fixed-date">2027 年 2 月 5 日（腊月二十九）</div>
    </div>
  </div>

  <div class="section-title">
    <span>自定义倒数日</span>
    <span id="customCount">0 个事件</span>
  </div>

  <div class="custom-form">
    <input type="text" id="eventName" placeholder="事件名称，如：生日、旅行…" maxlength="40">
    <input type="date" id="eventDate">
    <button id="addBtn">添加</button>
  </div>

  <div class="custom-list" id="customList"></div>

</div>

<script>
(function () {
  "use strict";

  // ============================================================
  // 基础工具
  // ============================================================
  var MS_PER_DAY = 86400000;
  var DAYS_PER_MONTH = 30.436875;
  var DAYS_PER_YEAR = 365.2425;

  var UNIT_CYCLE = ["day", "week", "month", "year"];
  var UNIT_LABEL = { day: "天", week: "周", month: "月", year: "年" };

  function normalizeUnit(u) {
    return UNIT_CYCLE.indexOf(u) >= 0 ? u : "day";
  }

  function nextUnit(u) {
    u = normalizeUnit(u);
    return UNIT_CYCLE[(UNIT_CYCLE.indexOf(u) + 1) % UNIT_CYCLE.length];
  }

  function todayStart() {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function daysUntil(targetDate) {
    var t = new Date(targetDate + "T00:00:00");
    t.setHours(0, 0, 0, 0);
    return Math.round((t - todayStart()) / MS_PER_DAY);
  }

  function formatDate(dateStr) {
    var d = new Date(dateStr + "T00:00:00");
    return d.getFullYear() + " 年 " + (d.getMonth() + 1) + " 月 " + d.getDate() + " 日";
  }

  function trimNum(n) {
    return n.toFixed(1).replace(/\.0$/, "");
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function genId() {
    return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // ============================================================
  // 农历库：多 CDN 兜底动态加载
  // ============================================================
  var LUNAR_CDNS = [
    "https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.4/lunar.min.js",
    "https://fastly.jsdelivr.net/npm/lunar-javascript@1.6.4/lunar.min.js",
    "https://unpkg.com/lunar-javascript@1.6.4/lunar.min.js"
  ];

  var lunarLoadState = "loading"; // loading | ok | fail

  function loadScriptOnce(url) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = url;
      s.async = true;
      s.onload = function () { resolve(true); };
      s.onerror = function () { reject(new Error("load fail: " + url)); };
      document.head.appendChild(s);
    });
  }

  function loadLunarLib() {
    if (typeof window.Solar !== "undefined") {
      lunarLoadState = "ok";
      return Promise.resolve(true);
    }
    var i = 0;
    function tryNext() {
      if (i >= LUNAR_CDNS.length) {
        lunarLoadState = "fail";
        return Promise.resolve(false);
      }
      var url = LUNAR_CDNS[i++];
      return loadScriptOnce(url).then(function () {
        if (typeof window.Solar !== "undefined") {
          lunarLoadState = "ok";
          return true;
        }
        return tryNext();
      }).catch(function () {
        return tryNext();
      });
    }
    return Promise.resolve().then(tryNext);
  }

  // ============================================================
  // 数值 → HTML（含单位切换）
  // ============================================================
  function buildDaysHTML(diff, unit) {
    if (diff === 0) {
      return '<span class="num-text">今天</span>';
    }

    var abs = Math.abs(diff);
    var suffix = diff < 0 ? "前" : "";
    var num, label;

    unit = normalizeUnit(unit);

    if (unit === "week") {
      num = trimNum(abs / 7);
      label = UNIT_LABEL.week + suffix;
    } else if (unit === "month") {
      num = trimNum(abs / DAYS_PER_MONTH);
      label = UNIT_LABEL.month + suffix;
    } else if (unit === "year") {
      num = trimNum(abs / DAYS_PER_YEAR);
      label = UNIT_LABEL.year + suffix;
    } else {
      num = String(abs);
      label = UNIT_LABEL.day + suffix;
    }

    return num + "<small>" + label + "</small>";
  }

  // ============================================================
  // 丝滑的数字切换动画
  // ============================================================
  function animateSwap(el, newHTML) {
    if (!el.animate) {
      el.innerHTML = newHTML;
      return;
    }

    var token = (el._swapToken || 0) + 1;
    el._swapToken = token;

    if (el._swapAnim) {
      el._swapAnim.cancel();
      el._swapAnim = null;
      el.innerHTML = newHTML;
      el.animate(
        [{ transform: "scale(0.92)" }, { transform: "scale(1)" }],
        { duration: 200, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
      );
      return;
    }

    var out = el.animate(
      [
        { transform: "translateY(0) scale(1)", opacity: 1 },
        { transform: "translateY(-45%) scale(0.9)", opacity: 0 }
      ],
      { duration: 150, easing: "cubic-bezier(0.4, 0, 1, 1)", fill: "forwards" }
    );
    el._swapAnim = out;

    out.onfinish = function () {
      if (el._swapToken !== token) return;
      out.cancel();
      el._swapAnim = null;
      el.innerHTML = newHTML;

      var inn = el.animate(
        [
          { transform: "translateY(45%) scale(0.9)", opacity: 0 },
          { transform: "translateY(0) scale(1)", opacity: 1 }
        ],
        { duration: 280, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
      );
      el._swapAnim = inn;

      inn.onfinish = function () {
        if (el._swapToken !== token) return;
        inn.cancel();
        el._swapAnim = null;
      };
    };
  }

  // ============================================================
  // 农历渲染（公历始终渲染，农历失败有降级提示）
  // ============================================================
  function renderLunar() {
    var now = new Date();

    // 公历部分：不依赖任何外部库
    document.getElementById("year").textContent = now.getFullYear() + " 年";
    document.getElementById("monthDay").textContent =
      (now.getMonth() + 1) + " 月 " + now.getDate() + " 日";

    var weekdays = ["日", "一", "二", "三", "四", "五", "六"];
    document.getElementById("weekday").textContent = "星期" + weekdays[now.getDay()];

    var lunarEl = document.getElementById("lunar");
    var ganzhiEl = document.getElementById("ganzhi");

    if (typeof window.Solar === "undefined") {
      if (lunarLoadState === "fail") {
        lunarEl.textContent = "农历加载失败";
        ganzhiEl.textContent = "可检查 Edge 跟踪防护或刷新重试";
      } else {
        lunarEl.textContent = "农历加载中…";
        ganzhiEl.textContent = "";
      }
      return;
    }

    try {
      var solar = window.Solar.fromDate(now);
      var lunar = solar.getLunar();
      lunarEl.textContent = lunar.getMonthInChinese() + "月" + lunar.getDayInChinese();
      ganzhiEl.textContent = lunar.getYearInGanZhi() + "年 · " + lunar.getYearShengXiao() + "年";
    } catch (e) {
      lunarEl.textContent = "农历解析失败";
      ganzhiEl.textContent = "";
      if (window.console) console.error(e);
    }
  }

  // ============================================================
  // 固定倒数日
  // ============================================================
  var FIXED = {
    newYear: { date: "2027-01-01", elId: "daysToNewYear" },
    eve: { date: "2027-02-05", elId: "daysToEve" }
  };

  var FIXED_UNITS_KEY = "big_calendar_fixed_units_v1";

  function loadFixedUnits() {
    try {
      var raw = localStorage.getItem(FIXED_UNITS_KEY);
      var obj = raw ? JSON.parse(raw) : {};
      return (obj && typeof obj === "object") ? obj : {};
    } catch (e) {
      return {};
    }
  }

  function saveFixedUnits(units) {
    try {
      localStorage.setItem(FIXED_UNITS_KEY, JSON.stringify(units));
    } catch (e) { /* 忽略 */ }
  }

  var fixedUnits = loadFixedUnits();

  function renderFixedOne(key, animated) {
    var conf = FIXED[key];
    if (!conf) return;
    var el = document.getElementById(conf.elId);
    if (!el) return;

    var diff = daysUntil(conf.date);
    var unit = normalizeUnit(fixedUnits[key]);
    var html = buildDaysHTML(diff, unit);

    if (animated) {
      animateSwap(el, html);
    } else {
      el.innerHTML = html;
    }

    el.classList.toggle("past", diff < 0);
  }

  function renderFixedCountdowns(animated) {
    Object.keys(FIXED).forEach(function (key) {
      renderFixedOne(key, animated);
    });
  }

  function initFixedClicks() {
    Object.keys(FIXED).forEach(function (key) {
      var el = document.getElementById(FIXED[key].elId);
      if (!el) return;
      el.addEventListener("click", function () {
        fixedUnits[key] = nextUnit(fixedUnits[key]);
        saveFixedUnits(fixedUnits);
        renderFixedOne(key, true);
      });
    });
  }

  // ============================================================
  // 自定义倒数日
  // ============================================================
  var STORAGE_KEY = "big_calendar_custom_events_v1";

  function loadCustomEvents() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }

  function saveCustomEvents(events) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    } catch (e) { /* 忽略 */ }
  }

  function ensureEventFields(events) {
    var changed = false;
    events.forEach(function (ev) {
      if (!ev.id) { ev.id = genId(); changed = true; }
      if (!ev.unit) { ev.unit = "day"; changed = true; }
    });
    if (changed) saveCustomEvents(events);
    return events;
  }

  function sortEvents(events) {
    return events.slice().sort(function (a, b) {
      var da = daysUntil(a.date);
      var db = daysUntil(b.date);
      var aPast = da < 0 ? 1 : 0;
      var bPast = db < 0 ? 1 : 0;
      if (aPast !== bPast) return aPast - bPast;
      return da - db;
    });
  }

  function renderCustomEvents() {
    var events = ensureEventFields(loadCustomEvents());
    var list = document.getElementById("customList");
    var countEl = document.getElementById("customCount");

    countEl.textContent = events.length + " 个事件";

    if (!events.length) {
      list.innerHTML = '<div class="empty-tip">还没有自定义倒数日，在上方添加一个吧</div>';
      return;
    }

    var sorted = sortEvents(events);
    var html = "";

    sorted.forEach(function (ev) {
      var diff = daysUntil(ev.date);
      html +=
        '<div class="custom-item">' +
          '<div class="custom-item-info">' +
            '<div class="custom-item-name">' + escapeHtml(ev.name) + '</div>' +
            '<div class="custom-item-date">' + formatDate(ev.date) + '</div>' +
          '</div>' +
          '<div class="custom-item-days' + (diff < 0 ? ' past' : '') + '"' +
               ' data-id="' + ev.id + '"' +
               ' title="点击切换单位：天 / 周 / 月 / 年">' +
            buildDaysHTML(diff, ev.unit) +
          '</div>' +
          '<button class="delete-btn" data-id="' + ev.id + '" title="删除">&times;</button>' +
        '</div>';
    });

    list.innerHTML = html;
  }

  function deleteEvent(id) {
    var events = loadCustomEvents().filter(function (x) { return x.id !== id; });
    saveCustomEvents(events);
    renderCustomEvents();
  }

  function initCustomListDelegation() {
    var list = document.getElementById("customList");

    list.addEventListener("click", function (e) {
      var daysEl = e.target.closest ? e.target.closest(".custom-item-days") : null;
      if (daysEl && daysEl.dataset.id) {
        var id = daysEl.dataset.id;
        var events = ensureEventFields(loadCustomEvents());
        var ev = null;

        for (var i = 0; i < events.length; i++) {
          if (events[i].id === id) { ev = events[i]; break; }
        }
        if (!ev) return;

        ev.unit = nextUnit(ev.unit);
        saveCustomEvents(events);

        var diff = daysUntil(ev.date);
        animateSwap(daysEl, buildDaysHTML(diff, ev.unit));
        daysEl.classList.toggle("past", diff < 0);
        return;
      }

      var btn = e.target.closest ? e.target.closest(".delete-btn") : null;
      if (btn && btn.dataset.id) {
        deleteEvent(btn.dataset.id);
      }
    });
  }

  function addCustomEvent() {
    var nameInput = document.getElementById("eventName");
    var dateInput = document.getElementById("eventDate");
    var name = nameInput.value.trim();
    var date = dateInput.value;

    if (!name) {
      nameInput.focus();
      nameInput.style.borderColor = "#ff6b6b";
      setTimeout(function () { nameInput.style.borderColor = ""; }, 1200);
      return;
    }
    if (!date) {
      dateInput.focus();
      dateInput.style.borderColor = "#ff6b6b";
      setTimeout(function () { dateInput.style.borderColor = ""; }, 1200);
      return;
    }

    var events = ensureEventFields(loadCustomEvents());
    events.push({ id: genId(), name: name, date: date, unit: "day" });
    saveCustomEvents(events);

    nameInput.value = "";
    dateInput.value = "";
    renderCustomEvents();
  }

  document.getElementById("addBtn").addEventListener("click", addCustomEvent);
  document.getElementById("eventName").addEventListener("keydown", function (e) {
    if (e.key === "Enter") addCustomEvent();
  });

  // ============================================================
  // 初始化 & 跨天刷新（各模块独立容错）
  // ============================================================
  function refreshAll() {
    try { renderLunar(); } catch (e) { console.error("renderLunar", e); }
    try { renderFixedCountdowns(false); } catch (e) { console.error("renderFixed", e); }
    try { renderCustomEvents(); } catch (e) { console.error("renderCustom", e); }
  }

  initFixedClicks();
  initCustomListDelegation();

  // 先立即渲染一次（公历 + 倒数日），农历此时显示“加载中”
  refreshAll();

  // 动态加载农历库，成功/失败后重新渲染农历区域
  loadLunarLib().then(function () {
    try { renderLunar(); } catch (e) { console.error(e); }
  });

  // 跨天自动刷新
  var lastDayKey = new Date().toDateString();
  setInterval(function () {
    var key = new Date().toDateString();
    if (key !== lastDayKey) {
      lastDayKey = key;
      refreshAll();
    }
  }, 30000);

})();
</script>
</body>
</html>
