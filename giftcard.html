<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>礼品码兑换</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#111;color:#fff;height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:400px;background:#222;padding:30px;border-radius:16px}
h2{text-align:center;margin-bottom:24px}
input{width:100%;padding:14px 16px;border-radius:10px;border:none;font-size:16px;margin-bottom:16px}
button{width:100%;padding:14px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:0.6;cursor:not-allowed}
#msg{margin-top:16px;text-align:center;font-size:15px}
#pending{margin-top:10px;text-align:center;font-size:13px;line-height:1.6;min-height:18px}
</style>
<link rel="stylesheet" href="css/account.css">
<script src="js/account.js"></script>
</head>
<body>
<div class="box">
  <h2>礼品码兑换</h2>
  <input id="codeInput" placeholder="输入礼品码" />
  <button id="submitBtn">立即兑换</button>
  <div id="msg"></div>
  <div id="pending"></div>
</div>
<script>
const input = document.getElementById("codeInput");
const btn = document.getElementById("submitBtn");
const msg = document.getElementById("msg");
const pending = document.getElementById("pending");

function renderPending(){
  const count = window.CatballAccount && window.CatballAccount.getPendingGiftCount
    ? window.CatballAccount.getPendingGiftCount()
    : 0;
  pending.innerText = count ? `本机有 ${count} 个礼品码待同步，登录后会自动入账` : "";
}
window.addEventListener("catball:account-state", renderPending);
renderPending();

btn.onclick = async ()=>{
  const code = input.value.trim().toUpperCase();
  if(!code){
    msg.innerText = "请输入礼品码";
    msg.style.color="#f87171";
    return;
  }
  btn.disabled=true;
  msg.innerText="兑换中...";
  msg.style.color="#aaa";
  try{
    const data = await window.CatballAccount.redeem(code);
    if(data.queued){
      // 未登录：先存本机，等登录后自动同步，不强制立即登录
      msg.innerText = data.msg;
      msg.style.color = "#fbbf24";
      input.value="";
    }else{
      msg.innerText = data.ok && data.points > 0 ? `${data.msg}（+${data.points} 积分）` : (data.msg || "兑换失败");
      msg.style.color = data.ok ? "#4ade80" : "#f87171";
      if(data.ok) input.value="";
    }
    renderPending();
  }catch(e){
    console.error(e);
    msg.innerText="网络请求失败";
    msg.style.color="#f87171";
  }finally{
    btn.disabled=false;
  }
}
</script>
</body>
</html>
